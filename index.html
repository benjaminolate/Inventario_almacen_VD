<style>
/* Layout: app de una columna para celular, barra de navegación fija abajo, tarjetas solo donde separan cosas distintas */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526; --accent-soft:#fbefd2;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brandname{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brandname small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.demo-banner{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#1d1606;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.panbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent);color:#1d1606}
.panbtn svg{width:34px;height:34px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panbtn b{display:block;font-size:16px}
.panbtn small{display:block;font-size:13px;opacity:.8}
.mi svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea.input{resize:vertical}
a.btn{color:inherit;text-decoration:none;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
.livebox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.livebox video{width:100%;height:100%;object-fit:cover;display:block}
.liveline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livemsg{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;color:#fff;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.filebtn{position:relative;display:block;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.searchbar{display:flex;gap:8px}
.searchbar .input{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .lbl{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.item.tap{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.qty{font-family:var(--font-display);font-weight:600;font-size:20px;min-width:3ch;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sector{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.sector .name{font-weight:700;font-size:16px}
.sector .sub{font-size:13px;color:var(--muted);grid-column:1/-1}
.formula{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.countrow{display:grid;grid-template-columns:1fr 84px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.countrow .opts{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.countrow .input{text-align:center;font-weight:700;font-size:17px;padding:8px}
.countrow.off{opacity:.55}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper span{min-width:2.2ch;text-align:center;font-weight:700}
.total{font-family:var(--font-display);font-weight:800;font-size:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.diff{font-size:13px;font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
@media (max-width:380px){.kpi .num{font-size:24px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

<script>
(function(){
"use strict";
const KEY = "almacen-demo-v2";
const H = 3600e3, D = 24*H;
// Las reservas son del día: se borran solas a las 3 de la mañana
const RES_CUT_HOUR = 3;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const uid = () => Math.random().toString(36).slice(2, 10);

const SECTORS = ["Bebidas","Jugos","Lácteos","Abarrotes","Legumbres","Galletas","Conservas","Snacks","Aseo"];

// Catálogo precargado típico de almacén: [nombre, sector, precio venta, costo, popularidad 0-3]
const CATALOG = [
 ["Coca-Cola 1,5 L","Bebidas",1990,1300,3],["Coca-Cola 3 L","Bebidas",2990,2050,2],["Coca-Cola Zero 1,5 L","Bebidas",1990,1300,1],
 ["Sprite 1,5 L","Bebidas",1790,1150,1],["Fanta 1,5 L","Bebidas",1790,1150,1],["Pepsi 1,5 L","Bebidas",1690,1080,1],
 ["Bilz 1,5 L","Bebidas",1590,1000,1],["Pap 1,5 L","Bebidas",1590,1000,1],["Agua mineral sin gas 1,6 L","Bebidas",990,560,2],
 ["Agua mineral con gas 1,6 L","Bebidas",990,560,0],
 ["Jugo en caja naranja 1 L","Jugos",1290,820,2],["Jugo en caja durazno 1 L","Jugos",1290,820,1],["Jugo en caja piña 1 L","Jugos",1290,820,1],
 ["Néctar individual 200 ml","Jugos",450,260,2],["Jugo en polvo sobre","Jugos",150,80,2],
 ["Leche entera 1 L","Lácteos",1150,820,3],["Leche descremada 1 L","Lácteos",1150,820,1],["Yogur batido 125 g","Lácteos",350,210,2],
 ["Mantequilla 250 g","Lácteos",2490,1750,1],["Queso laminado 250 g","Lácteos",2990,2100,1],
 ["Arroz grado 2, 1 kg","Abarrotes",1490,980,2],["Fideos espirales 400 g","Abarrotes",790,480,2],["Fideos spaghetti 400 g","Abarrotes",790,480,2],
 ["Azúcar 1 kg","Abarrotes",1190,820,2],["Harina 1 kg","Abarrotes",1090,720,1],["Sal 1 kg","Abarrotes",490,280,1],
 ["Aceite maravilla 1 L","Abarrotes",2690,1890,2],["Té 20 bolsitas","Abarrotes",990,610,1],["Café instantáneo 170 g","Abarrotes",4990,3500,1],
 ["Pan de molde","Abarrotes",2190,1500,2],
 ["Lentejas 1 kg","Legumbres",1990,1350,1],["Porotos 1 kg","Legumbres",2490,1700,1],["Garbanzos 1 kg","Legumbres",2290,1550,1],
 ["Arvejas partidas 500 g","Legumbres",1190,780,0],
 ["Galletas de agua","Galletas",690,420,2],["Galletas de soda","Galletas",690,420,2],["Galletas rellenas chocolate","Galletas",590,350,3],
 ["Galletas rellenas vainilla","Galletas",590,350,2],["Galletas de vino","Galletas",890,560,1],
 ["Atún lomitos en lata","Conservas",2290,1550,1],["Jurel en lata","Conservas",1990,1300,1],["Choclo en lata","Conservas",1190,760,1],
 ["Salsa de tomate 200 g","Conservas",590,350,2],["Duraznos en almíbar","Conservas",1890,1250,0],
 ["Papas fritas 110 g","Snacks",1490,950,2],["Ramitas 90 g","Snacks",1090,690,1],["Maní salado 100 g","Snacks",990,620,1],
 ["Chocolate 100 g","Snacks",1390,900,2],["Chicle","Snacks",200,110,2],
 ["Papel higiénico 4 rollos","Aseo",2490,1700,1],["Lavaloza 500 ml","Aseo",1490,950,1],["Cloro 1 L","Aseo",990,600,1],
 ["Detergente en polvo 1 kg","Aseo",3490,2400,0],["Jabón de tocador","Aseo",450,270,1]
];

// Generador pseudoaleatorio con semilla, para que la demo siempre arranque igual
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

function atDay(daysAgo, hour, min){ const d = new Date(Date.now() - daysAgo*D); d.setHours(hour, min||0, 0, 0); return d.getTime(); }

function buildSeed(){
  const r = rng(42);
  const products = CATALOG.map((c, i) => ({ id:"p"+i, name:c[0], cat:c[1], price:c[2], cost:c[3], pop:c[4],
    barcode: i < 3 ? ["7800000000011","7800000000028","7800000000035"][i] : "", min: c[4] >= 2 ? 6 : 3,
    has:true, countQty:null, countAt:null, estimated:false }));
  const byName = n => products.find(p => p.name === n);
  byName("Agua mineral con gas 1,6 L").has = false;
  byName("Arvejas partidas 500 g").has = false;
  const movs = [];
  const now = Date.now();
  // Ventas de los últimos 5 días (incluido hoy hasta la hora actual)
  for (let d = 5; d >= 0; d--){
    for (const p of products){
      if (!p.has) continue;
      const n = [0.15, 0.6, 1.6, 3.2][p.pop];
      let k = Math.floor(n + r()*n);
      while (k-- > 0){
        const t = atDay(d, 9 + Math.floor(r()*12), Math.floor(r()*60));
        if (t > now - 5*60e3) continue;
        movs.push({ id:uid(), pid:p.id, type:"venta", qty: r() < 0.2 ? 2 : 1, at:t, price:p.price });
      }
    }
  }
  // Conteos ya hechos: Bebidas hace 3 días, Lácteos hace 2, Galletas ayer (al cierre)
  const counts = { "Bebidas":[3,20,30], "Lácteos":[2,20,15], "Galletas":[1,20,40] };
  const qtys = { "Coca-Cola 1,5 L":30,"Coca-Cola 3 L":12,"Coca-Cola Zero 1,5 L":9,"Sprite 1,5 L":10,"Fanta 1,5 L":8,"Pepsi 1,5 L":6,"Bilz 1,5 L":7,"Pap 1,5 L":6,"Agua mineral sin gas 1,6 L":18,
    "Leche entera 1 L":16,"Leche descremada 1 L":6,"Yogur batido 125 g":14,"Mantequilla 250 g":5,"Queso laminado 250 g":4,
    "Galletas de agua":15,"Galletas de soda":13,"Galletas rellenas chocolate":22,"Galletas rellenas vainilla":16,"Galletas de vino":8 };
  for (const [cat,[d,h,m]] of Object.entries(counts)){
    const t = atDay(d,h,m);
    for (const p of products.filter(p => p.cat === cat && p.has)){
      p.countQty = qtys[p.name] ?? 6; p.countAt = t;
      movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:t });
    }
  }
  // Una compra al proveedor después del conteo de Bebidas
  const coca = byName("Coca-Cola 1,5 L");
  movs.push({ id:uid(), pid:coca.id, type:"compra", qty:24, at:atDay(2,11,15), cost:1300, supplier:"Distribuidora Ejemplo" });
  const agua = byName("Agua mineral sin gas 1,6 L");
  movs.push({ id:uid(), pid:agua.id, type:"compra", qty:12, at:atDay(2,11,15), cost:560, supplier:"Distribuidora Ejemplo" });
  movs.sort((a,b) => a.at - b.at);
  // Si alguna venta deja un producto contado en negativo, se elimina (la demo debe ser coherente)
  for (const p of products){
    if (p.countAt == null) continue;
    let s = p.countQty;
    for (const m of movs.filter(m => m.pid === p.id && m.at > p.countAt)){
      if (m.type === "compra") s += m.qty;
      if (m.type === "venta"){ if (s - m.qty < 1 && p.pop < 3){ m.drop = true; } else s -= m.qty; }
    }
  }
  return Object.assign({ products, movs: movs.filter(m => !m.drop), seededAt: now }, seedExtras());
}

// Fiados, aviso del pan y reservas (datos ficticios de ejemplo; los clientes no tienen celular para no escribirle a nadie real)
function resSeedAt(i){ const cut = resCutoff(), now = Date.now(); return Math.round(cut + (now - cut) * (i + 1) / 6); }
function seedExtras(){
  return {
    clients: [
      { id:"c1", name:"Ana Ejemplo", phone:"", items:[
        { id:uid(), type:"fiado", amount:4580, note:"Pan, leche y mantequilla", at:atDay(4,9,10) },
        { id:uid(), type:"fiado", amount:2990, note:"Coca-Cola 3 L", at:atDay(2,19,40) },
        { id:uid(), type:"abono", amount:3000, note:"", at:atDay(1,12,5) } ] },
      { id:"c2", name:"Pedro Prueba", phone:"", items:[
        { id:uid(), type:"fiado", amount:6200, note:"Cigarros y bebida", at:atDay(6,20,15) },
        { id:uid(), type:"fiado", amount:3700, note:"Pan y jamón", at:atDay(3,8,50) },
        { id:uid(), type:"fiado", amount:2500, note:"Galletas y jugo", at:atDay(0,10,30) } ] },
      { id:"c3", name:"Carla Demo", phone:"", items:[
        { id:uid(), type:"fiado", amount:1990, note:"Leche y yogur", at:atDay(5,18,0) },
        { id:uid(), type:"abono", amount:1990, note:"", at:atDay(2,18,30) } ] }
    ],
    panMsg: "🍞 ¡Llegó el pan calentito! Marraquetas y hallullas recién salidas. Los esperamos en el almacén.",
    reservas: [
      { id:uid(), name:"Ana Ejemplo", detail:"10 marraquetas, 4 hallullas", at:resSeedAt(0), done:true },
      { id:uid(), name:"Luis Ficticio", detail:"6 hallullas", at:resSeedAt(1), done:false },
      { id:uid(), name:"Carla Demo", detail:"4 pan amasado, 2 dobladitas", at:resSeedAt(2), done:false },
      { id:uid(), name:"Jorge Prueba", detail:"15 marraquetas", at:resSeedAt(3), done:false }
    ]
  };
}

// ---------- Modo: demo (datos en este navegador) o tienda (base de datos compartida) ----------
const CFG = window.ALMACEN_CONFIG || {};
const DB_READY = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
const SB_SRC = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js";
let MODE = null;      // "demo" | "db"; null mientras se inicia sesión
let sb = null;        // cliente de Supabase
const isDB = () => MODE === "db";

let S;
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); } } catch(e){}
  if (!S) S = buildSeed();
  if (!S.clients){ Object.assign(S, seedExtras()); save(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const ui = { view:"inicio", cart:[], recv:{ supplier:"Distribuidora Ejemplo", items:[] }, sector:null, draft:{}, prodFilter:"Todos", prodQuery:"", histFilter:"todos" };

const P = id => S.products.find(p => p.id === id);
function stockOf(p){
  if (isDB()) return p.stock;
  if (p.countAt == null) return null;
  let s = p.countQty;
  for (const m of S.movs){ if (m.pid !== p.id || m.at <= p.countAt) continue;
    if (m.type === "compra") s += m.qty; else if (m.type === "venta") s -= m.qty; }
  return s;
}
function pendingSales(p){ if (isDB()) return p.pend || 0; return S.movs.filter(m => m.pid === p.id && m.type === "venta").reduce((a,m)=>a+m.qty,0); }
function ago(t){
  const diff = Date.now() - t, d0 = new Date(); d0.setHours(0,0,0,0);
  const hm = new Date(t).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  if (t >= d0.getTime()) return "hoy " + hm;
  if (t >= d0.getTime() - D) return "ayer " + hm;
  const days = Math.ceil((d0.getTime() - t)/D);
  return new Date(t).toLocaleDateString("es-CL",{weekday:"long"}) + " " + hm + (days > 6 ? "" : "");
}
function stockPill(p){
  if (!p.has) return '<span class="pill none">No lo tenemos</span>';
  const s = stockOf(p);
  if (s == null) return '<span class="pill none">Sin contar</span>';
  const est = p.estimated ? " aprox." : "";
  if (s <= 0) return `<span class="pill bad">Agotado</span>`;
  if (s <= p.min) return `<span class="pill warn">Quedan ${s}${est}</span>`;
  return `<span class="pill ok">${s}${est} en stock</span>`;
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

const prodFromRow = r => ({ id:r.id, name:r.nombre, cat:r.sector, price:r.precio, cost:r.costo, min:r.minimo, barcode:r.codigo || "",

const movFromRow = r => ({ id:r.id, pid:r.producto_id, type:r.tipo, qty:r.cantidad, price:r.precio, cost:r.costo, supplier:r.proveedor, expected:r.esperado, at:iso(r.at), user:r.usuario_id });

const hoyChile = (plusDays = 0) => new Intl.DateTimeFormat("en-CA", { timeZone:"America/Santiago" }).format(new Date(Date.now() + plusDays*D));

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("sin conexión")); document.head.appendChild(s); }); }
async function q(req){ const { data, error } = await req; if (error) throw error; return data; }
// Supabase entrega hasta 1000 filas por consulta: se piden de a bloques
async function all(build){ const out = []; for (let from = 0; ; from += 1000){ const rows = await q(build().range(from, from + 999)); out.push(...rows); if (rows.length < 1000) return out; } }
function upsert(list, obj){ const cur = list.find(x => x.id === obj.id); if (cur) return Object.assign(cur, obj); list.push(obj); return obj; }
function friendly(e){
  const m = (e && (e.message || e.error_description)) || String(e || "");
  if (e?.code === "23505") return "Ese código de barras ya está en otro producto";
  if (/Failed to fetch|NetworkError|Load failed|sin conexión/i.test(m)) return "Sin conexión a internet. No se guardó; intenta de nuevo.";
  if (/Invalid login credentials/i.test(m)) return "Usuario o contraseña incorrectos";
  if (/already registered/i.test(m)) return "Ese usuario ya existe";
  if (/Password should be/i.test(m)) return "La contraseña debe tener al menos 6 caracteres";
  return m || "Algo salió mal";
}
let busy = false;
async function run(fn){ if (busy) return; busy = true; try { return await fn(); } catch(e){ console.error(e); toast(friendly(e)); } finally { busy = false; } }

async function dbLoadAll(){
  const since = new Date(Date.now() - 8*D).toISOString();
  const [prods, movs, clients, fiados, res, aj, panes, team] = await Promise.all([
    all(() => sb.from("productos_stock").select("*").order("nombre")),
    all(() => sb.from("movimientos").select("*").gte("at", since).order("at")),
    all(() => sb.from("clientes").select("*").order("creado")),
    all(() => sb.from("fiados").select("*").order("at")),
    all(() => sb.from("reservas").select("*").gte("dia", hoyChile()).order("creado")),
    q(sb.from("ajustes").select("*")),
    q(sb.from("panes").select("*").order("orden")),
    q(sb.from("perfiles").select("*").order("creado"))
  ]);
  const cs = clients.map(cliFromRow), byId = Object.fromEntries(cs.map(c => [c.id, c]));
  fiados.forEach(f => byId[f.cliente_id]?.items.push(fiaFromRow(f)));
  db.ajustes = Object.fromEntries(aj.map(a => [a.clave, a.valor]));
  db.panes = panes; db.team = Object.fromEntries(team.map(t => [t.id, t]));
  db.profile = db.team[db.profile.id] || db.profile;
  // Se reemplaza el contenido manteniendo los mismos objetos de productos, por si hay una ventana abierta
  const prev = S?.products || [];
  S = { products: prods.map(r => { const o = prodFromRow(r), cur = prev.find(p => p.id === o.id); return cur ? Object.assign(cur, o) : o; }),
    movs: movs.map(movFromRow), clients: cs, reservas: res.map(resFromRow), panMsg: db.ajustes.mensaje_pan || "" };
  db.loadedAt = Date.now();
}
async function fetchProducts(ids){
  ids = [...new Set(ids)].filter(Boolean); if (!ids.length) return;
  const rows = await q(sb.from("productos_stock").select("*").in("id", ids));
  rows.forEach(r => upsert(S.products, prodFromRow(r)));
}
// Trae los movimientos nuevos (los propios y los de otros celulares)
async function syncMovs(){
  const last = S.movs.reduce((a, m) => Math.max(a, m.at), Date.now() - 8*D);
  const rows = await all(() => sb.from("movimientos").select("*").gte("at", new Date(last - 60e3).toISOString()).order("at"));
  rows.forEach(r => { if (!S.movs.some(m => m.id === r.id)) S.movs.push(movFromRow(r)); });
  S.movs.sort((a, b) => a.at - b.at);
}
const later = { pids:new Set(), t:null, full:null };
function refreshSoon(pid){ later.pids.add(pid); clearTimeout(later.t); later.t = setTimeout(() => { const ids = [...later.pids]; later.pids.clear(); fetchProducts(ids).then(softRender, () => {}); }, 200); }
function reloadSoon(){ clearTimeout(later.full); later.full = setTimeout(() => dbLoadAll().then(softRender, () => {}), 400); }
// Redibuja sin interrumpir a quien está escribiendo en un campo
let renderWaiting = false;
function softRender(){
  if (!MODE) return;
  const a = document.activeElement;
  if (a && $("#app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
    if (!renderWaiting){ renderWaiting = true; a.addEventListener("blur", () => { renderWaiting = false; setTimeout(softRender, 50); }, { once:true }); }
    return;
  }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function dbSubscribe(){
  if (db.channel) sb.removeChannel(db.channel);
  const ch = db.channel = sb.channel("tienda");
  const on = (table, fn) => ch.on("postgres_changes", { event:"*", schema:"public", table }, fn);
  on("movimientos", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    if (!S.movs.some(m => m.id === r.id)){ S.movs.push(movFromRow(r)); S.movs.sort((a, b) => a.at - b.at); }
    refreshSoon(r.producto_id); });
  on("productos", ({ new:r, old:o }) => refreshSoon(r?.id || o?.id));
  on("clientes", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon();
    const c = S.clients.find(c => c.id === r.id); if (c) Object.assign(c, { name:r.nombre, phone:r.telefono || "" }); else S.clients.push(cliFromRow(r)); softRender(); });
  on("fiados", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    const c = S.clients.find(c => c.id === r.cliente_id); if (!c) return reloadSoon();
    if (!c.items.some(i => i.id === r.id)) c.items.push(fiaFromRow(r)); softRender(); });
  on("reservas", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon(); if (r.dia < hoyChile()) return;
    const isNew = !S.reservas.some(x => x.id === r.id); upsert(S.reservas, resFromRow(r));
    if (isNew && eventType === "INSERT"){ toast(`Nueva reserva de pan: ${r.nombre}`); try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch(e){} }
    softRender(); });
  on("ajustes", ({ new:r }) => { if (!r?.clave) return; db.ajustes[r.clave] = r.valor; if (r.clave === "mensaje_pan") S.panMsg = r.valor; softRender(); });
  on("perfiles", reloadSoon);
  on("panes", reloadSoon);
  // Al reconectarse (por ejemplo, el celular estuvo bloqueado) se recarga todo para no perder cambios
  ch.subscribe(st => { if (st === "SUBSCRIBED"){ if (db.joined) reloadSoon(); db.joined = true; } });
}

const act = {
  async sale(lines){
    if (!isDB()){ const now = Date.now(); lines.forEach(l => S.movs.push({ id:uid(), pid:l.pid, type:"venta", qty:l.qty, at:now, price:P(l.pid).price })); save(); return; }
    await q(sb.rpc("registrar_venta", { items: lines.map(l => ({ producto_id:l.pid, cantidad:l.qty, precio:P(l.pid).price })) }));
    await Promise.all([syncMovs(), fetchProducts(lines.map(l => l.pid))]);
  },
  async receive(supplier, items){
    items = items.filter(l => l.qty > 0);
    if (!isDB()){ const now = Date.now(); items.forEach(l => { const p = P(l.pid); p.cost = l.cost; p.has = true; S.movs.push({ id:uid(), pid:l.pid, type:"compra", qty:l.qty, at:now, cost:l.cost, supplier }); }); save(); return; }
    await q(sb.rpc("registrar_compra", { proveedor:supplier, items: items.map(l => ({ producto_id:l.pid, cantidad:l.qty, costo:l.cost })) }));
    await Promise.all([syncMovs(), fetchProducts(items.map(l => l.pid))]);
  },
  // draft: { pid: { qty, est, none } }. Devuelve cuántos se contaron y las diferencias
  async count(draft){
    const diffs = []; let n = 0;
    if (!isDB()){
      const now = Date.now();
      for (const [pid, d] of Object.entries(draft)){
        const p = P(pid);
        if (d.none === true){ p.has = false; continue; }
        if (d.none === false) p.has = true;
        if (d.qty === "" || d.qty == null) continue;
        const c = Math.max(0, parseInt(d.qty, 10) || 0);
        const expected = stockOf(p);
        if (expected != null && expected !== c) diffs.push([p, expected, c]);
        p.countQty = c; p.countAt = now; p.estimated = !!d.est; n++;
        S.movs.push({ id:uid(), pid, type:"conteo", qty:c, expected, at:now });
      }
      save(); return { n, diffs };
    }
    const items = Object.entries(draft).map(([pid, d]) => ({ producto_id:pid, cantidad: d.qty === "" || d.qty == null ? null : Math.max(0, parseInt(d.qty, 10) || 0),
      aproximado: !!d.est, ...(d.none === true ? { tiene:false } : d.none === false ? { tiene:true } : {}) }));
    if (!items.length) return { n, diffs };
    const rows = await q(sb.rpc("registrar_conteo", { items }));
    await Promise.all([syncMovs(), fetchProducts(items.map(i => i.producto_id))]);
    rows.forEach(r => { n++; if (r.esperado != null && r.esperado !== r.contado) diffs.push([P(r.producto_id), r.esperado, r.contado]); });
    return { n, diffs };
  },
  async updateProduct(p, f){
    if (!isDB()){ Object.assign(p, f); save(); return p; }
    const map = { name:"nombre", price:"precio", cost:"costo", min:"minimo", barcode:"codigo" }, cols = { actualizado:new Date().toISOString() };
    for (const k in f) if (map[k]) cols[map[k]] = k === "barcode" ? (f[k] || null) : f[k];
    await q(sb.from("productos").update(cols).eq("id", p.id));
    await fetchProducts([p.id]); return P(p.id);
  },
  async newProduct(f, qty){
    if (!isDB()){
      const p = { id:"n"+uid(), name:f.name, cat:f.cat, price:f.price, cost:Math.round(f.price*0.65), pop:0, barcode:f.barcode, min:3, has:true, countQty:null, countAt:null, estimated:false };
      if (qty !== ""){ p.countQty = Math.max(0, parseInt(qty,10)||0); p.countAt = Date.now(); S.movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:p.countAt }); }
      S.products.push(p); save(); return p;
    }
    const row = await q(sb.from("productos").insert({ nombre:f.name, sector:f.cat, precio:f.price, costo:Math.round(f.price*0.65), codigo:f.barcode || null }).select().single());
    if (qty !== "") await q(sb.rpc("registrar_conteo", { items:[{ producto_id:row.id, cantidad:Math.max(0, parseInt(qty,10)||0) }] }));
    await Promise.all([syncMovs(), fetchProducts([row.id])]);
    return P(row.id);
  },
  async newClient(name, phone){
    if (!isDB()){ const c = { id:"c"+uid(), name, phone, items:[] }; S.clients.push(c); save(); return c; }
    const row = await q(sb.from("clientes").insert({ nombre:name, telefono:phone }).select().single());
    return upsert(S.clients, cliFromRow(row));
  },
  async clientMov(c, type, amount, note){
    if (!isDB()){ c.items.push({ id:uid(), type, amount, note, at:Date.now() }); save(); return; }
    const row = await q(sb.from("fiados").insert({ cliente_id:c.id, tipo:type, monto:amount, nota:note }).select().single());
    if (!c.items.some(i => i.id === row.id)) c.items.push(fiaFromRow(row));
  },
  async setting(clave, valor){
    if (!isDB()) return;
    db.ajustes[clave] = valor;
    await q(sb.from("ajustes").upsert({ clave, valor }));
  },
  async panMsg(text){
    S.panMsg = text;
    if (!isDB()){ save(); return; }
    clearTimeout(act._pm); act._pm = setTimeout(() => act.setting("mensaje_pan", text).catch(e => toast(friendly(e))), 700);
  },
  async reserva(r, estado){
    if (!isDB()){ r.done = estado === "entregada"; save(); return; }
    const cols = { estado, entregado_at: estado === "entregada" ? new Date().toISOString() : null, entregado_por: estado === "entregada" ? db.profile.id : null };
    const row = await q(sb.from("reservas").update(cols).eq("id", r.id).select().single());
    upsert(S.reservas, resFromRow(row));
  }
};

// ---------- Escaneo de códigos de barras ----------
async function decodeFile(file){
  if ("BarcodeDetector" in window){
    try { const bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] });
      const bmp = await createImageBitmap(file); const r = await bd.detect(bmp); if (r.length) return r[0].rawValue; } catch(e){}
  }
  if (!window.ZXing) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    return zxingDecode(img, img.width, img.height, 1400, true);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
const zxCanvas = document.createElement("canvas");
function zxingDecode(src, sw, sh, maxSide, hard){
  if (!window.ZXing || !sw || !sh) return null;
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw*scale), h = Math.round(sh*scale);
  zxCanvas.width = w; zxCanvas.height = h;
  const cx = zxCanvas.getContext("2d", { willReadFrequently:true }); cx.drawImage(src, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) lum[i] = (px[i*4]*299 + px[i*4+1]*587 + px[i*4+2]*114) / 1000;
  const hints = new Map(); if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const tryDecode = s => { try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s))).getText(); } catch(e){ return null; } };
  const lsrc = new ZXing.RGBLuminanceSource(lum, w, h);
  return tryDecode(lsrc) || (hard && lsrc.isRotateSupported && lsrc.isRotateSupported() ? tryDecode(lsrc.rotateCounterClockwise()) : null);
}

// Cámara en vivo: funciona cuando la página se abre como sitio propio (https). Dentro de un visor que bloquea la cámara, se usa la foto.
let live = null;
function stopLive(){ if (!live) return; live.stop = true; live.stream?.getTracks().forEach(t => t.stop()); live = null; }
async function startLive(cb){
  stopLive();
  const box = $("#liveBox"); if (!box) return;
  if (!navigator.mediaDevices?.getUserMedia){ box.hidden = true; return; }
  const me = live = { stop:false, stream:null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
    if (me.stop){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#liveVideo"); v.srcObject = stream; await v.play().catch(() => {});
    box.hidden = false; $("#liveMsg").textContent = "Apunta al código de barras";
    let bd = null;
    if ("BarcodeDetector" in window){ try { bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); } catch(e){} }
    const tick = async () => {
      if (me.stop) return;
      let code = null;
      try {
        if (v.readyState >= 2){
          if (bd){ const r = await bd.detect(v); if (r.length) code = r[0].rawValue; }
          else code = zxingDecode(v, v.videoWidth, v.videoHeight, 800, false);
        }
      } catch(e){}
      if (me.stop) return;
      if (code){ if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){} stopLive(); handleCode(code, cb); return; }
      setTimeout(tick, bd ? 150 : 250);
    };
    tick();
  } catch(e){
    if (live === me) live = null;
    box.hidden = true;
    const note = $("#liveNote"); if (note) note.hidden = false;
  }
}
async function handleFile(input, cb){
  const f = input.files && input.files[0]; if (!f) return;
  toast("Leyendo código…");
  const code = await decodeFile(f);
  if (!code){ openScanSheet(cb, "No se pudo leer el código en la foto. Intenta acercarte más, con buena luz y el código derecho, o escríbelo a mano."); return; }
  handleCode(code, cb);
}
function handleCode(code, cb){
  code = String(code).trim(); if (!code) return;
  const p = S.products.find(p => p.barcode === code);
  if (p){ closeModal(); cb(p); return; }
  openAssociate(code, cb);
}

  openModal(`<div class="stack">
    <div class="spread"><h2>Escanear producto</h2><button class="btn ghost sm" data-close>Cerrar</button></div>

    <label class="btn primary block filebtn">Sacar foto al código de barras<input type="file" id="scanCam" accept="image/*" capture="environment"></label>
    <label class="btn block filebtn">Elegir una foto ya tomada<input type="file" id="scanPick" accept="image/*"></label>
    <p class="small muted" style="margin:0">Saca la foto de cerca, con buena luz y el código derecho. Si la cámara no se abre, saca la foto con la app de cámara y elígela con el segundo botón.</p>
    <div class="field"><label for="scanCode">O escribe el número del código</label>
      <div class="searchbar"><input class="input code" id="scanCode" inputmode="numeric" placeholder="7801234567890"><button class="btn" id="scanGo">Buscar</button></div></div>
    ${isDB() ? "" : `<div class="field"><label>Para probar la demo sin cámara</label>
      <div class="row"><button class="btn sm" data-code="7800000000011">Coca-Cola 1,5 L</button><button class="btn sm" data-code="7800000000028">Coca-Cola 3 L</button><button class="btn sm" data-code="7801234000099">Código nuevo</button></div></div>`}
  </div>`);
  if (!error) startLive(cb); else { const n = $("#liveNote"); if (n && !live) n.hidden = true; }
  $("#scanCam").onchange = e => { stopLive(); handleFile(e.target, cb); };
  $("#scanPick").onchange = e => handleFile(e.target, cb);

  document.querySelectorAll("[data-code]").forEach(b => b.onclick = () => handleCode(b.dataset.code, cb));
}
function openAssociate(code, cb){
  const render = q => {
    const items = S.products.filter(p => !p.barcode && p.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
    return items.map(p => `<button class="item tap" data-pid="${p.id}"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.cat)}</div></div><span class="btn sm">Es este</span></button>`).join("") || `<div class="empty">No hay coincidencias. Créalo como producto nuevo.</div>`;
  };
  openModal(`<div class="stack">
    <div class="spread"><h2>Código nuevo</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <p style="margin:0">El código <span class="code">${esc(code)}</span> todavía no está asociado a ningún producto. Elige cuál es y desde ahora se reconocerá solo.</p>
    <input class="input" id="assocQ" placeholder="Buscar en el catálogo, ej: lentejas">
    <div class="list" id="assocList">${render("")}</div>
    <button class="btn block" id="assocNew">+ Crear producto nuevo con este código</button>
  </div>`);
  const bind = () => document.querySelectorAll("#assocList [data-pid]").forEach(b => b.onclick = () => run(async () => {
    const p = await act.updateProduct(P(b.dataset.pid), { barcode:code }); closeModal(); toast(`Código asociado a ${p.name}`); cb(p); }));
  bind();
  $("#assocQ").oninput = e => { $("#assocList").innerHTML = render(e.target.value); bind(); };
  $("#assocNew").onclick = () => openProductForm(null, code, cb);
}

function viewInicio(){
  const avail = S.products.filter(p => p.has);

  const pct = Math.round(counted.length / avail.length * 100);

  const today = S.movs.filter(m => m.type === "venta" && m.at >= d0.getTime());
  const units = today.reduce((a,m)=>a+m.qty,0), money = today.reduce((a,m)=>a+m.qty*(m.price||P(m.pid).price),0);
  const low = counted.map(p => [p, stockOf(p)]).filter(([p,s]) => s <= p.min).sort((a,b)=>a[1]-b[1]);
  const week = {}; S.movs.filter(m => m.type==="venta" && m.at > Date.now()-7*D).forEach(m => week[m.pid] = (week[m.pid]||0) + m.qty);
  const top = Object.entries(week).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const sectorState = SECTORS.map(c => { const ps = avail.filter(p => p.cat===c); const done = ps.length && ps.every(p => p.countAt!=null); return `<span class="pill ${done?"ok":"none"}">${done?"✓ ":""}${esc(c)}</span>`; }).join(" ");
  const resPend = isDB() ? S.reservas.filter(r => r.dia === hoyChile() && r.estado === "pendiente") : [];
  return `${isDB() ? header(db.ajustes.tienda_nombre || "Almacén", "Sistema de inventario") : header("Almacén", "Sistema de inventario · demo")}
  <div class="stack">
    ${isDB() ? "" : `<div class="demo-banner"><span>Demo con datos ficticios de ejemplo.</span><button class="btn sm" id="reset">Reiniciar demo</button></div>`}
    <button class="panbtn" id="panbtn">${ICONS.pan}<span><b>Avisar que llegó el pan</b><small>Envía el mensaje al grupo de WhatsApp de clientes</small></span></button>
    ${resPend.length ? `<button class="sector" data-go="reservas"><span class="name">Reservas de pan de hoy</span><span class="pill warn">${resPend.length} por entregar</span><span class="sub">Toca para ver quién reservó y marcar lo entregado</span></button>` : ""}
    <div class="kpis">
      <div class="card kpi"><div class="num">${pct}%</div><div class="lbl">del inventario contado</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="card kpi"><div class="num">${clp(money)}</div><div class="lbl">vendido hoy · ${units} productos</div></div>
    </div>
    <div class="card stack">
      <div class="spread"><h3>Avance del conteo por sector</h3><button class="btn sm" data-go="contar">Contar</button></div>
      <div class="row">${sectorState}</div>
      <p class="small muted" style="margin:0">Cada sector queda al día desde su propio conteo. Mientras tanto, las ventas de todo se registran igual.</p>
    </div>
    <div class="card">
      <div class="spread"><h3>Por acabarse</h3><span class="small muted">${low.length} productos</span></div>
      <div class="list">${low.slice(0,6).map(([p,s]) => `<div class="item"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">Mínimo: ${p.min}</div></div>${stockPill(p)}</div>`).join("") || `<div class="empty">Nada bajo el mínimo.</div>`}</div>
    </div>
    <div class="card">
      <h3>Lo más vendido en 7 días</h3>
      <div class="list">${top.map(([id,q]) => `<div class="item"><div class="main"><div class="name">${esc(P(id).name)}</div><div class="sub">${esc(P(id).cat)}</div></div><div class="qty">${q}</div></div>`).join("")}</div>
    </div>
    <div class="card stack">
      <h3>Cómo calcula el stock</h3>
      <div class="formula">Stock = último conteo + compras − ventas desde ese conteo</div>
      <p class="small muted" style="margin:0">Por eso se puede contar un sector por día sin que nada quede desfasado: lo vendido antes del conteo no se descuenta, porque ya no estaba en la estantería.</p>
    </div>
  </div>`;
}

  const res = S.products.filter(p => (opts?.all || p.has) && (p.name.toLowerCase().includes(q) || p.barcode === q)).slice(0, 8);
  return res.map(p => `<button class="item tap" data-pick="${p.id}"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${clp(p.price)} · ${esc(p.cat)}</div></div>${stockPill(p)}</button>`).join("") || `<div class="empty">Sin resultados para “${esc(q)}”.</div>`;
}

function viewContar(){
  if (!ui.sector){
    return `${header("Contar sector", "Carga del stock, un sector a la vez")}
    <div class="stack">
      <p class="muted" style="margin:0">Elige el sector que vas a contar ahora. Lo ideal es contar al abrir o al cerrar, unos 20 a 30 minutos por sector.</p>
      ${SECTORS.map(c => { const ps = S.products.filter(p => p.cat===c && p.has); const done = ps.filter(p => p.countAt!=null);

        return `<button class="sector" data-sector="${esc(c)}"><span class="name">${esc(c)}</span>

          <span class="sub">${ps.length} productos · ${last ? "último conteo " + ago(last) : `${sold} ventas registradas mientras tanto`}</span></button>`; }).join("")}
    </div>`;
  }
  const ps = S.products.filter(p => p.cat === ui.sector);

    ${diffs.length ? `<div class="card"><h3>Diferencias con lo que esperaba el sistema</h3><div class="list">${diffs.map(([p,e,q]) => `<div class="item"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">Esperaba ${e}, contaste ${q}</div></div><span class="pill ${q<e?"bad":"ok"}">${q<e?`Faltan ${e-q}`:`Sobran ${q-e}`}</span></div>`).join("")}</div>

    <div class="spread"><h2>${esc(p.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>

      <div class="field"><label for="ep">Precio venta</label><input class="input" id="ep" type="number" value="${p.price}"></div>
      <div class="field"><label for="ec">Costo</label><input class="input" id="ec" type="number" value="${p.cost}"></div>
      <div class="field"><label for="em">Stock mínimo</label><input class="input" id="em" type="number" value="${p.min}"></div>
      <div class="field"><label for="eb">Código de barras</label><input class="input code" id="eb" value="${esc(p.barcode)}" placeholder="Sin código"></div>
    </div>

    .then(rows => { const el = $("#phist"); if (el) el.innerHTML = rows.map(r => movRow(movFromRow(r))).join("") || `<div class="empty">Sin movimientos.</div>`; }, () => {});

function openProductForm(sector, code, cb){
  openModal(`<div class="stack">
    <div class="spread"><h2>Agregar producto</h2><button class="btn ghost sm" data-close>Cerrar</button></div>

      <div class="field"><label for="ns">Sector</label><select class="input" id="ns">${SECTORS.map(c => `<option ${c===(sector||ui.sector)?"selected":""}>${esc(c)}</option>`).join("")}</select></div>

      <div class="field"><label for="nb">Código de barras</label><input class="input code" id="nb" value="${esc(code||"")}" placeholder="Opcional"></div>

    </div>
    <p class="small muted" style="margin:0">Si escribes la cantidad, el producto queda contado desde este momento.</p>
    <button class="btn primary block" id="nsave">Guardar producto</button>

function movRow(m){
  const p = P(m.pid); const nm = p ? esc(p.name) : "Producto";
  const who = isDB() && userName(m.user) ? " · " + esc(userName(m.user)) : "";
  if (m.type === "venta") return `<div class="item"><div class="main"><div class="name">${nm}</div><div class="sub">Venta · ${ago(m.at)}${who}</div></div><span class="diff" style="color:var(--bad)">−${m.qty}</span></div>`;
  if (m.type === "compra") return `<div class="item"><div class="main"><div class="name">${nm}</div><div class="sub">Compra${m.supplier?" a "+esc(m.supplier):""} · ${ago(m.at)}${who}</div></div><span class="diff" style="color:var(--ok)">+${m.qty}</span></div>`;
  const d = m.expected != null && m.expected !== m.qty ? ` · esperaba ${m.expected}` : "";
  return `<div class="item"><div class="main"><div class="name">${nm}</div><div class="sub">Conteo${d} · ${ago(m.at)}${who}</div></div><span class="pill ok">= ${m.qty}</span></div>`;
}

function waQuery(phone, text){ return (phone ? "phone=" + waPhone(phone) + "&" : "") + "text=" + encodeURIComponent(text); }
function waLink(phone, text){ return (IS_MOBILE ? "https://api.whatsapp.com/send?" : "whatsapp://send?") + waQuery(phone, text); }
function waWeb(phone, text){ return "https://web.whatsapp.com/send?" + waQuery(phone, text); }

async function createAccount(nombre, usuario, pass, client){
  const { data, error } = await client.auth.signUp({ email:userEmail(usuario), password:pass, options:{ data:{ nombre, usuario:usuario.trim().toLowerCase() } } });
  if (error) throw error;
  if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error("Ese usuario ya existe");
  return data;

// Respaldo: todas las tablas en un archivo JSON con la fecha en el nombre
async function downloadBackup(){
  const btn = $("#backup"); btn.disabled = true; btn.textContent = "Preparando respaldo…";
  try {
    const tables = ["productos","movimientos","clientes","fiados","reservas","panes","ajustes","perfiles"], data = {};
    for (const t of tables) data[t] = await all(() => sb.from(t).select("*").order(t === "ajustes" ? "clave" : "id"));
    const file = { tienda: db.ajustes.tienda_nombre || "Almacén", creado: new Date().toISOString(), version: 1, tablas: data };
    const url = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], { type:"application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = `respaldo-almacen-${hoyChile()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(`Respaldo descargado: ${data.movimientos.length} movimientos`);
  } finally { btn.disabled = false; btn.textContent = "Descargar respaldo"; }
}

  const opt = (go, icon, title, sub) => `<button class="sector" data-go="${go}"><span class="name" style="display:flex;gap:10px;align-items:center"><span style="width:22px;height:22px;display:inline-flex" class="mi">${ICONS[icon]}</span>${title}</span><span></span><span class="sub">${sub}</span></button>`;
  return `${header("Más", "Otras herramientas")}
  <div class="stack">
    ${opt("recibir","recibir","Recibir mercadería","Registrar lo que llega del proveedor")}
    ${opt("historial","historial","Historial","Todo lo que entra, sale y se cuenta")}
    ${opt("reservas","reservas","Reservas de pan", pend + " pendientes hoy" + (isDB() ? "" : " · vista previa"))}
    ${isDB() ? opt("equipo","equipo","Equipo y cuenta", `${esc(db.profile.nombre)} · ${isAdmin() ? "agregar personas y permisos" : "cambiar contraseña o salir"}`) : ""}
    <button class="sector" id="panbtn"><span class="name" style="display:flex;gap:10px;align-items:center"><span style="width:22px;height:22px;display:inline-flex" class="mi">${ICONS.pan}</span>Avisar que llegó el pan</span><span></span><span class="sub">Mensaje al grupo de WhatsApp de clientes</span></button>
  </div>`;
}

function bindSearch(onPick){
  const q = $("#q"), res = $("#res");
  const upd = () => { const h = searchResults(q.value); res.hidden = !h; res.innerHTML = h;
    res.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { onPick(P(b.dataset.pick)); }); };
  q.oninput = upd;
}

function render(){
  if (!MODE) return;
  if (!isDB()) purgeReservas();
  if (ui.view === "equipo" && !isDB()) ui.view = "mas";
  renderTabs();
  const v = ui.view, app = $("#app");
  app.innerHTML = ({ inicio:viewInicio, vender:viewVender, recibir:viewRecibir, contar:viewContar, productos:viewProductos, historial:viewHistorial, fiados:viewFiados, mas:viewMas,
    reservas: isDB() ? viewReservasDB : viewReservas, equipo:viewEquipo })[v]();
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const pb = $("#panbtn"); if (pb) pb.onclick = openPan;
  if (v === "fiados"){
    $("#addc").onclick = openNewClient;
    app.querySelectorAll("[data-client]").forEach(b => b.onclick = () => openCliente(S.clients.find(c => c.id === b.dataset.client)));
  }
  if (v === "reservas" && isDB()){
    app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => openReserva(S.reservas.find(r => r.id === b.dataset.res)));
    app.querySelectorAll("[data-rday]").forEach(b => b.onclick = () => { ui.resDay = b.dataset.rday; render(); });
    $("#rcopy").onclick = () => { try { navigator.clipboard.writeText(reservaLink()).then(() => toast("Link copiado"), () => toast(reservaLink())); } catch(e){ toast(reservaLink()); } };
    $("#ropen").onchange = e => run(async () => { await act.setting("reservas_abiertas", e.target.checked); render(); toast(e.target.checked ? "Reservas abiertas" : "Reservas cerradas"); });
    $("#rlim").onchange = e => run(async () => { await act.setting("reservas_hora_limite", +e.target.value); toast("Hora guardada"); });
  }
  if (v === "equipo"){
    $("#logout").onclick = () => run(async () => { await sb.auth.signOut(); location.reload(); });
    $("#mypass").onclick = openMyPass;
    if (isAdmin()){
      $("#backup").onclick = () => run(downloadBackup);
      $("#addu").onclick = openNuevaPersona;
      app.querySelectorAll("[data-user]").forEach(b => b.onclick = () => openPersona(db.team[b.dataset.user]));
      $("#tsave").onclick = () => run(async () => { const n = $("#tname").value.trim(); if (!n) return; await act.setting("tienda_nombre", n); toast("Nombre guardado"); });
    }
  }
  if (v === "reservas" && !isDB()){
    app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { const r = S.reservas.find(r => r.id === b.dataset.res); r.done = !r.done; save(); render(); });
    const rn = $("#rn"); rn.value = ui.resName || ""; rn.oninput = () => ui.resName = rn.value;
    const step = (b, d) => { ui.resQty[b] = Math.max(0, (ui.resQty[b]||0) + d); const y = window.scrollY; render(); window.scrollTo(0, y); };
    app.querySelectorAll("[data-binc]").forEach(x => x.onclick = () => step(x.dataset.binc, 1));
    app.querySelectorAll("[data-bdec]").forEach(x => x.onclick = () => step(x.dataset.bdec, -1));
    $("#rsave").onclick = () => { const name = rn.value.trim(); if (!name){ rn.focus(); toast("Escribe tu nombre"); return; }
      const detail = resDetail(ui.resQty); if (!detail) return;
      S.reservas.push({ id:uid(), name, detail, at:Date.now(), done:false }); ui.resQty = {}; ui.resName = ""; save(); render(); toast(`Reserva de ${name} recibida`); };
  }
  if (v === "inicio" && !isDB()){
    $("#reset").onclick = () => openModal(`<div class="stack"><h2>¿Reiniciar la demo?</h2><p style="margin:0">Se borran los cambios hechos y vuelven los datos de ejemplo.</p><div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="doreset">Reiniciar</button></div></div>`) || ($("#doreset").onclick = () => { S = buildSeed(); save(); ui.cart = []; ui.recv.items = []; ui.draft = {}; closeModal(); render(); toast("Demo reiniciada"); });
  }
  if (v === "vender"){
    bindSearch(addToCart);
    $("#scan").onclick = () => openScanSheet(p => { addToCart(p); toast(`+1 ${p.name}`); });
    app.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { ui.cart[b.dataset.inc].qty++; render(); });
    app.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const l = ui.cart[b.dataset.dec]; if (--l.qty <= 0) ui.cart.splice(b.dataset.dec,1); render(); });
    $("#confirm").onclick = () => run(async () => { const t = ui.cart.reduce((a,l) => a + l.qty*P(l.pid).price, 0);
      $("#confirm").disabled = true; $("#confirm").textContent = "Guardando…";
      await act.sale(ui.cart).finally(render);
      ui.cart = []; render(); toast(`Venta registrada: ${clp(t)}`); });
  }
  if (v === "recibir"){
    bindSearch(addToRecv);
    $("#sup").oninput = e => ui.recv.supplier = e.target.value;
    $("#scan").onclick = () => openScanSheet(p => addToRecv(p));
    app.querySelectorAll("[data-rq]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rq].qty = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rc]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rc].cost = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rq],[data-rc]").forEach(i => i.onchange = render);
    $("#confirm").onclick = () => run(async () => { const n = ui.recv.items.reduce((a,l) => a + (l.qty||0), 0);
      $("#confirm").disabled = true; $("#confirm").textContent = "Guardando…";
      await act.receive(ui.recv.supplier, ui.recv.items).finally(render);
      ui.recv.items = []; render(); toast(`Recepción guardada: ${n} unidades`); });
  }
  if (v === "contar"){
    app.querySelectorAll("[data-sector]").forEach(b => b.onclick = () => { ui.sector = b.dataset.sector; ui.draft = {}; render(); window.scrollTo(0,0); });
    if (ui.sector){
      $("#back").onclick = () => { ui.sector = null; render(); };
      app.querySelectorAll("[data-cq]").forEach(i => i.oninput = () => { (ui.draft[i.dataset.cq] ||= {}).qty = i.value; });
      app.querySelectorAll("[data-ce]").forEach(i => i.onchange = () => { (ui.draft[i.dataset.ce] ||= {}).est = i.checked; });
      app.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { const p = P(b.dataset.cn); const d = (ui.draft[p.id] ||= {}); const off = d.none ?? !p.has; d.none = !off; render(); });
      $("#scan").onclick = () => openScanSheet(p => {
        if (p.cat !== ui.sector) toast(`${p.name} es del sector ${p.cat}; se suma igual`); else toast(`+1 ${p.name}`);
        const d = (ui.draft[p.id] ||= {}); d.qty = String((parseInt(d.qty,10)||0) + 1); d.none = false; render(); });
      $("#addp").onclick = () => openProductForm(ui.sector, "", () => render());
      $("#finish").onclick = finishCount;
    }
  }
  if (v === "productos"){
    $("#pq").oninput = e => { ui.prodQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
    app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.prodFilter = b.dataset.f; render(); });
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProduct(P(b.dataset.open)));
    $("#addp").onclick = () => openProductForm(ui.prodFilter==="Todos" ? null : ui.prodFilter, "", null);
  }
  if (v === "historial"){
    app.querySelectorAll("[data-hf]").forEach(b => b.onclick = () => { ui.histFilter = b.dataset.hf; render(); });
  }
}
// ---------- Inicio: demo o tienda con inicio de sesión ----------
function gate(html){ MODE = null; $("nav.tabs").hidden = true; $("#app").innerHTML = html; window.scrollTo(0,0); }
const gateHead = () => header("Almacén", "Sistema de inventario");
const demoLink = `<a class="btn ghost block" style="text-align:center" href="?demo">Ver demo con datos ficticios</a>`;
function startDemo(){ MODE = "demo"; load(); $("nav.tabs").hidden = false; render(); }

// La misma página sirve de demo pública (para el CV) y de sistema de la tienda.
// En las direcciones de config.direccionesDemo se ve la demo, salvo que se abra con ?tienda
// (desde ahí ese navegador lo recuerda). En cualquier otra dirección se entra a la tienda.
const STORE_FLAG = "almacen-modo-tienda";
function storeDevice(on){ try { if (on === undefined) return localStorage.getItem(STORE_FLAG) === "1"; on ? localStorage.setItem(STORE_FLAG, "1") : localStorage.removeItem(STORE_FLAG); } catch(e){ return false; } }

async function boot(){
  const params = new URLSearchParams(location.search);
  if (params.has("tienda")) storeDevice(true);
  // En una dirección propia de la tienda (no la del CV) se entra directo a la tienda
  const cvHost = (CFG.direccionesDemo || []).includes(location.hostname);
  if (!DB_READY || params.has("demo") || (cvHost && !storeDevice())) return startDemo();
  gate(`${gateHead()}<div class="empty">Conectando…</div>`);
  try { await loadScript(SB_SRC); }
  catch(e){ return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Sin conexión</h2><p style="margin:0">No se pudo conectar con la base de datos de la tienda. Revisa el internet e intenta de nuevo.</p><button class="btn primary block" onclick="location.reload()">Reintentar</button></div>${demoLink}</div>`); }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth:{ storageKey:"almacen-sesion" } });
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && MODE) location.reload(); });
  const { data } = await sb.auth.getSession();
  if (data.session) return enterDB(data.session.user);
  showLogin();
}

async function showLogin(){
  let first = false;
  try { first = !(await q(sb.rpc("hay_admin"))); } catch(e){}
  gate(`${gateHead()}<div class="stack">
    ${first ? `<div class="card stack"><h2>Configurar la tienda</h2>
      <p class="small muted" style="margin:0">Todavía no hay cuentas. Crea la cuenta de la administradora: con ella se agregan después las demás personas.</p>
      <div class="field"><label for="an">Nombre</label><input class="input" id="an" placeholder="Ej: Rosa"></div>
      <div class="field"><label for="au">Usuario para entrar</label><input class="input" id="au" autocapitalize="none" autocomplete="username" placeholder="Ej: rosa"></div>
      <div class="field"><label for="ap">Contraseña (mínimo 6 caracteres)</label><input class="input" id="ap" type="password" autocomplete="new-password"></div>
      <button class="btn primary block" id="asave">Crear cuenta</button></div>`
    : `<form class="card stack" id="loginf"><h2>Entrar</h2>
      <div class="field"><label for="lu">Usuario</label><input class="input" id="lu" autocapitalize="none" autocomplete="username" required></div>
      <div class="field"><label for="lp">Contraseña</label><input class="input" id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn primary block" id="lgo">Entrar</button>
      <p class="small muted" style="margin:0">¿No tienes cuenta? Pídesela a la administradora de la tienda.</p></form>`}
    ${demoLink}
  </div>`);
  if (first){
    $("#asave").onclick = () => run(async () => {
      const n = $("#an").value.trim(), u = $("#au").value.trim(), pw = $("#ap").value;
      if (!n) return $("#an").focus(); if (!u) return $("#au").focus(); if (pw.length < 6) return toast("La contraseña debe tener al menos 6 caracteres");
      const data = await createAccount(n, u, pw, sb);
      if (!data.session) return toast("Cuenta creada, pero Supabase pide confirmar el correo. Desactiva \"Confirm email\" (ver guía) y entra.");
      enterDB(data.session.user);
    });
  } else {
    $("#loginf").onsubmit = e => { e.preventDefault(); run(async () => {
      const btn = $("#lgo"); btn.disabled = true; btn.textContent = "Entrando…";
      const { data, error } = await sb.auth.signInWithPassword({ email:userEmail($("#lu").value), password:$("#lp").value });
      btn.disabled = false; btn.textContent = "Entrar";
      if (error) throw error;
      enterDB(data.user);
    }); };
  }
}

async function enterDB(user){
  gate(`${gateHead()}<div class="empty">Cargando datos de la tienda…</div>`);
  try {
    const prof = await q(sb.from("perfiles").select("*").eq("id", user.id).maybeSingle());
    if (!prof || !prof.activo){ gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Cuenta sin acceso</h2>
      <p style="margin:0">Tu cuenta${prof ? ` (${esc(prof.usuario)})` : ""} existe, pero la administradora todavía no le da acceso, o se lo quitó.</p>
      <button class="btn primary block" id="retry">Revisar de nuevo</button><button class="btn block" id="out">Salir</button></div></div>`);
      $("#retry").onclick = () => enterDB(user); $("#out").onclick = () => sb.auth.signOut().then(() => location.reload());
      return;
    }
    db.profile = prof;
    await dbLoadAll();
  } catch(e){
    return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>No se pudieron cargar los datos</h2><p style="margin:0">${esc(friendly(e))}</p>
      <button class="btn primary block" onclick="location.reload()">Reintentar</button></div></div>`);
  }
  MODE = "db"; $("nav.tabs").hidden = false;
  dbSubscribe(); render();
}
// Al volver a la app después de un rato (celular bloqueado), se trae lo que cambió
document.addEventListener("visibilitychange", () => { if (isDB() && !document.hidden && Date.now() - db.loadedAt > 60e3) reloadSoon(); });

boot();
})();
</script>
