    app.querySelectorAll("[data-rq]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rq].qty = Math.max(0, r3(+i.value||0)); });
    app.querySelectorAll("[data-rc]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rc].cost = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rq],[data-rc]").forEach(i => i.onchange = renderKeepFocus);
    app.querySelectorAll("[data-rbox]").forEach(i => i.onchange = () => { const l = ui.recv.items[i.dataset.rbox], n = Math.max(2, l.n || 12);
      // Al cambiar entre unidades y cajas se convierten la cantidad y el costo
      if (i.checked){ l.box = true; l.n = n; l.qty = Math.max(1, Math.round(l.qty / n)); l.cost = l.cost * n; }
      else { l.box = false; l.qty = l.qty * n; l.cost = Math.round(l.cost / n); }
      render(); });
    app.querySelectorAll("[data-rn]").forEach(i => i.onchange = () => { const l = ui.recv.items[i.dataset.rn]; const n = Math.round(+i.value || 2); l.n = Math.min(1000, Math.max(2, n)); if (n !== l.n) toast(CAJA_MSG); renderKeepFocus(); });
    const rd = $("#rdiscard"); if (rd) rd.onclick = () => openModal(`<div class="stack"><h2>¿Descartar la recepción?</h2><p style="margin:0">Se borran los productos anotados y el proveedor elegido. No cambia el stock.</p><div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="rdgo">Descartar</button></div></div>`) || ($("#rdgo").onclick = () => { ui.recv = { supplier:"", provId:null, items:[] }; closeModal(); render(); toast("Recepción descartada"); });
    $("#confirm").onclick = () => run(async () => { const n = ui.recv.items.reduce((a,l) => a + (recvUnits(l)||0), 0);
      $("#confirm").disabled = true; $("#confirm").textContent = "Guardando…";
      // Un proveedor nuevo escrito a mano queda guardado en la lista
      if (ext("proveedores") && !ui.recv.provId && ui.recv.supplier.trim()) ui.recv.provId = (await act.saveProv(null, { name:ui.recv.supplier.trim(), phone:"", note:"" })).id;
      await act.receive(ui.recv.supplier, ui.recv.items, ui.recv.provId).finally(render);
      ui.recv.items = []; render(); toast(`Recepción guardada: ${n} unidades`); });
  }
  if (v === "contar"){
    app.querySelectorAll("[data-copen]").forEach(b => b.onclick = () => openProduct(P(b.dataset.copen)));
    app.querySelectorAll("[data-sector]").forEach(b => b.onclick = () => { ui.sector = b.dataset.sector; ui.draft = {}; render(); window.scrollTo(0,0); });
    if (ui.sector){
      $("#back").onclick = () => { ui.sector = null; render(); };
      app.querySelectorAll("[data-cq]").forEach(i => i.oninput = () => { (ui.draft[i.dataset.cq] ||= {}).qty = i.value; });
      app.querySelectorAll("[data-ce]").forEach(i => i.onchange = () => { (ui.draft[i.dataset.ce] ||= {}).est = i.checked; });
      app.querySelectorAll("[data-cmul]").forEach(b => b.onclick = () => openCountQty(P(b.dataset.cmul)));
      app.querySelectorAll("[data-cmode]").forEach(b => b.onclick = () => { countAsk(b.dataset.cmode === "q"); render(); });
      app.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { const p = P(b.dataset.cn); const d = (ui.draft[p.id] ||= {}); const off = d.none ?? !p.has; d.none = !off; render(); });
      $("#scan").onclick = () => openScanSheet(scanAction());
      if ($("#addp")) $("#addp").onclick = () => openProductForm(ui.sector, "", () => render());
      $("#finish").onclick = finishCount;
    }
  }
  if (v === "productos"){
    $("#pq").oninput = e => { ui.prodQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
    app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.prodFilter = b.dataset.f; render(); });
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProduct(P(b.dataset.open)));
    if ($("#addp")) $("#addp").onclick = () => openProductForm(SECTORS.includes(ui.prodFilter) ? ui.prodFilter : null, "", null);
  }
  if (v === "historial"){
    app.querySelectorAll("[data-hf]").forEach(b => b.onclick = () => { ui.histFilter = b.dataset.hf; render(); });
  }
}
// ---------- Inicio: demo o tienda con inicio de sesión ----------
function gate(html){ MODE = null; $("nav.tabs").hidden = true; $("#app").innerHTML = html; window.scrollTo(0,0); }
const gateHead = () => header("Almacén", "Sistema de inventario");
const demoLink = `<a class="btn ghost block" style="text-align:center" href="?demo">Ver demo con datos ficticios</a>`;
function startDemo(){ MODE = "demo"; load(); $("nav.tabs").hidden = false; render(); }

// La misma página sirve de demo pública (para el CV) y de sistema de la tienda.
// En las direcciones de config.direccionesDemo se ve la demo, salvo que se abra con ?tienda
// (desde ahí ese navegador lo recuerda). En cualquier otra dirección se entra a la tienda.
const STORE_FLAG = "almacen-modo-tienda";
function storeDevice(on){ try { if (on === undefined) return localStorage.getItem(STORE_FLAG) === "1"; on ? localStorage.setItem(STORE_FLAG, "1") : localStorage.removeItem(STORE_FLAG); } catch(e){ return false; } }

async function boot(){
  const params = new URLSearchParams(location.search);
  if (params.has("tienda")) storeDevice(true);
  // En una dirección propia de la tienda (no la del CV) se entra directo a la tienda
  const cvHost = (CFG.direccionesDemo || []).includes(location.hostname);
  if (!DB_READY || params.has("demo") || (cvHost && !storeDevice())) return startDemo();
  gate(`${gateHead()}<div class="empty">Conectando…</div>`);
  try { await loadScript(SB_SRC); }
  catch(e){ return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Sin conexión</h2><p style="margin:0">No se pudo conectar con la base de datos de la tienda. Revisa el internet e intenta de nuevo.</p><button class="btn primary block" onclick="location.reload()">Reintentar</button></div>${demoLink}</div>`); }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth:{ storageKey:"almacen-sesion" } });
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && MODE) location.reload(); });
  const { data, error } = await sb.auth.getSession();
  if (data.session) return enterDB(data.session.user);
  // Sin internet la sesión vencida no se puede renovar: si hay una copia de este celular, se abre con ella
  if (error && isNetErr(error)){ try { const st = JSON.parse(localStorage.getItem("almacen-sesion")); const u = st?.user || st?.currentSession?.user; if (u && loadCopy(u.id)) return enterDB(u); } catch(e){} }
  showLogin();
}

async function showLogin(){
  let first = false;
  try { first = !(await q(sb.rpc("hay_admin"))); } catch(e){}
  gate(`${gateHead()}<div class="stack">
    ${first ? `<div class="card stack"><h2>Configurar la tienda</h2>
      <p class="small muted" style="margin:0">Todavía no hay cuentas. Crea la cuenta maestra: es la administradora principal, nadie más la puede cambiar ni quitarle el acceso, y con ella se agregan después las demás personas.</p>
      <div class="field"><label for="an">Nombre</label><input class="input" id="an" placeholder="Ej: Rosa"></div>
      <div class="field"><label for="au">Usuario para entrar</label><input class="input" id="au" autocapitalize="none" autocomplete="username" placeholder="Ej: rosa"></div>
      <div class="field"><label for="ap">Contraseña (mínimo 6 caracteres)</label><input class="input" id="ap" type="password" autocomplete="new-password"></div>
      <button class="btn primary block" id="asave">Crear cuenta</button></div>`
    : `<form class="card stack" id="loginf"><h2>Entrar</h2>
      <div class="field"><label for="lu">Usuario</label><input class="input" id="lu" autocapitalize="none" autocomplete="username" required></div>
      <div class="field"><label for="lp">Contraseña</label><input class="input" id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn primary block" id="lgo">Entrar</button>
      <p class="small muted" style="margin:0">¿No tienes cuenta? Pídesela a la administradora de la tienda.</p></form>`}
    ${demoLink}
  </div>`);
  if (first){
    $("#asave").onclick = () => run(async () => {
      const n = $("#an").value.trim(), u = $("#au").value.trim(), pw = $("#ap").value;
      if (!n) return $("#an").focus(); if (!u) return $("#au").focus(); if (pw.length < 6) return toast("La contraseña debe tener al menos 6 caracteres");
      const data = await createAccount(n, u, pw, sb);
      if (!data.session) return toast("Cuenta creada, pero Supabase pide confirmar el correo. Desactiva \"Confirm email\" (ver guía) y entra.");
      enterDB(data.session.user);
    });
  } else {
    $("#loginf").onsubmit = e => { e.preventDefault(); run(async () => {
      const btn = $("#lgo"); btn.disabled = true; btn.textContent = "Entrando…";
      const { data, error } = await sb.auth.signInWithPassword({ email:userEmail($("#lu").value), password:$("#lp").value });
      btn.disabled = false; btn.textContent = "Entrar";
      if (error) throw error;
      enterDB(data.user);
    }); };
  }
}

async function enterDB(user){
  gate(`${gateHead()}<div class="empty">Cargando datos de la tienda…</div>`);
  try {
    const prof = await q(sb.from("perfiles").select("*").eq("id", user.id).maybeSingle());
    if (!prof || !prof.activo){ gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Cuenta sin acceso</h2>
      <p style="margin:0">Tu cuenta${prof ? ` (${esc(prof.usuario)})` : ""} existe, pero la administradora todavía no le da acceso, o se lo quitó.</p>
      <button class="btn primary block" id="retry">Revisar de nuevo</button><button class="btn block" id="out">Salir</button></div></div>`);
      $("#retry").onclick = () => enterDB(user); $("#out").onclick = () => sb.auth.signOut().then(() => location.reload());
      return;
    }
    db.profile = prof;
    await dbLoadAll();
  } catch(e){
    const copy = isNetErr(e) && loadCopy(user.id);
    if (copy){
      Object.assign(db, { profile:copy.profile, team:copy.team, panes:copy.panes, ajustes:copy.ajustes, loadedAt:copy.at, offline:true, joined:true });
      S = copy.S; applyPending(); net.fail = true;
      MODE = "db"; $("nav.tabs").hidden = false; ui.recv = { supplier:"", provId:null, items:[] };
      dbSubscribe(); render(); return toast("Sin internet: se abrió con los datos guardados en este celular");
    }
    return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>No se pudieron cargar los datos</h2><p style="margin:0">${esc(friendly(e))}</p>
      <button class="btn primary block" onclick="location.reload()">Reintentar</button></div></div>`);
  }
  MODE = "db"; $("nav.tabs").hidden = false; ui.recv = { supplier:"", provId:null, items:[] };
  dbSubscribe(); render(); flushOutbox();
}
// Al volver a la app después de un rato (celular bloqueado), se trae lo que cambió
document.addEventListener("visibilitychange", () => { if (isDB() && !document.hidden && Date.now() - db.loadedAt > 60e3) reloadSoon(); });

// App instalable: el service worker guarda una copia de la app para que abra aunque el internet esté lento
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
})();
</script>
