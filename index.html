<style>

:root{

  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526; --accent-soft:#fbefd2;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;

}

  color-scheme:dark }}
:root[data-theme="dark"]{

  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brandname{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}

.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.panbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent);color:var(--accent-fg)}
.panbtn svg{width:34px;height:34px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.qbtn{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:12px;background:var(--accent);color:var(--accent-fg);min-height:56px}
.qbtn svg{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.qbtn b{display:block;font-size:15px}
.qbtn small{display:block;font-size:12px;opacity:.8}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}

.netpill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.netpill.warn i{background:var(--warn)} .netpill.bad{color:var(--bad)} .netpill.bad i{background:var(--bad)}
.lk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:0}
.lk svg{width:24px;height:24px;flex:none;stroke:var(--brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.lk .btn{padding:6px 9px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;overflow:hidden;font-family:var(--font-display);font-weight:800;font-size:28px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.qrbox{background:#fff;border-radius:var(--r);padding:16px;display:grid;place-items:center}
.qrbox svg{width:100%;max-width:280px;height:auto}
.mi svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea.input{resize:vertical;font:inherit}
a.btn{color:inherit;text-decoration:none;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
.livebox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.livebox video{width:100%;height:100%;object-fit:cover;display:block}
.liveline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livemsg{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;color:#fff;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.filebtn{position:relative;display:block;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}

.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .lbl{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}

.sector .name{font-weight:700;font-size:16px}
.sector .sub{font-size:13px;color:var(--muted);grid-column:1/-1}

.formula{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}

.total{font-family:var(--font-display);font-weight:800;font-size:26px}

// Generador pseudoaleatorio con semilla, para que la demo siempre arranque igual
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

function atDay(daysAgo, hour, min){ const d = new Date(Date.now() - daysAgo*D); d.setHours(hour, min||0, 0, 0); return d.getTime(); }

const PAN_MSG = "🍞 ¡Llegó el pan calentito! Marraquetas y hallullas recién salidas. Los esperamos en el almacén.";
function buildSeed(){
  const r = rng(42);
  const products = CATALOG.map((c, i) => ({ id:"p"+i, name:c[0], cat:c[1], price:c[2], cost:c[3], pop:c[4],
    barcode:"", min: c[1] === "Pan" ? 10 : c[5] === "kg" ? (c[4] >= 2 ? 2 : 1) : c[4] >= 2 ? 6 : 3, unit:c[5] || "un", atajo:!!c[6], reserva:!!c[7],
    has:true, countQty:null, countAt:null, estimated:false }));
  ["7800000000011","7800000000028","7800000000035"].forEach((b, i) => { products.find(p => p.name === ["Coca-Cola 1,5 L","Coca-Cola 3 L","Coca-Cola Zero 1,5 L"][i]).barcode = b; });
  const byName = n => products.find(p => p.name === n);
  byName("Agua mineral con gas 1,6 L").has = false;
  byName("Arvejas partidas 500 g").has = false;
  const movs = [];
  const now = Date.now();
  // Ventas de los últimos 5 días (incluido hoy hasta la hora actual)
  for (let d = 5; d >= 0; d--){
    for (const p of products){
      if (!p.has) continue;
      const n = [0.15, 0.6, 1.6, 3.2][p.pop];
      let k = Math.floor(n + r()*n);
      while (k-- > 0){
        const t = atDay(d, 9 + Math.floor(r()*12), Math.floor(r()*60));
        if (t > now - 5*60e3) continue;
        movs.push({ id:uid(), pid:p.id, type:"venta", qty: p.unit === "kg" ? Math.round((0.25 + r()*1.25) * 4) / 4 : p.cat === "Pan" ? 2 + Math.floor(r()*9) : r() < 0.2 ? 2 : 1, at:t, price:p.price });
      }
    }
  }
  // Conteos ya hechos: Bebidas hace 3 días, Lácteos hace 2, Galletas ayer (al cierre)
  const counts = { "Bebidas":[3,20,30], "Lácteos":[2,20,15], "Galletas":[1,20,40] };
  const qtys = { "Coca-Cola 1,5 L":30,"Coca-Cola 3 L":12,"Coca-Cola Zero 1,5 L":9,"Sprite 1,5 L":10,"Fanta 1,5 L":8,"Pepsi 1,5 L":6,"Bilz 1,5 L":7,"Pap 1,5 L":6,"Agua mineral sin gas 1,6 L":18,
    "Leche entera 1 L":16,"Leche descremada 1 L":6,"Yogur batido 125 g":14,"Mantequilla 250 g":5,"Queso laminado 250 g":4,
    "Galletas de agua":15,"Galletas de soda":13,"Galletas rellenas chocolate":22,"Galletas rellenas vainilla":16,"Galletas de vino":8 };
  for (const [cat,[d,h,m]] of Object.entries(counts)){
    const t = atDay(d,h,m);
    for (const p of products.filter(p => p.cat === cat && p.has)){
      p.countQty = qtys[p.name] ?? 6; p.countAt = t;
      movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:t });
    }
  }
  // Una compra al proveedor después del conteo de Bebidas
  const coca = byName("Coca-Cola 1,5 L");
  movs.push({ id:uid(), pid:coca.id, type:"compra", qty:24, at:atDay(2,11,15), cost:1300, supplier:"Distribuidora Ejemplo" });
  const agua = byName("Agua mineral sin gas 1,6 L");
  movs.push({ id:uid(), pid:agua.id, type:"compra", qty:12, at:atDay(2,11,15), cost:560, supplier:"Distribuidora Ejemplo" });
  movs.sort((a,b) => a.at - b.at);
  // Si alguna venta deja un producto contado en negativo, se elimina (la demo debe ser coherente)
  for (const p of products){
    if (p.countAt == null) continue;
    let s = p.countQty;
    for (const m of movs.filter(m => m.pid === p.id && m.at > p.countAt)){
      if (m.type === "compra") s += m.qty;
      if (m.type === "venta"){ if (s - m.qty < 1 && p.pop < 3){ m.drop = true; } else s -= m.qty; }
    }
  }
  return seedV3(Object.assign({ products, movs: movs.filter(m => !m.drop), seededAt: now }, seedExtras()));
}

const net = { fail:false, rt:"conectando" };
const isNetErr = e => /Failed to fetch|NetworkError|Load failed|sin conexión|fetch failed|AbortError|aborted|timed? ?out/i.test((e && (e.message || e.details)) || "");
function netState(){
  const n = outbox.list().length, por = n ? ` · ${n} por enviar` : "";
  if (!navigator.onLine || net.fail) return ["bad", "Sin internet" + por];
  if (n) return ["warn", `Enviando ${n}…`];
  if (net.rt === "error") return ["warn", "Reconectando…"]; return ["", "En línea"]; }

function setNet(){ if (!isDB()) return; const [k, t] = netState(); document.querySelectorAll(".netpill").forEach(el => { el.className = "netpill " + k; el.innerHTML = `<i></i>${t}`; }); }

async function q(req){
  let res; try { res = await req; } catch(e){ if (isNetErr(e)){ net.fail = true; setNet(); } throw e; }
  const { data, error } = res;
  if (error){ if (isNetErr(error)){ net.fail = true; setNet(); } throw error; }
  if (net.fail){ net.fail = false; setNet(); }
  return data;
}
// Supabase entrega hasta 1000 filas por consulta: se piden de a bloques

function upsert(list, obj){ const cur = list.find(x => x.id === obj.id); if (cur) return Object.assign(cur, obj); list.push(obj); return obj; }
function friendly(e){
  const m = (e && (e.message || e.error_description)) || String(e || "");
  if (/por_caja/.test(m)) return CAJA_MSG;
  if (e?.code === "23514" || /violates check constraint/i.test(m)) return "Hay un número fuera de lo permitido. Revisa lo que escribiste e intenta de nuevo.";
  if (e?.code === "23505") return "Ese código de barras ya está en otro producto";
  if (/Failed to fetch|NetworkError|Load failed|sin conexión/i.test(m)) return "Sin conexión a internet. No se guardó; intenta de nuevo.";
  if (/Invalid login credentials/i.test(m)) return "Usuario o contraseña incorrectos";
  if (/already registered/i.test(m)) return "Ese usuario ya existe";
  if (/Database error saving new user|Registro cerrado/i.test(m)) return "No se pudo crear la cuenta: solo la administradora puede agregar personas, desde Más > Equipo y cuenta.";
  if (/Password should be/i.test(m)) return "La contraseña debe tener al menos 6 caracteres";

}

}
async function loadVencs(){

async function fetchProducts(ids){

// Trae los movimientos nuevos (los propios y los de otros celulares)
async function syncMovs(){
  const last = S.movs.reduce((a, m) => m.pending ? a : Math.max(a, m.at), Date.now() - 8*D);
  const rows = await all(() => sb.from("movimientos").select("*").gte("at", new Date(last - 60e3).toISOString()).order("at"));
  rows.forEach(r => { if (!S.movs.some(m => m.id === r.id)) S.movs.push(movFromRow(r)); });
  S.movs.sort((a, b) => a.at - b.at);

const later = { pids:new Set(), t:null, full:null };
function refreshSoon(pid){ later.pids.add(pid); clearTimeout(later.t); later.t = setTimeout(() => { const ids = [...later.pids]; later.pids.clear(); fetchProducts(ids).then(softRender, () => {}); }, 200); }
function reloadSoon(){ clearTimeout(later.full); later.full = setTimeout(() => dbLoadAll().then(softRender, () => {}), 400); }
// Redibuja sin interrumpir a quien está escribiendo en un campo
let renderWaiting = false;
function softRender(){
  if (!MODE) return;
  const a = document.activeElement;
  if (a && $("#app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
    if (!renderWaiting){ renderWaiting = true; a.addEventListener("blur", () => { renderWaiting = false; setTimeout(softRender, 50); }, { once:true }); }
    return;
  }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function dbSubscribe(){
  if (db.channel) sb.removeChannel(db.channel);
  const ch = db.channel = sb.channel("tienda");
  const on = (table, fn) => ch.on("postgres_changes", { event:"*", schema:"public", table }, fn);
  on("movimientos", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    if (!S.movs.some(m => m.id === r.id)){ S.movs.push(movFromRow(r)); S.movs.sort((a, b) => a.at - b.at); }
    if (r.vence && !S.vencs.some(m => m.id === r.id)) S.vencs.push(movFromRow(r));
    refreshSoon(r.producto_id); });
  on("productos", ({ new:r, old:o }) => refreshSoon(r?.id || o?.id));
  on("clientes", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon();
    const c = S.clients.find(c => c.id === r.id); if (c) Object.assign(c, { name:r.nombre, phone:r.telefono || "", gone:!!r.eliminado }); else S.clients.push(cliFromRow(r)); softRender(); });
  on("fiados", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    const c = S.clients.find(c => c.id === r.cliente_id); if (!c) return reloadSoon();
    if (!c.items.some(i => i.id === r.id)) c.items.push(fiaFromRow(r)); softRender(); });
  on("reservas", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon(); if (r.dia < hoyChile()) return;
    const isNew = !S.reservas.some(x => x.id === r.id); upsert(S.reservas, resFromRow(r));
    if (isNew && eventType === "INSERT"){ toast(`Nueva reserva de pan: ${r.nombre}`); try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch(e){} }
    softRender(); });
  on("ajustes", ({ new:r }) => { if (!r?.clave) return; db.ajustes[r.clave] = r.valor; if (r.clave === "mensaje_pan") S.panMsg = r.valor; softRender(); });
  on("perfiles", reloadSoon);
  on("panes", reloadSoon);
  on("proveedores", reloadSoon);
  on("ofertas", reloadSoon);
  on("cierres", reloadSoon);
  // Al reconectarse (por ejemplo, el celular estuvo bloqueado) se recarga todo para no perder cambios
  ch.subscribe(st => { net.rt = st === "SUBSCRIBED" ? "ok" : "error"; setNet();
    if (st === "SUBSCRIBED"){ if (db.joined) reloadSoon(); db.joined = true; } });
}


// ---------- Sin internet: ventas y fiados se guardan en el celular y se envían solos ----------
// Cada venta lleva su propio número (grupo_id), así que si llega dos veces se guarda una sola.
const OUTBOX_KEY = "almacen-por-enviar", COPY_KEY = "almacen-copia";
const outbox = {
  list(){ try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || []; } catch(e){ return []; } },
  set(l){ try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(l)); } catch(e){} },
  add(it){ const l = this.list(); l.push(it); this.set(l); },
  drop(id){ this.set(this.list().filter(x => x.id !== id)); }
};
const pendingQty = pid => outbox.list().reduce((a, it) => a + (it.kind === "venta" ? it.lines.filter(l => l.pid === pid).reduce((b, l) => b + l.qty, 0) : 0), 0);
// Muestra lo que está por enviar como si ya estuviera guardado (historial, ventas del día, fiados)
function applyPending(){
  for (const it of outbox.list()){
    if (it.kind === "venta") it.lines.forEach((l, i) => { const id = `${it.id}-${i}`;
      if (!S.movs.some(m => m.id === id)) S.movs.push({ id, pid:l.pid, type:"venta", qty:l.qty, at:it.at, price:l.price, disc:l.disc, medio:it.medio, user:db.profile?.id, pending:true }); });
    if (it.kind === "fiado"){ const c = S.clients.find(c => c.id === it.cliente);
      if (c && !c.items.some(i => i.id === it.id)) c.items.push({ id:it.id, type:it.tipo, amount:it.monto, note:it.nota, at:it.at, medio:it.medio, user:db.profile?.id, pending:true }); }
  }
  S.movs.sort((a, b) => a.at - b.at);
}
// Un error que no se arregla reintentando (por ejemplo, un producto borrado): se aparta para no trabar a los demás
const isFinalErr = e => !isNetErr(e) && (e?.code === "P0001" || /^2[23]/.test(e?.code || ""));
function withTimeout(req, ms){ const c = new AbortController(); setTimeout(() => c.abort(), ms); return req.abortSignal(c.signal); }
async function sendItem(it){
  if (it.kind === "venta"){
    const items = it.lines.map(l => ({ producto_id:l.pid, cantidad:l.qty, precio:l.price, descuento:l.disc }));
    try { await q(withTimeout(sb.rpc("registrar_venta", { items, medio:it.medio, grupo_id:it.id, hora:new Date(it.at).toISOString() }), 10000)); }
    catch(e){ if (e?.code !== "PGRST202") throw e;
      // La base de datos todavía no tiene la versión nueva (falta ejecutar schema.sql): se usa la anterior
      await q(withTimeout(sb.rpc("registrar_venta", { items, medio:it.medio }), 10000)); }
    S.movs = S.movs.filter(m => !(m.pending && m.id.startsWith(it.id + "-")));
    const rows = await q(sb.from("movimientos").select("*").eq("grupo", it.id));
    rows.forEach(r => { if (!S.movs.some(m => m.id === r.id)) S.movs.push(movFromRow(r)); });
    S.movs.sort((a, b) => a.at - b.at);
    await fetchProducts(it.lines.map(l => l.pid)).catch(() => {});
  } else {
    await q(withTimeout(sb.from("fiados").upsert({ id:it.id, cliente_id:it.cliente, tipo:it.tipo, monto:it.monto, nota:it.nota, medio:it.medio, at:new Date(it.at).toISOString() },
      { onConflict:"id", ignoreDuplicates:true }), 10000));
    const c = S.clients.find(c => c.id === it.cliente), i = c?.items.find(i => i.id === it.id); if (i) delete i.pending;
  }
}
let flushing = null;
function flushOutbox(){
  if (flushing) return flushing;
  if (!isDB() || !outbox.list().length) return Promise.resolve(true);
  flushing = (async () => {
    let it;
    while ((it = outbox.list()[0])){
      if (!navigator.onLine){ net.fail = true; break; }
      try { await sendItem(it); outbox.drop(it.id); }
      catch(e){
        if (!isFinalErr(e)) break;
        outbox.drop(it.id); S.movs = S.movs.filter(m => !(m.pending && m.id.startsWith(it.id + "-")));
        try { const f = JSON.parse(localStorage.getItem(OUTBOX_KEY + "-fallidas")) || []; f.push({ ...it, error:e.message }); localStorage.setItem(OUTBOX_KEY + "-fallidas", JSON.stringify(f)); } catch(x){}
        toast(`No se pudo guardar ${it.kind === "venta" ? "una venta" : "un fiado"} hecho sin internet: ${friendly(e)}`);
      }
    }
    return !outbox.list().length;
  })().finally(() => { flushing = null; setNet(); softRender(); });
  return flushing;
}
setInterval(() => { if (isDB() && outbox.list().length && navigator.onLine) flushOutbox().then(ok => ok && reloadSoon()); }, 20000);

    // Se guarda primero en el celular y después se envía: si no hay internet, queda por enviar
    outbox.add({ id:uuid(), kind:"venta", at:Date.now(), medio, lines: lines.map(l => ({ pid:l.pid, qty:l.qty, price:l.price, disc:l.disc || 0 })) });

  async receive(supplier, items, provId){

      S.movs.push({ id:uid(), pid:l.pid, type:"compra", qty:l.qty, at:now, cost:l.cost, supplier, vence:l.vence || null }); }); save(); return; }
    await q(sb.rpc("registrar_compra", { proveedor:supplier, proveedor_id:provId || null, items: items.map(l => ({ producto_id:l.pid, cantidad:l.qty, costo:l.cost, vence:l.vence || "", por_caja:l.porCaja || null })) }));

  // draft: { pid: { qty, est, none } }. Devuelve cuántos se contaron y las diferencias
  async count(draft){
    const diffs = []; let n = 0;
    if (!isDB()){
      const now = Date.now();
      for (const [pid, d] of Object.entries(draft)){
        const p = P(pid);
        if (d.none === true){ p.has = false; continue; }
        if (d.none === false) p.has = true;
        if (d.qty === "" || d.qty == null) continue;
        const c = Math.max(0, r3(parseFloat(d.qty) || 0));
        const expected = stockOf(p);
        if (expected != null && expected !== c) diffs.push([p, expected, c]);
        p.countQty = c; p.countAt = now; p.estimated = !!d.est; n++;
        S.movs.push({ id:uid(), pid, type:"conteo", qty:c, expected, at:now });
      }
      save(); return { n, diffs };
    }
    const items = Object.entries(draft).map(([pid, d]) => ({ producto_id:pid, cantidad: d.qty === "" || d.qty == null ? null : Math.max(0, r3(parseFloat(d.qty) || 0)),
      aproximado: !!d.est, ...(d.none === true ? { tiene:false } : d.none === false ? { tiene:true } : {}) }));
    if (!items.length) return { n, diffs };
    const rows = await q(sb.rpc("registrar_conteo", { items }));
    await Promise.all([syncMovs(), fetchProducts(items.map(i => i.producto_id))]);
    rows.forEach(r => { n++; if (r.esperado != null && +r.esperado !== +r.contado) diffs.push([P(r.producto_id), +r.esperado, +r.contado]); });

// ---------- Escaneo de códigos de barras ----------
async function decodeFile(file){
  if ("BarcodeDetector" in window){
    try { const bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] });
      const bmp = await createImageBitmap(file); const r = await bd.detect(bmp); if (r.length) return r[0].rawValue; } catch(e){}
  }
  if (!window.ZXing) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    return zxingDecode(img, img.width, img.height, 1400, true);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
const zxCanvas = document.createElement("canvas");
function zxingDecode(src, sw, sh, maxSide, hard){
  if (!window.ZXing || !sw || !sh) return null;
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw*scale), h = Math.round(sh*scale);
  zxCanvas.width = w; zxCanvas.height = h;
  const cx = zxCanvas.getContext("2d", { willReadFrequently:true }); cx.drawImage(src, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) lum[i] = (px[i*4]*299 + px[i*4+1]*587 + px[i*4+2]*114) / 1000;
  const hints = new Map(); if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const tryDecode = s => { try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s))).getText(); } catch(e){ return null; } };
  const lsrc = new ZXing.RGBLuminanceSource(lum, w, h);
  return tryDecode(lsrc) || (hard && lsrc.isRotateSupported && lsrc.isRotateSupported() ? tryDecode(lsrc.rotateCounterClockwise()) : null);
}

// Cámara en vivo: funciona cuando la página se abre como sitio propio (https). Dentro de un visor que bloquea la cámara, se usa la foto.
let live = null;
function stopLive(){ if (!live) return; live.stop = true; live.stream?.getTracks().forEach(t => t.stop()); live = null; }
async function startLive(cb){
  stopLive();
  const box = $("#liveBox"); if (!box) return;
  if (!navigator.mediaDevices?.getUserMedia){ box.hidden = true; return; }
  const me = live = { stop:false, stream:null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
    if (me.stop){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#liveVideo"); v.srcObject = stream; await v.play().catch(() => {});
    box.hidden = false; $("#liveMsg").textContent = "Apunta al código de barras";
    let bd = null;
    if ("BarcodeDetector" in window){ try { bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); } catch(e){} }
    const tick = async () => {
      if (me.stop) return;
      let code = null;
      try {
        if (v.readyState >= 2){
          if (bd){ const r = await bd.detect(v); if (r.length) code = r[0].rawValue; }
          else code = zxingDecode(v, v.videoWidth, v.videoHeight, 800, false);
        }
      } catch(e){}
      if (me.stop) return;
      if (code){ if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){} stopLive(); handleCode(code, cb); return; }
      setTimeout(tick, bd ? 150 : 250);
    };
    tick();
  } catch(e){
    if (live === me) live = null;
    box.hidden = true;
    const note = $("#liveNote"); if (note) note.hidden = false;
  }
}
async function handleFile(input, cb){
  const f = input.files && input.files[0]; if (!f) return;

  handleCode(code, cb);
}
function handleCode(code, cb){
  code = String(code).trim(); if (!code) return;

  if (p){ closeModal(); cb(p); return; }

}

function scanAction(){

// Pistola de códigos (USB o Bluetooth): escribe el número muy rápido y termina con Enter.
// Se reconoce por la velocidad, así que funciona sin tocar nada en pantalla.
const wedge = { buf:"", t:0 };
document.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const code = wedge.buf, fast = e.timeStamp - wedge.t < 100; wedge.buf = "";
    if (!fast || code.length < 6) return;
    const t = e.target, sheet = ui.scanCb;
    // En un campo de código de barras el número se queda escrito ahí
    if (!sheet && t && t.classList && t.classList.contains("code")) return;
    e.preventDefault(); e.stopPropagation();
    // Lo que la pistola alcanzó a escribir en otro campo se borra (para que no quede como precio o búsqueda)
    if (t && t.tagName === "INPUT" && t.value.endsWith(code)){ t.value = t.value.slice(0, -code.length); t.dispatchEvent(new Event("input", { bubbles:true })); }
    const cb = sheet || ($("#modalroot").innerHTML ? null : scanAction());
    if (cb) handleCode(code, cb); else toast($("#modalroot").innerHTML ? "Cierra esta ventana para escanear" : "Para escanear, abre Vender, Recibir o Contar");
  } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.timeStamp - wedge.t > 50) wedge.buf = "";
    wedge.buf += e.key; wedge.t = e.timeStamp;
  }
}, true);

function lineDisc(pid, qty, price){
  let left = qty, disc = 0; const applied = [];
  for (const o of activeOffers(pid)){ const save = o.qty*price - o.price; if (save <= 0) continue;
    const n = Math.floor(left / o.qty); if (n){ disc += n*save; left -= n*o.qty; applied.push([o, n]); } }
  return { disc, applied, left };
}

  const os = activeOffers(pid); if (!os.length) return "";
  const { left } = lineDisc(pid, qty, P(pid).price), o = os[os.length - 1];
  if (!left || left >= o.qty) return "";
  const need = o.qty - left;

// ---------- Búsqueda: primero lo exacto, después lo parecido ----------
// Sin tildes ni mayúsculas; "coca ret" encuentra "Coca-Cola 2 L retornable" y "cpca" encuentra "Coca"
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/['’]/g, "").replace(/[^a-z0-9ñ]+/g, " ").trim();
function lev(a, b){
  let prev = Array.from({ length:b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++){ const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur; }
  return prev[b.length];
}
// Puntaje: 100+ = contiene lo escrito tal cual · 50+ = están todas las palabras (en cualquier orden o con un error) · <50 = parecido
function matchScore(name, q){
  const n = norm(name), nq = norm(q); if (!nq) return 1;
  if (n.includes(nq)) return 101 + (n.startsWith(nq) ? 20 : 0) - n.length / 1000;
  if (n.replace(/ /g, "").includes(nq.replace(/ /g, ""))) return 95 - n.length / 1000;
  const ws = n.split(" "), ts = nq.split(" ");
  const tok = t => Math.max(0, ...ws.map(w => w.startsWith(t) ? 1 : w.includes(t) ? 0.8
    : t.length >= 4 && (lev(t, w.slice(0, t.length)) <= 1 || lev(t, w) <= 1) ? 0.6 : 0));
  const sc = ts.map(tok), hit = sc.filter(x => x > 0).length, avg = sc.reduce((a, b) => a + b, 0) / ts.length;
  if (hit === ts.length) return 50 + avg * 30 - n.length / 1000;
  return hit && hit / ts.length >= 0.5 ? 20 * avg : 0;
}
function findProducts(list, q){
  if (!norm(q)) return list;
  const code = q.trim();
  return list.map(p => [p, p.barcode && p.barcode === code ? 200 : matchScore(p.name, q)]).filter(x => x[1] > 0)
    .sort((a, b) => b[1] - a[1] || a[0].name.localeCompare(b[0].name)).map(x => x[0]);
}
function searchResults(q, onPick, opts){
  if (!q.trim()) return "";
  const res = findProducts(S.products.filter(p => opts?.all || p.has), q).slice(0, 10);
  const tier = p => p.barcode === q.trim() ? 3 : (x => x >= 100 ? 2 : x >= 50 ? 1 : 0)(matchScore(p.name, q));
  const ts = res.map(tier), i = ts.findIndex(t => t < ts[0]);
  return res.map((p, k) => (k === i ? `<div class="small muted" style="padding:10px 0 2px">Parecidos</div>` : "") + `<button class="item tap" data-pick="${p.id}"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${precioTxt(p)} · ${esc(p.cat)}</div></div>${stockPill(p)}</button>`).join("") || `<div class="empty">Sin resultados para “${esc(q.trim())}”.</div>`;
}

function addToRecv(p){ const l = ui.recv.items.find(l => l.pid === p.id); if (l) l.qty++;
  else if (p.porCaja && !isKg(p)) ui.recv.items.push({ pid:p.id, box:true, n:p.porCaja, qty:1, cost:p.cost * p.porCaja });
  else ui.recv.items.push({ pid:p.id, qty:isKg(p) ? 5 : 12, cost:p.cost, n:12 });

const recvUnits = l => l.box && l.n > 1 ? l.qty * l.n : l.qty;

// Conteo por cajas: se escanea una vez y se escribe "4 cajas × 5" en vez de escanear uno por uno
const COUNT_MODE_KEY = "almacen-conteo-cantidad";
function countAsk(set){ try { if (set !== undefined) set ? localStorage.setItem(COUNT_MODE_KEY, "1") : localStorage.removeItem(COUNT_MODE_KEY); return localStorage.getItem(COUNT_MODE_KEY) === "1"; } catch(e){ return !!set; } }
function openCountQty(p){
  const d = ui.draft[p.id] || {}, prev = parseFloat(d.qty) || 0, kg = isKg(p);
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(p.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <p class="small muted" style="margin:0">${prev ? `Ya contaste ${fq(prev, p)}. Lo que escribas se suma.` : "Escribe cuántos hay, o cuántas cajas y de cuántas unidades."}${p.cat !== ui.sector ? ` Es del sector ${esc(p.cat)}; se suma igual.` : ""}</p>
    ${kg ? "" : `<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end">
      <div class="field"><label for="cqb">Cajas</label><input class="input" id="cqb" type="number" min="0" inputmode="numeric" placeholder="Ej: 4"></div>
      <span style="font-size:22px;font-weight:700;padding-bottom:10px">×</span>
      <div class="field"><label for="cqn">Unidades por caja</label><input class="input" id="cqn" type="number" min="1" inputmode="numeric" placeholder="Ej: 5" value="${p.porCaja || ""}"></div></div>`}
    <div class="field"><label for="cqs">${kg ? "Kilos" : "Más unidades sueltas"}</label><input class="input" id="cqs" type="number" min="0" ${kg ? 'step="0.001" inputmode="decimal"' : 'inputmode="numeric"'} placeholder="${kg ? "Ej: 2,5" : "Opcional"}"></div>
    <div class="spread"><span class="muted" id="cqtxt">Total a sumar</span><span class="total" id="cqtot">0</span></div>
    <button class="btn primary block" id="cqok">Sumar al conteo</button>
    ${prev ? `<button class="btn ghost block" id="cqrep">Reemplazar lo contado</button>` : ""}
  </div>`);
  const val = id => Math.max(0, +($(id)?.value || 0) || 0);
  const tot = () => r3(val("#cqb") * (val("#cqn") || 0) + val("#cqs"));
  const show = () => { const t = tot(); $("#cqtot").textContent = fq(t, p); $("#cqtxt").textContent = prev ? `${fq(prev, p)} + ${fq(t, p)} = ${fq(r3(prev + t), p)}` : "Total a sumar"; };
  ["#cqb","#cqn","#cqs"].forEach(id => { const i = $(id); if (i){ i.oninput = show; i.onkeydown = e => { if (e.key === "Enter") $("#cqok").click(); }; } });
  const put = q => { const t = tot(); if (!t) return ($("#cqb") || $("#cqs")).focus();
    const x = (ui.draft[p.id] ||= {}); x.qty = String(r3(q + t)); x.none = false; closeModal(); render(); toast(`${p.name}: ${fq(r3(q + t), p)}`); };
  $("#cqok").onclick = () => put(prev);
  if ($("#cqrep")) $("#cqrep").onclick = () => put(0);
  show(); setTimeout(() => ($("#cqb") || $("#cqs"))?.focus(), 50);
}

// Celular chileno: 9 números (se acepta con +56 delante). Vacío es válido porque es opcional.
const phoneOk = v => { const d = String(v || "").replace(/\D/g, ""); return !d || d.length === 9 || (d.length === 11 && d.startsWith("56")); };
const PHONE_MSG = "El celular debe tener 9 números, por ejemplo 9 1234 5678";
// Mientras se escribe solo deja números, espacios y el + del comienzo
function phoneInput(el){ if (el) el.oninput = () => { const v = el.value.replace(/[^\d +]/g, "").replace(/(?!^)\+/g, ""); if (v !== el.value) el.value = v; }; }
function waPhone(p){ let d = String(p||"").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; else if (d.length === 8) d = "569" + d; return d; }
// En el celular se usa el enlace web (abre la app). En el computador se abre la app de escritorio directo, sin dejar una pestaña abierta.
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function waQuery(phone, text){ return (phone ? "phone=" + waPhone(phone) + "&" : "") + "text=" + encodeURIComponent(text); }
function waLink(phone, text){ return (IS_MOBILE ? "https://api.whatsapp.com/send?" : "whatsapp://send?") + waQuery(phone, text); }
function waWeb(phone, text){ return "https://web.whatsapp.com/send?" + waQuery(phone, text); }
const WA_TARGET = IS_MOBILE ? 'target="_blank" rel="noopener"' : "";
const waWebNote = (id, phone, text) => IS_MOBILE ? "" : `<p class="small muted" style="margin:0">¿No tienes WhatsApp instalado en este computador? <a id="${id}" href="${esc(waWeb(phone, text))}" target="whatsapp-web" rel="noopener" style="color:var(--brand)">Usar WhatsApp Web</a></p>`;
function viewFiados(){
  const cs = S.clients.filter(c => !c.gone).sort((a,b) => saldo(b) - saldo(a));
  const total = cs.reduce((a,c) => a + Math.max(0, saldo(c)), 0);
  return `${header("Fiados", "Cuaderno de cuentas de clientes")}
  <div class="stack">
    <div class="card kpi"><div class="num">${clp(total)}</div><div class="lbl">por cobrar entre ${cs.filter(c => saldo(c) > 0).length} clientes</div></div>
    <button class="btn primary block" id="addc">+ Agregar cliente</button>
    <div class="card" style="padding-block:0"><div class="list">${cs.map(c => { const s = saldo(c); const last = c.items.length ? Math.max(...c.items.map(i => i.at)) : null;
      return `<button class="item tap" data-client="${c.id}"><div class="main"><div class="name">${esc(c.name)}</div><div class="sub">${last ? "Último movimiento " + ago(last) : "Sin movimientos"}</div></div>
      ${s > 0 ? `<span class="pill warn">Debe ${clp(s)}</span>` : `<span class="pill ok">Al día</span>`}</button>`; }).join("") || `<div class="empty">Aún no hay clientes.</div>`}</div></div>
    <p class="small muted" style="margin:0">Los fiados se anotan aparte: no cambian el stock ni las ventas del inventario.</p>
  </div>`;
}
function openCliente(c){
  const s = saldo(c);
  const items = c.items.slice().sort((a,b) => b.at - a.at);
  const msg = `Hola ${c.name.split(" ")[0]}, te escribimos del almacén. Tu cuenta de fiados está en ${clp(s)}. ¡Gracias!`;
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(c.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="spread"><div><div class="total">${clp(Math.max(0,s))}</div><div class="small muted">${s > 0 ? "saldo por pagar" : "al día"}${c.phone ? " · " + esc(c.phone) : ""}</div></div>
      ${s > 0 && can("whatsapp") ? `<a class="btn sm" href="${esc(waLink(c.phone, msg))}" ${WA_TARGET}>Recordar por WhatsApp</a>` : ""}</div>
    ${s > 0 && can("whatsapp") ? waWebNote("cweb", c.phone, msg) : ""}
    <div class="grid2">
      <div class="field"><label for="fm">Monto</label><input class="input" id="fm" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="fn">Detalle (opcional)</label><input class="input" id="fn" placeholder="Ej: pan y leche"></div>
    </div>
    ${ext("caja") ? `<div class="field"><label for="fmed">Si es un pago, ¿cómo pagó?</label><select class="input" id="fmed">${MEDIOS.map(([k,n]) => `<option value="${k}">${n}</option>`).join("")}</select></div>` : ""}
    <div class="grid2"><button class="btn primary" id="addFiado">Anotar fiado</button><button class="btn" id="addAbono">Registrar pago</button></div>
    ${!can("fiados") ? "" : s <= 0 ? `<button class="btn ghost block" id="cdel">Eliminar cliente</button>` : `<p class="small muted" style="margin:0">Para eliminar a este cliente, primero tiene que quedar al día.</p>`}
    <div><h3>Movimientos</h3><div class="list">${items.map(i => `<div class="item"><div class="main"><div class="name">${i.type === "fiado" ? esc(i.note || "Fiado") : "Pago"}</div><div class="sub">${i.pending ? `<span class="pill warn">Por enviar</span> ` : ""}${ago(i.at)}${i.type === "abono" && i.medio && ext("caja") ? " · " + medioName(i.medio) : ""}</div></div>
      <span class="diff" style="color:${i.type === "fiado" ? "var(--bad)" : "var(--ok)"}">${i.type === "fiado" ? "+" : "−"}${clp(i.amount)}</span></div>`).join("") || `<div class="empty">Sin movimientos.</div>`}</div></div>
  </div>`);
  const add = type => run(async () => { const a = Math.round(+$("#fm").value || 0); if (a <= 0){ $("#fm").focus(); return; }
    const r = await act.clientMov(c, type, a, $("#fn").value.trim(), $("#fmed")?.value);
    toast((type === "fiado" ? `Fiado anotado: ${clp(a)}` : `Pago registrado: ${clp(a)}`) + (r === "pendiente" ? ". Se enviará cuando vuelva internet." : "")); render(); openCliente(c); });
  const cd = $("#cdel"); if (cd) cd.onclick = () => openModal(`<div class="stack"><h2>¿Eliminar a ${esc(c.name)}?</h2>
    <p style="margin:0">Sale de la lista de fiados. Los pagos que ya hizo siguen contando en el cierre de caja y en los respaldos.</p>
    <div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="cdgo">Eliminar</button></div></div>`) || ($("#cdgo").onclick = () => run(async () => {
      if (c.items.some(i => i.pending)) return toast("Este cliente tiene movimientos por enviar. Espera a que vuelva internet.");
      await act.deleteClient(c); closeModal(); render(); toast(`${c.name} eliminado`); }));
  $("#addFiado").onclick = () => add("fiado");
  $("#addAbono").onclick = () => add("abono");
}
function openNewClient(){
  openModal(`<div class="stack">
    <div class="spread"><h2>Nuevo cliente</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="field"><label for="cn">Nombre</label><input class="input" id="cn" placeholder="Ej: Ana Ejemplo"></div>
    <div class="field"><label for="cp">Celular (para recordatorios)</label><input class="input" id="cp" type="tel" inputmode="tel" autocomplete="off" maxlength="16" placeholder="9 1234 5678"></div>
    <button class="btn primary block" id="csave">Guardar cliente</button></div>`);
  phoneInput($("#cp"));
  $("#csave").onclick = () => run(async () => { const name = $("#cn").value.trim(); if (!name){ $("#cn").focus(); return; }
    if (!phoneOk($("#cp").value)){ $("#cp").focus(); return toast(PHONE_MSG); }
    const c = await act.newClient(name, $("#cp").value.trim()); render(); openCliente(c); });
}

// ---------- Aviso del pan ----------
function openPan(){
  // Si el mensaje quedó vacío vuelve el de siempre
  if (!String(S.panMsg || "").trim()) S.panMsg = PAN_MSG;
  openModal(`<div class="stack">
    <div class="spread"><h2>Avisar que llegó el pan</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="field"><label for="pm">Mensaje</label><textarea class="input" id="pm" rows="3">${esc(S.panMsg)}</textarea></div>
    <a class="btn primary block" id="pango" style="text-align:center;text-decoration:none" href="${esc(waLink("", S.panMsg))}" ${WA_TARGET}>Abrir WhatsApp</a>
    ${waWebNote("panweb", "", S.panMsg)}
    <button class="btn block" id="pancopy">Copiar mensaje</button>
    <button class="btn ghost block" id="pandef">Volver al mensaje de siempre</button>
    ${isDB() ? `<button class="btn block" id="panlink">Agregar el link para reservar pan</button>` : ""}
    <ol class="small muted" style="margin:0;padding-left:18px">
      <li>Se abre WhatsApp con el mensaje ya escrito.</li>
      <li>Eliges el grupo de clientes y tocas enviar.</li>
    </ol>
    <p class="small muted" style="margin:0">El mensaje queda guardado para la próxima vez.</p>
  </div>`);
  $("#pm").oninput = e => { act.panMsg(e.target.value.trim() ? e.target.value : PAN_MSG); $("#pango").href = waLink("", S.panMsg); const w = $("#panweb"); if (w) w.href = waWeb("", S.panMsg); };
  $("#pandef").onclick = () => { const pm = $("#pm"); pm.value = PAN_MSG; pm.oninput({ target:pm }); toast("Mensaje de siempre"); };
  const pl = $("#panlink"); if (pl) pl.onclick = () => { const pm = $("#pm"); if (!pm.value.includes(reservaLink())){ pm.value = pm.value.trim() + "\nReserva tu pan aquí: " + reservaLink(); pm.oninput({ target:pm }); } };
  $("#pancopy").onclick = () => { const t = $("#pm").value;
    const ok = () => toast("Mensaje copiado");
    try { navigator.clipboard.writeText(t).then(ok, () => { $("#pm").select(); toast("Selecciona y copia el texto"); }); } catch(e){ $("#pm").select(); } };
}

// ---------- Reservas (vista previa) ----------
const panes = () => S.products.filter(p => p.cat === "Pan" && p.has);
const panReservable = p => isDB() ? db.panes.some(b => b.activo && b.nombre === p.name) : !!p.reserva;
const BREADS_DEMO = () => panes().filter(panReservable).map(p => p.name);
function resCutoff(){ const d = new Date(); d.setHours(RES_CUT_HOUR,0,0,0); if (d.getTime() > Date.now()) d.setDate(d.getDate()-1); return d.getTime(); }
function purgeReservas(){ const cut = resCutoff(); const n = S.reservas.length; S.reservas = S.reservas.filter(r => r.at && r.at >= cut); if (S.reservas.length !== n) save(); }
const resDetail = q => BREADS_DEMO().filter(b => q[b] > 0).map(b => `${q[b]} ${b.toLowerCase()}`).join(", ");
function viewReservas(){
  const rs = S.reservas.slice().sort((a,b) => (a.at||0) - (b.at||0));
  const q = ui.resQty || (ui.resQty = {});
  const pend = rs.filter(r => !r.done).length;
  return `<header class="top"><button class="btn sm" data-go="mas">← Regresar</button><span class="pill warn">Vista previa</span></header>
  <div class="stack">
    <div><h2>Reservas de pan de hoy</h2><p class="small muted" style="margin:4px 0 0">${pend} por entregar. Toca una reserva para marcarla como entregada. La lista se borra sola cada noche a las ${RES_CUT_HOUR}:00.</p></div>
    <div class="card" style="padding-block:0"><div class="list">${rs.map(r => `<button class="item tap" data-res="${r.id}"><div class="main"><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.detail)}${r.at ? " · reservó " + ago(r.at) : ""}</div></div>
      ${r.done ? `<span class="pill ok">Entregado</span>` : `<span class="pill warn">Pendiente</span>`}</button>`).join("")}</div></div>
    <div class="card stack">
      <h3>Así lo vería el cliente en su celular</h3>
      <div class="field"><label for="rn">Tu nombre</label><input class="input" id="rn" placeholder="Ej: Ana Torres"></div>
      <div class="field"><label>¿Qué pan quieres?</label>
        <div class="list">${BREADS_DEMO().map(b => `<div class="item"><div class="main"><div class="name">${esc(b)}</div></div>
          <div class="stepper"><button data-bdec="${esc(b)}" aria-label="Quitar ${esc(b)}">−</button><span>${q[b]||0}</span><button data-binc="${esc(b)}" aria-label="Agregar ${esc(b)}">+</button></div></div>`).join("")}</div></div>
      <button class="btn accent block" id="rsave" ${Object.values(q).some(n => n > 0) ? "" : "disabled"}>Reservar${Object.values(q).some(n => n > 0) ? " (" + resDetail(q) + ")" : ""}</button>
      <p class="small muted" style="margin:0">Con la base de datos conectada, el cliente abre un link desde el grupo de WhatsApp, reserva desde su casa y la reserva aparece al instante en los celulares de la tienda.</p>
    </div>
  </div>`;
}

// ---------- Reservas reales (modo tienda) ----------
function reservaLink(){ const u = new URL("reservar.html", location.href); u.search = ""; u.hash = ""; return u.href; }
const RES_STATE = { pendiente:["warn","Pendiente"], entregada:["ok","Entregada"], cancelada:["none","Cancelada"] };
function viewReservasDB(){
  const day = ui.resDay || "hoy", dia = day === "hoy" ? hoyChile() : hoyChile(1);
  const forDay = d => S.reservas.filter(r => r.dia === d);
  const rs = forDay(dia).sort((a,b) => (a.estado === "cancelada") - (b.estado === "cancelada") || a.at - b.at);
  const pend = rs.filter(r => r.estado === "pendiente");
  const tot = {}; pend.forEach(r => Object.entries(r.items || {}).forEach(([k,n]) => tot[k] = (tot[k]||0) + n));
  const totTxt = db.panes.map(b => b.nombre).concat(Object.keys(tot)).filter((k,i,a) => tot[k] && a.indexOf(k) === i).map(k => `${tot[k]} ${k.toLowerCase()}`).join(", ");
  const abiertas = db.ajustes.reservas_abiertas !== false, lim = db.ajustes.reservas_hora_limite ?? 19;
  const link = reservaLink(), msg = `🍞 Reserva tu pan en el almacén desde aquí: ${link}`;
  const count = d => forDay(d).filter(r => r.estado === "pendiente").length;
  return `<header class="top"><button class="btn sm" data-go="mas">← Regresar</button><span class="pill ${abiertas?"ok":"none"}">${abiertas?"Recibiendo reservas":"Reservas cerradas"}</span></header>
  <div class="stack">
    <div><h2>Reservas de pan</h2><p class="small muted" style="margin:4px 0 0">Las reservas que hacen los clientes aparecen aquí al instante, en todos los celulares de la tienda.</p></div>
    <div class="chips"><button class="chip" data-rday="hoy" aria-pressed="${day==="hoy"}">Hoy · ${count(hoyChile())}</button><button class="chip" data-rday="manana" aria-pressed="${day==="manana"}">Mañana · ${count(hoyChile(1))}</button></div>
    ${totTxt ? `<div class="formula">Apartar: ${esc(totTxt)}</div>` : ""}
    <div class="card" style="padding-block:0"><div class="list">${rs.map(r => `<button class="item tap" data-res="${r.id}"><div class="main"><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.detail)} · reservó ${ago(r.at)}${r.note ? " · " + esc(r.note) : ""}</div></div>
      <span class="pill ${RES_STATE[r.estado][0]}">${RES_STATE[r.estado][1]}</span></button>`).join("") || `<div class="empty">Todavía no hay reservas para ${day === "hoy" ? "hoy" : "mañana"}.</div>`}</div></div>
    <div class="card stack">
      <h3>Link para que los clientes reserven</h3>
      <div class="code">${esc(link)}</div>
      <div class="grid2">${can("whatsapp") ? `<a class="btn" style="text-align:center" href="${esc(waLink("", msg))}" ${WA_TARGET}>Enviar por WhatsApp</a>` : ""}<button class="btn" id="rcopy">Copiar link</button></div>
      <label class="row"><input type="checkbox" id="ropen" ${abiertas?"checked":""}> Recibir reservas ahora</label>
      <div class="field"><label for="rlim">Reservas para el mismo día hasta las</label><select class="input" id="rlim">${Array.from({ length:18 }, (_, i) => i + 6).map(h => `<option value="${h}" ${h==lim?"selected":""}>${h}:00</option>`).join("")}</select></div>
      <p class="small muted" style="margin:0">Después de esa hora, los clientes solo pueden reservar para el día siguiente.</p>
    </div>
  </div>`;
}
function openReserva(r){
  const first = r.name.split(" ")[0], ready = `Hola ${first}, tu pan reservado (${r.detail}) ya está listo en el almacén. ¡Te esperamos!`;
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(r.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="row"><span class="pill ${RES_STATE[r.estado][0]}">${RES_STATE[r.estado][1]}</span><span class="small muted">Reservó ${ago(r.at)}</span></div>
    <div class="formula">${esc(r.detail)}</div>
    ${r.note ? `<p style="margin:0">Nota: ${esc(r.note)}</p>` : ""}
    ${r.estado === "pendiente" ? `<button class="btn primary block" data-st="entregada">Marcar como entregada</button>` : `<button class="btn block" data-st="pendiente">Volver a pendiente</button>`}
    ${!can("whatsapp") ? "" : r.phone ? `<a class="btn block" style="text-align:center" href="${esc(waLink(r.phone, ready))}" ${WA_TARGET}>Avisarle por WhatsApp que está listo</a>` : `<p class="small muted" style="margin:0">El cliente no dejó celular.</p>`}
    ${r.estado === "pendiente" ? `<button class="btn ghost block" data-st="cancelada">Cancelar reserva</button>` : ""}
  </div>`);
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => run(async () => { await act.reserva(r, b.dataset.st); closeModal(); render(); }));
}

function saveFile(obj, name){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Elegir de una vez los productos que trae un proveedor
function openProvPick(v, fromRecv){
  const sel = new Set(S.products.filter(p => p.provId === v.id).map(p => p.id)), orig = new Set(sel);
  let q = "", cat = "Todos";
  const cats = ["Todos", ...SECTORS.filter(c => S.products.some(p => p.cat === c && p.has))];
  const list = () => findProducts(S.products.filter(p => (p.has || sel.has(p.id)) && (cat === "Todos" || p.cat === cat)).sort((a,b) => a.name.localeCompare(b.name)), q).slice(0, 150).map(p => { const otro = p.provId && p.provId !== v.id ? provById(p.provId) : null;
      return `<label class="item tap"><input type="checkbox" data-vp="${p.id}" ${sel.has(p.id) ? "checked" : ""} style="width:20px;height:20px"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.cat)}${otro ? " · ahora de " + esc(otro.name) : ""}</div></div></label>`; }).join("") || `<div class="empty">Sin resultados.</div>`;
  openModal(`<div class="stack">
    <div class="spread"><h2>Productos de ${esc(v.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <input class="input" id="vpq" placeholder="Buscar, ej: coca" autocomplete="off">
    <div class="chips" style="flex-wrap:wrap">${cats.map(c => `<button class="chip" data-vpc="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("")}</div>
    <div class="card" style="padding-block:0;max-height:50vh;overflow:auto"><div class="list" id="vplist">${list()}</div></div>
    <p class="small muted" style="margin:0">Cada producto queda con un solo proveedor: si ya era de otro, pasa a ${esc(v.name)}.</p>
    <button class="btn primary block" id="vpsave">Guardar (<span id="vpn">${sel.size}</span>)</button>
  </div>`);
  const bind = () => document.querySelectorAll("[data-vp]").forEach(i => i.onchange = () => { i.checked ? sel.add(i.dataset.vp) : sel.delete(i.dataset.vp); $("#vpn").textContent = sel.size; });
  const redraw = () => { $("#vplist").innerHTML = list(); bind(); };
  bind();
  $("#vpq").oninput = e => { q = e.target.value; redraw(); };
  document.querySelectorAll("[data-vpc]").forEach(b => b.onclick = () => { cat = b.dataset.vpc; document.querySelectorAll("[data-vpc]").forEach(x => x.setAttribute("aria-pressed", x === b)); redraw(); });
  $("#vpsave").onclick = () => run(async () => {
    await act.setProv([...sel].filter(id => !orig.has(id)), v.id);
    await act.setProv([...orig].filter(id => !sel.has(id)), null);
    toast(`${sel.size} productos de ${v.name}`); if (fromRecv) closeModal(); else openProv(provById(v.id)); render(); });
}

// ---------- Resumen de ventas (dueña, o quien tenga el permiso) ----------
const RES_PER = [["hoy","Hoy"],["semana","7 días"],["mes","Este mes"],["mespasado","Mes pasado"],["ano","Este año"],["anopasado","Año pasado"]];
function resRange(k){
  const d = new Date(); d.setHours(0,0,0,0);
  if (k === "hoy") return [d, new Date(d.getTime() + D)];
  if (k === "semana") return [new Date(d.getTime() - 6*D), new Date(d.getTime() + D)];
  if (k === "ano") return [new Date(d.getFullYear(), 0, 1), new Date(d.getTime() + D)];
  if (k === "anopasado") return [new Date(d.getFullYear() - 1, 0, 1), new Date(d.getFullYear(), 0, 1)];
  const m0 = new Date(d.getFullYear(), d.getMonth(), 1);
  return k === "mes" ? [m0, new Date(d.getTime() + D)] : [new Date(d.getFullYear(), d.getMonth() - 1, 1), m0];
}
function viewResumen(){
  const k = ui.resPer || "semana";
  return `${backMasHtml()}
  <div class="stack">
    <div><h2>Resumen de ventas</h2><p class="small muted" style="margin:4px 0 0">Lo vendido en el período, por medio de pago, por día y por producto.</p></div>
    <div class="chips">${RES_PER.map(([v, n]) => `<button class="chip" data-rper="${v}" aria-pressed="${k === v}">${n}</button>`).join("")}</div>
    <div id="resbox"><div class="card empty">Calculando…</div></div>
    <button class="btn block" id="resxls" disabled>Descargar en Excel</button>
  </div>`;
}
async function loadResumen(){
  const k = ui.resPer || "semana", [d0, d1] = resRange(k);
  const rows = isDB()
    ? (await all(() => sb.from("movimientos").select("id,producto_id,cantidad,precio,descuento,medio,grupo,at").eq("tipo","venta").gte("at", d0.toISOString()).lt("at", d1.toISOString()).order("at")))
        .map(r => ({ pid:r.producto_id, qty:+r.cantidad, price:r.precio || 0, disc:r.descuento || 0, medio:r.medio, g:r.grupo || r.id, at:iso(r.at) }))
    : S.movs.filter(m => m.type === "venta" && m.at >= d0.getTime() && m.at < d1.getTime()).map(m => ({ pid:m.pid, qty:m.qty, price:m.price || 0, disc:m.disc || 0, medio:m.medio, g:m.at, at:m.at }));
  const box = $("#resbox"); if (ui.view !== "resumen" || !box || (ui.resPer || "semana") !== k) return;
  ui.resRows = { k, rows }; const xb = $("#resxls"); if (xb) xb.disabled = !rows.length;
  if (!rows.length){ box.innerHTML = `<div class="card empty">No hay ventas en este período.</div>`; return; }
  const cc = can("costos"), money = r => lineMoney(r.qty, r.price) - r.disc, porMes = k === "ano" || k === "anopasado";
  let total = 0, gan = 0, sinCosto = new Set(); const medios = {}, dias = {}, prods = {};
  rows.forEach(r => { const m = money(r), p = P(r.pid); total += m;
    medios[r.medio || "efectivo"] = (medios[r.medio || "efectivo"] || 0) + m;
    const dk = new Date(r.at).toLocaleDateString("es-CL", porMes ? { month:"long", year:"numeric" } : { weekday:"short", day:"numeric", month:"short" }); dias[dk] = (dias[dk] || 0) + m;
    const x = prods[r.pid] ||= { qty:0, money:0, gan:0 }; x.qty += r.qty; x.money += m;
    if (p && p.cost){ const g = m - Math.round(r.qty * p.cost); x.gan += g; gan += g; } else sinCosto.add(r.pid); });
  const n = new Set(rows.map(r => r.g)).size, maxDia = Math.max(...Object.values(dias));
  const top = Object.entries(prods).sort((a,b) => b[1].money - a[1].money).slice(0, 10);
  box.innerHTML = `<div class="stack">
    <div class="kpis">
      <div class="card kpi"><div class="num">${clp(total)}</div><div class="lbl">vendido</div></div>
      <div class="card kpi"><div class="num">${n}</div><div class="lbl">${n === 1 ? "venta" : "ventas"} · promedio ${clp(total / n)}</div></div>
      ${cc ? `<div class="card kpi"><div class="num">${clp(gan)}</div><div class="lbl">ganancia estimada${total ? " · " + Math.round(gan / total * 100) + "%" : ""}</div></div>` : ""}
    </div>
    ${cc && sinCosto.size ? `<p class="small muted" style="margin:0">${sinCosto.size} ${sinCosto.size === 1 ? "producto vendido no tiene" : "productos vendidos no tienen"} costo y no ${sinCosto.size === 1 ? "suma" : "suman"} a la ganancia. La ganancia usa el costo actual de cada producto.</p>` : ""}
    <div class="card"><h3>Por medio de pago</h3><div class="list">${MEDIOS.filter(([m]) => medios[m]).map(([m, nm]) => `<div class="item"><div class="main"><div class="name">${nm}</div></div><div class="qty">${clp(medios[m])}</div></div>`).join("")}</div></div>
    ${Object.keys(dias).length > 1 ? `<div class="card stack"><h3>${porMes ? "Por mes" : "Por día"}</h3>${Object.entries(dias).map(([d, m]) => `<div style="display:grid;grid-template-columns:${porMes ? "120px" : "96px"} 1fr 84px;gap:8px;align-items:center"><span class="small muted">${esc(d)}</span><div class="bar" style="margin:0"><i style="width:${Math.max(2, Math.round(m / maxDia * 100))}%"></i></div><span class="small" style="text-align:right;font-weight:600">${clp(m)}</span></div>`).join("")}</div>` : ""}
    <div class="card"><h3>Lo que más vendió</h3><div class="list">${top.map(([id, x]) => { const p = P(id);
      return `<div class="item"><div class="main"><div class="name">${esc(p ? p.name : "Producto")}</div><div class="sub">${p ? fq(x.qty, p) : x.qty}${cc && p && p.cost ? " · ganancia " + clp(x.gan) : ""}</div></div><div class="qty">${clp(x.money)}</div></div>`; }).join("")}</div></div>
  </div>`;
}

// ---------- Descarga a Excel (.xlsx) sin librerías: hojas "Resumen" y "Ventas" ----------
function xlsxBlob(sheets){
  const enc = new TextEncoder(), x = v => String(v).replace(/[<>&"]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;" })[c]);
  const col = i => { let s = ""; for (i++; i; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  // Fila 1 en negrita; los números con separador de miles
  const sheet = rows => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => { const ref = col(ci) + (ri + 1);
    if (v == null || v === "") return ""; if (typeof v === "number") return `<c r="${ref}"${ri ? ` s="2"` : ` s="1"`}><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${ri ? "" : ` s="1"`}><is><t xml:space="preserve">${x(v)}</t></is></c>`; }).join("")}</row>`).join("")}</sheetData></worksheet>`;
  const files = [
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map(([n], i) => `<sheet name="${x(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map(([, rows], i) => [`xl/worksheets/sheet${i + 1}.xml`, sheet(rows)])
  ].map(([n, t]) => [enc.encode(n), enc.encode(t)]);
  // ZIP sin compresión (el formato .xlsx es un zip de archivos XML)
  const crcT = Array.from({ length:256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
  const crc = b => { let c = ~0; for (const v of b) c = crcT[(c ^ v) & 255] ^ (c >>> 8); return ~c >>> 0; };
  const parts = [], cen = []; let off = 0;
  const h = (n, sz) => { const a = new Uint8Array(sz), dv = new DataView(a.buffer); return [a, dv]; };
  for (const [name, data] of files){
    const c = crc(data), [lh, l] = h(0, 30);
    l.setUint32(0, 0x04034b50, true); l.setUint16(4, 20, true); l.setUint32(14, c, true); l.setUint32(18, data.length, true); l.setUint32(22, data.length, true); l.setUint16(26, name.length, true);
    const [ch, e] = h(0, 46);
    e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint32(16, c, true); e.setUint32(20, data.length, true); e.setUint32(24, data.length, true); e.setUint16(28, name.length, true); e.setUint32(42, off, true);
    parts.push(lh, name, data); cen.push(ch, name); off += 30 + name.length + data.length;
  }

function openPanTipo(p){
  const canRes = !isDB() || isAdmin();
  openModal(`<div class="stack">
    <div class="spread"><h2>${p ? esc(p.name) : "Nuevo tipo de pan"}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="grid2">
      <div class="field"><label for="tpn">Nombre</label><input class="input" id="tpn" value="${esc(p?.name || "")}" placeholder="Ej: Coliza"></div>
      <div class="field"><label for="tpp">Precio por unidad</label><input class="input" id="tpp" type="number" min="0" inputmode="numeric" value="${p?.price ?? ""}" placeholder="Ej: 250"></div>
    </div>
    <label class="row"><input type="checkbox" id="tpa" ${!p || p.atajo ? "checked" : ""}> Botón rápido en Vender</label>
    ${ext("pan") ? `<label class="row"><input type="checkbox" id="tpr" ${!p || panReservable(p) ? "checked" : ""} ${canRes ? "" : "disabled"}> Los clientes lo pueden reservar</label>
      ${canRes ? "" : `<p class="small muted" style="margin:0">Solo la administradora cambia el pan que se reserva.</p>`}` : ""}
    <button class="btn primary block" id="tpsave">Guardar</button>
    ${p ? `<button class="btn ghost block" id="tpdel">Ya no lo vendemos</button>` : ""}
  </div>`);
  $("#tpsave").onclick = () => run(async () => {
    const name = $("#tpn").value.trim(), price = Math.round(+$("#tpp").value || 0);
    if (!name) return $("#tpn").focus(); if (price <= 0) return $("#tpp").focus();
    const oldName = p?.name, f = { name, price, atajo:$("#tpa").checked, unit:"un" };
    const prod = p ? await act.updateProduct(p, f) : await act.newProduct({ ...f, cat:"Pan", barcode:"" }, "");
    const r = $("#tpr"); if (r && !r.disabled && (r.checked !== panReservable(prod) || (oldName && oldName !== name))) await act.panReserva(prod, r.checked, oldName);
    closeModal(); render(); toast(`${name} guardado`); });
  const del = $("#tpdel"); if (del) del.onclick = () => run(async () => {
    await act.updateProduct(p, { has:false, atajo:false }); if (panReservable(p) && (!isDB() || isAdmin())) await act.panReserva(p, false);
    closeModal(); render(); toast(`${p.name} quitado`); });
}

let tour = null;
function startBasicTour(){ startTour(basicTour(), true); }
function startTour(steps, basic){
  endTour(false);
  steps = steps.filter(Boolean);
  // En el tutorial de una pantalla se quitan antes los pasos de lo que no está a la vista (por ejemplo, la venta vacía),
  // así la cuenta "3 de 4" no salta números. En el recorrido básico las cosas aparecen a medida que se tocan.
  if (!basic) steps = steps.filter(s => !s.el || s.keep || s.wait || tourFind(s));
  if (!steps.length) return;
  const root = document.createElement("div"); root.id = "tour";
  root.innerHTML = `<div class="tour-hole"></div>${"<div class=\"tour-block\"></div>".repeat(5)}<div class="tour-tip" role="dialog" aria-live="polite"></div>`;
  document.body.appendChild(root);
  tour = { steps, i:-1, seq:0, root, basic, el:null, glideUntil:0,
    snap: basic ? JSON.parse(JSON.stringify({ cart:ui.cart, draft:ui.draft, sector:ui.sector, medio:ui.medio })) : null };
  root.querySelectorAll(".tour-block").forEach(b => b.onclick = () => { const t = root.querySelector(".tour-tip"); t.classList.remove("nudge"); void t.offsetWidth; t.classList.add("nudge"); });
  document.addEventListener("click", tourClick, true);
  document.addEventListener("keydown", tourKey);
  tourStep(0, 1); tourFollow();
}
function endTour(done){
  const t = tour; if (!t) return; tour = null;
  document.removeEventListener("click", tourClick, true); document.removeEventListener("keydown", tourKey);
  t.root.remove();
  if (t.snap){ Object.assign(ui, t.snap); ui.paga = 0; if (MODE) render(); }
  if (t.basic) tourSeen(true);
  if (done) toast(t.basic ? "Tutorial terminado" : "Listo");
}
function tourKey(e){ if (e.key === "Escape") endTour(false); }
window.addEventListener("popstate", () => endTour(false));
function tourClick(e){
  const t = tour; if (!t || e.target.closest(".tour-tip")) return;
  const s = t.steps[t.i];
  if (s?.tap && t.el && t.el.contains(e.target)){ const i = t.i; setTimeout(() => tour === t && t.i === i && tourStep(i + 1, 1), 60); }
}
// El primer elemento que se vea de verdad (no dentro de algo cerrado ni cortado por una fila con scroll)
const tourVisible = el => { const r = el.getBoundingClientRect(); return !!(r.width || r.height); };
const tourFind = s => typeof s.el === "function" ? (x => x && tourVisible(x) ? x : null)(s.el()) : [...document.querySelectorAll(s.el)].find(tourVisible) || null;
// Si está en una fila que se desliza de lado (como los filtros de Productos), la fila se mueve hasta dejarlo al centro
function tourScrollX(el, smooth){
  for (let c = el.parentElement; c && c !== document.body; c = c.parentElement){
    if (c.scrollWidth <= c.clientWidth + 1 || !/(auto|scroll)/.test(getComputedStyle(c).overflowX)) continue;
    const er = el.getBoundingClientRect(), cr = c.getBoundingClientRect();
    if (er.left < cr.left || er.right > cr.right) c.scrollTo({ left: c.scrollLeft + (er.left - cr.left) - (cr.width - er.width) / 2, behavior: smooth ? "smooth" : "auto" });
  }
}
async function tourStep(i, dir){
  const t = tour; if (!t) return;
  const seq = ++t.seq;
  if (i >= t.steps.length) return endTour(true);
  if (i < 0) return tourStep(0, 1);
  const s = t.steps[i], tip = t.root.querySelector(".tour-tip");
  t.i = i; tip.classList.remove("show");
  let el = null;
  if (s.el){
    const wait = s.wait || (t.steps[i - 1]?.tap ? 1500 : 150), t0 = Date.now();
    while (!(el = tourFind(s)) && Date.now() - t0 < wait){ await pause(50); if (tour !== t || t.seq !== seq) return; }
    // Si el elemento no está, el paso se salta; los marcados "keep" se explican igual al centro de la pantalla
    if (!el && !s.keep) return tourStep(i + dir, dir);
  }
  if (el){
    // Primero se mueve la página hasta el elemento y después el foco se desliza hacia él
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    tourScrollX(el, smooth);
    const r = el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 90 || r.left < 0 || r.right > innerWidth){
      el.scrollIntoView({ block:"center", inline:"nearest", behavior: smooth ? "smooth" : "auto" });
    }
    // Espera a que termine de moverse antes de deslizar el foco
    let last = "", still = 0; const t1 = Date.now();
    while (still < 4 && Date.now() - t1 < 900){ await new Promise(requestAnimationFrame); const q = el.getBoundingClientRect(), k = q.left + "," + q.top; still = k === last ? still + 1 : 0; last = k; }
    if (tour !== t || t.seq !== seq) return;
  }
  t.el = el;
  const n = t.steps.length, last = i === n - 1, back = i > 0 && !t.steps[i - 1].tap;
  tip.innerHTML = `<div class="tour-n">${i + 1} de ${n}</div><h4>${esc(s.title)}</h4><p>${s.text}</p>
    <div class="tour-btns"><button class="btn ghost sm" data-tq>Salir</button><span class="sp"></span>${back ? `<button class="btn sm" data-tb>Atrás</button>` : ""}<button class="btn primary sm" data-tn>${last ? "Terminar" : "Siguiente"}</button></div>`;
  tip.querySelector("[data-tq]").onclick = () => endTour(false);
  if (back) tip.querySelector("[data-tb]").onclick = () => tourStep(i - 1, -1);
  // En los pasos de "toca aquí", Siguiente hace el toque por la persona
  tip.querySelector("[data-tn]").onclick = () => s.tap && t.el?.isConnected ? t.el.click() : tourStep(i + 1, 1);
  t.root.querySelector(".tour-hole").classList.toggle("tap", !!s.tap);
  t.root.classList.add("glide"); t.glideUntil = Date.now() + 480;
  tourLayout(); requestAnimationFrame(() => tip.classList.add("show"));
  setTimeout(() => { if (tour === t && t.seq === seq) t.root.classList.remove("glide"); }, 480);
  if (s.type && el){ el.value = ""; el.dispatchEvent(new Event("input")); await pause(500);
    for (const ch of s.type){ if (tour !== t || t.seq !== seq) return; el.value += ch; el.dispatchEvent(new Event("input")); await pause(45); } }
}
// Mantiene el foco sobre el elemento aunque la pantalla se redibuje o se haga scroll
function tourFollow(){
  const t = tour; if (!t) return;
  const s = t.steps[t.i];
  if (s?.el && t.el && !t.el.isConnected){ const el = tourFind(s); if (el) t.el = el; }
  if (Date.now() > t.glideUntil) tourLayout();
  requestAnimationFrame(tourFollow);
}
function tourLayout(){
  const t = tour; if (!t || t.i < 0) return;
  const s = t.steps[t.i], vw = innerWidth, vh = innerHeight, pad = 6;
  let x = vw / 2, y = vh / 2, w = 0, h = 0;
  if (t.el && s.el){ const r = t.el.getBoundingClientRect(); x = r.left - pad; y = r.top - pad; w = r.width + pad * 2; h = r.height + pad * 2; }
  const tip = t.root.querySelector(".tour-tip"), th = tip.offsetHeight, tw = tip.offsetWidth, m = 14;
  const key = [x, y, w, h, vw, vh, t.i, th, tw].map(Math.round).join(","); if (key === t.key) return; t.key = key;
  const hole = t.root.querySelector(".tour-hole");
  Object.assign(hole.style, { left:x + "px", top:y + "px", width:w + "px", height:h + "px" });
  // Bloques que no dejan tocar fuera del foco; el quinto tapa el foco cuando el paso solo explica
  const [b1, b2, b3, b4, b5] = t.root.querySelectorAll(".tour-block"), px = v => v + "px";
  Object.assign(b1.style, { left:0, top:0, width:"100%", height:px(Math.max(0, y)) });
  Object.assign(b2.style, { left:0, top:px(y + h), width:"100%", height:px(Math.max(0, vh - y - h)) });
  Object.assign(b3.style, { left:0, top:px(y), width:px(Math.max(0, x)), height:px(h) });
  Object.assign(b4.style, { left:px(x + w), top:px(y), width:px(Math.max(0, vw - x - w)), height:px(h) });
  Object.assign(b5.style, { left:px(x), top:px(y), width:px(w), height:px(h), display: s.tap || s.free ? "none" : "block" });
  let top;
  if (!w) top = (vh - th) / 2;
  else if (vh - (y + h) >= th + m + 8) top = y + h + m;
  else if (y >= th + m + 8) top = y - th - m;
  else top = vh - th - 8;
  const left = Math.min(Math.max(16, (w ? x + w / 2 : vw / 2) - tw / 2), vw - tw - 16);
  tip.style.transform = `translate(${Math.round(left)}px,${Math.round(Math.max(8, Math.min(top, vh - th - 8)))}px)`;
}
function tourButton(v){
  const h = $("#app header.top"); if (!h || (v !== "inicio" && !TOURS[v])) return;
  const b = document.createElement("button"); b.className = "btn sm helpbtn"; b.innerHTML = `${ICONS.ayuda}<span>Tutorial</span>`;
  b.setAttribute("aria-label", v === "inicio" ? "Tutorial de lo básico" : "Tutorial de esta pantalla");
  b.onclick = () => v === "inicio" ? startBasicTour() : startTour(TOURS[v]());
  const last = h.lastElementChild;
  if (last && last !== h.firstElementChild){ const w = document.createElement("div"); w.className = "row"; w.style.flexWrap = "nowrap"; h.insertBefore(w, last); w.append(last, b); }
  else h.append(b);
}
