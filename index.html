<style>
/* Layout: app de una columna para celular, barra de navegación fija abajo, tarjetas solo donde separan cosas distintas */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526; --accent-soft:#fbefd2;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brandname{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brandname small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.demo-banner{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#1d1606;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.panbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent);color:#1d1606}
.panbtn svg{width:34px;height:34px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panbtn b{display:block;font-size:16px}
.panbtn small{display:block;font-size:13px;opacity:.8}
.mi svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea.input{resize:vertical}
a.btn{color:inherit;text-decoration:none;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
.livebox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.livebox video{width:100%;height:100%;object-fit:cover;display:block}
.liveline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livemsg{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;color:#fff;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.filebtn{position:relative;display:block;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.searchbar{display:flex;gap:8px}
.searchbar .input{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .lbl{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.item.tap{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.qty{font-family:var(--font-display);font-weight:600;font-size:20px;min-width:3ch;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sector{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.sector .name{font-weight:700;font-size:16px}
.sector .sub{font-size:13px;color:var(--muted);grid-column:1/-1}
.formula{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.countrow{display:grid;grid-template-columns:1fr 84px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.countrow .opts{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.countrow .input{text-align:center;font-weight:700;font-size:17px;padding:8px}
.countrow.off{opacity:.55}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper span{min-width:2.2ch;text-align:center;font-weight:700}
.total{font-family:var(--font-display);font-weight:800;font-size:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.diff{font-size:13px;font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
@media (max-width:380px){.kpi .num{font-size:24px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="app" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
"use strict";
const KEY = "almacen-demo-v2";
const H = 3600e3, D = 24*H;
// Las reservas son del día: se borran solas a las 3 de la mañana
const RES_CUT_HOUR = 3;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const uid = () => Math.random().toString(36).slice(2, 10);

const SECTORS = ["Bebidas","Jugos","Lácteos","Abarrotes","Legumbres","Galletas","Conservas","Snacks","Aseo"];

// Catálogo precargado típico de almacén: [nombre, sector, precio venta, costo, popularidad 0-3]
const CATALOG = [
 ["Coca-Cola 1,5 L","Bebidas",1990,1300,3],["Coca-Cola 3 L","Bebidas",2990,2050,2],["Coca-Cola Zero 1,5 L","Bebidas",1990,1300,1],
 ["Sprite 1,5 L","Bebidas",1790,1150,1],["Fanta 1,5 L","Bebidas",1790,1150,1],["Pepsi 1,5 L","Bebidas",1690,1080,1],
 ["Bilz 1,5 L","Bebidas",1590,1000,1],["Pap 1,5 L","Bebidas",1590,1000,1],["Agua mineral sin gas 1,6 L","Bebidas",990,560,2],
 ["Agua mineral con gas 1,6 L","Bebidas",990,560,0],
 ["Jugo en caja naranja 1 L","Jugos",1290,820,2],["Jugo en caja durazno 1 L","Jugos",1290,820,1],["Jugo en caja piña 1 L","Jugos",1290,820,1],
 ["Néctar individual 200 ml","Jugos",450,260,2],["Jugo en polvo sobre","Jugos",150,80,2],
 ["Leche entera 1 L","Lácteos",1150,820,3],["Leche descremada 1 L","Lácteos",1150,820,1],["Yogur batido 125 g","Lácteos",350,210,2],
 ["Mantequilla 250 g","Lácteos",2490,1750,1],["Queso laminado 250 g","Lácteos",2990,2100,1],
 ["Arroz grado 2, 1 kg","Abarrotes",1490,980,2],["Fideos espirales 400 g","Abarrotes",790,480,2],["Fideos spaghetti 400 g","Abarrotes",790,480,2],
 ["Azúcar 1 kg","Abarrotes",1190,820,2],["Harina 1 kg","Abarrotes",1090,720,1],["Sal 1 kg","Abarrotes",490,280,1],
 ["Aceite maravilla 1 L","Abarrotes",2690,1890,2],["Té 20 bolsitas","Abarrotes",990,610,1],["Café instantáneo 170 g","Abarrotes",4990,3500,1],
 ["Pan de molde","Abarrotes",2190,1500,2],
 ["Lentejas 1 kg","Legumbres",1990,1350,1],["Porotos 1 kg","Legumbres",2490,1700,1],["Garbanzos 1 kg","Legumbres",2290,1550,1],
 ["Arvejas partidas 500 g","Legumbres",1190,780,0],
 ["Galletas de agua","Galletas",690,420,2],["Galletas de soda","Galletas",690,420,2],["Galletas rellenas chocolate","Galletas",590,350,3],
 ["Galletas rellenas vainilla","Galletas",590,350,2],["Galletas de vino","Galletas",890,560,1],
 ["Atún lomitos en lata","Conservas",2290,1550,1],["Jurel en lata","Conservas",1990,1300,1],["Choclo en lata","Conservas",1190,760,1],
 ["Salsa de tomate 200 g","Conservas",590,350,2],["Duraznos en almíbar","Conservas",1890,1250,0],
 ["Papas fritas 110 g","Snacks",1490,950,2],["Ramitas 90 g","Snacks",1090,690,1],["Maní salado 100 g","Snacks",990,620,1],
 ["Chocolate 100 g","Snacks",1390,900,2],["Chicle","Snacks",200,110,2],
 ["Papel higiénico 4 rollos","Aseo",2490,1700,1],["Lavaloza 500 ml","Aseo",1490,950,1],["Cloro 1 L","Aseo",990,600,1],
 ["Detergente en polvo 1 kg","Aseo",3490,2400,0],["Jabón de tocador","Aseo",450,270,1]
];

// Generador pseudoaleatorio con semilla, para que la demo siempre arranque igual
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

function atDay(daysAgo, hour, min){ const d = new Date(Date.now() - daysAgo*D); d.setHours(hour, min||0, 0, 0); return d.getTime(); }

function buildSeed(){
  const r = rng(42);
  const products = CATALOG.map((c, i) => ({ id:"p"+i, name:c[0], cat:c[1], price:c[2], cost:c[3], pop:c[4],
    barcode: i < 3 ? ["7800000000011","7800000000028","7800000000035"][i] : "", min: c[4] >= 2 ? 6 : 3,
    has:true, countQty:null, countAt:null, estimated:false }));
  const byName = n => products.find(p => p.name === n);
  byName("Agua mineral con gas 1,6 L").has = false;
  byName("Arvejas partidas 500 g").has = false;
  const movs = [];
  const now = Date.now();
  // Ventas de los últimos 5 días (incluido hoy hasta la hora actual)
  for (let d = 5; d >= 0; d--){
    for (const p of products){
      if (!p.has) continue;
      const n = [0.15, 0.6, 1.6, 3.2][p.pop];
      let k = Math.floor(n + r()*n);
      while (k-- > 0){
        const t = atDay(d, 9 + Math.floor(r()*12), Math.floor(r()*60));
        if (t > now - 5*60e3) continue;
        movs.push({ id:uid(), pid:p.id, type:"venta", qty: r() < 0.2 ? 2 : 1, at:t, price:p.price });
      }
    }
  }
  // Conteos ya hechos: Bebidas hace 3 días, Lácteos hace 2, Galletas ayer (al cierre)
  const counts = { "Bebidas":[3,20,30], "Lácteos":[2,20,15], "Galletas":[1,20,40] };
  const qtys = { "Coca-Cola 1,5 L":30,"Coca-Cola 3 L":12,"Coca-Cola Zero 1,5 L":9,"Sprite 1,5 L":10,"Fanta 1,5 L":8,"Pepsi 1,5 L":6,"Bilz 1,5 L":7,"Pap 1,5 L":6,"Agua mineral sin gas 1,6 L":18,
    "Leche entera 1 L":16,"Leche descremada 1 L":6,"Yogur batido 125 g":14,"Mantequilla 250 g":5,"Queso laminado 250 g":4,
    "Galletas de agua":15,"Galletas de soda":13,"Galletas rellenas chocolate":22,"Galletas rellenas vainilla":16,"Galletas de vino":8 };
  for (const [cat,[d,h,m]] of Object.entries(counts)){
    const t = atDay(d,h,m);
    for (const p of products.filter(p => p.cat === cat && p.has)){
      p.countQty = qtys[p.name] ?? 6; p.countAt = t;
      movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:t });
    }
  }
  // Una compra al proveedor después del conteo de Bebidas
  const coca = byName("Coca-Cola 1,5 L");
  movs.push({ id:uid(), pid:coca.id, type:"compra", qty:24, at:atDay(2,11,15), cost:1300, supplier:"Distribuidora Ejemplo" });
  const agua = byName("Agua mineral sin gas 1,6 L");
  movs.push({ id:uid(), pid:agua.id, type:"compra", qty:12, at:atDay(2,11,15), cost:560, supplier:"Distribuidora Ejemplo" });
  movs.sort((a,b) => a.at - b.at);
  // Si alguna venta deja un producto contado en negativo, se elimina (la demo debe ser coherente)
  for (const p of products){
    if (p.countAt == null) continue;
    let s = p.countQty;
    for (const m of movs.filter(m => m.pid === p.id && m.at > p.countAt)){
      if (m.type === "compra") s += m.qty;
      if (m.type === "venta"){ if (s - m.qty < 1 && p.pop < 3){ m.drop = true; } else s -= m.qty; }
    }
  }
  return Object.assign({ products, movs: movs.filter(m => !m.drop), seededAt: now }, seedExtras());
}

// Fiados, aviso del pan y reservas (datos ficticios de ejemplo; los clientes no tienen celular para no escribirle a nadie real)
function resSeedAt(i){ const cut = resCutoff(), now = Date.now(); return Math.round(cut + (now - cut) * (i + 1) / 6); }
function seedExtras(){
  return {
    clients: [
      { id:"c1", name:"Ana Ejemplo", phone:"", items:[
        { id:uid(), type:"fiado", amount:4580, note:"Pan, leche y mantequilla", at:atDay(4,9,10) },
        { id:uid(), type:"fiado", amount:2990, note:"Coca-Cola 3 L", at:atDay(2,19,40) },
        { id:uid(), type:"abono", amount:3000, note:"", at:atDay(1,12,5) } ] },
      { id:"c2", name:"Pedro Prueba", phone:"", items:[
        { id:uid(), type:"fiado", amount:6200, note:"Cigarros y bebida", at:atDay(6,20,15) },
        { id:uid(), type:"fiado", amount:3700, note:"Pan y jamón", at:atDay(3,8,50) },
        { id:uid(), type:"fiado", amount:2500, note:"Galletas y jugo", at:atDay(0,10,30) } ] },
      { id:"c3", name:"Carla Demo", phone:"", items:[
        { id:uid(), type:"fiado", amount:1990, note:"Leche y yogur", at:atDay(5,18,0) },
        { id:uid(), type:"abono", amount:1990, note:"", at:atDay(2,18,30) } ] }
    ],
    panMsg: "🍞 ¡Llegó el pan calentito! Marraquetas y hallullas recién salidas. Los esperamos en el almacén.",
    reservas: [
      { id:uid(), name:"Ana Ejemplo", detail:"10 marraquetas, 4 hallullas", at:resSeedAt(0), done:true },
      { id:uid(), name:"Luis Ficticio", detail:"6 hallullas", at:resSeedAt(1), done:false },
      { id:uid(), name:"Carla Demo", detail:"4 pan amasado, 2 dobladitas", at:resSeedAt(2), done:false },
      { id:uid(), name:"Jorge Prueba", detail:"15 marraquetas", at:resSeedAt(3), done:false }
    ]
  };
}

let S;
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); } } catch(e){}
  if (!S) S = buildSeed();
  if (!S.clients){ Object.assign(S, seedExtras()); save(); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
load();

const ui = { view:"inicio", cart:[], recv:{ supplier:"Distribuidora Ejemplo", items:[] }, sector:null, draft:{}, prodFilter:"Todos", prodQuery:"", histFilter:"todos" };

const P = id => S.products.find(p => p.id === id);
function stockOf(p){
  if (p.countAt == null) return null;
  let s = p.countQty;
  for (const m of S.movs){ if (m.pid !== p.id || m.at <= p.countAt) continue;
    if (m.type === "compra") s += m.qty; else if (m.type === "venta") s -= m.qty; }
  return s;
}
function pendingSales(p){ return S.movs.filter(m => m.pid === p.id && m.type === "venta").reduce((a,m)=>a+m.qty,0); }
function ago(t){
  const diff = Date.now() - t, d0 = new Date(); d0.setHours(0,0,0,0);
  const hm = new Date(t).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  if (t >= d0.getTime()) return "hoy " + hm;
  if (t >= d0.getTime() - D) return "ayer " + hm;
  const days = Math.ceil((d0.getTime() - t)/D);
  return new Date(t).toLocaleDateString("es-CL",{weekday:"long"}) + " " + hm + (days > 6 ? "" : "");
}
function stockPill(p){
  if (!p.has) return '<span class="pill none">No lo tenemos</span>';
  const s = stockOf(p);
  if (s == null) return '<span class="pill none">Sin contar</span>';
  const est = p.estimated ? " aprox." : "";
  if (s <= 0) return `<span class="pill bad">Agotado</span>`;
  if (s <= p.min) return `<span class="pill warn">Quedan ${s}${est}</span>`;
  return `<span class="pill ok">${s}${est} en stock</span>`;
}
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

// ---------- Escaneo de códigos de barras ----------
async function decodeFile(file){
  if ("BarcodeDetector" in window){
    try { const bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] });
      const bmp = await createImageBitmap(file); const r = await bd.detect(bmp); if (r.length) return r[0].rawValue; } catch(e){}
  }
  if (!window.ZXing) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    return zxingDecode(img, img.width, img.height, 1400, true);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
const zxCanvas = document.createElement("canvas");
function zxingDecode(src, sw, sh, maxSide, hard){
  if (!window.ZXing || !sw || !sh) return null;
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw*scale), h = Math.round(sh*scale);
  zxCanvas.width = w; zxCanvas.height = h;
  const cx = zxCanvas.getContext("2d", { willReadFrequently:true }); cx.drawImage(src, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) lum[i] = (px[i*4]*299 + px[i*4+1]*587 + px[i*4+2]*114) / 1000;
  const hints = new Map(); if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const tryDecode = s => { try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s))).getText(); } catch(e){ return null; } };
  const lsrc = new ZXing.RGBLuminanceSource(lum, w, h);
  return tryDecode(lsrc) || (hard && lsrc.isRotateSupported && lsrc.isRotateSupported() ? tryDecode(lsrc.rotateCounterClockwise()) : null);
}

// Cámara en vivo: funciona cuando la página se abre como sitio propio (https). Dentro de un visor que bloquea la cámara, se usa la foto.
let live = null;
function stopLive(){ if (!live) return; live.stop = true; live.stream?.getTracks().forEach(t => t.stop()); live = null; }
async function startLive(cb){
  stopLive();
  const box = $("#liveBox"); if (!box) return;
  if (!navigator.mediaDevices?.getUserMedia){ box.hidden = true; return; }
  const me = live = { stop:false, stream:null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
    if (me.stop){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#liveVideo"); v.srcObject = stream; await v.play().catch(() => {});
    box.hidden = false; $("#liveMsg").textContent = "Apunta al código de barras";
    let bd = null;
    if ("BarcodeDetector" in window){ try { bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); } catch(e){} }
    const tick = async () => {
      if (me.stop) return;
      let code = null;
      try {
        if (v.readyState >= 2){
          if (bd){ const r = await bd.detect(v); if (r.length) code = r[0].rawValue; }
          else code = zxingDecode(v, v.videoWidth, v.videoHeight, 800, false);
        }
      } catch(e){}
      if (me.stop) return;
      if (code){ if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){} stopLive(); handleCode(code, cb); return; }
      setTimeout(tick, bd ? 150 : 250);
    };
    tick();
  } catch(e){
    if (live === me) live = null;
    box.hidden = true;
    const note = $("#liveNote"); if (note) note.hidden = false;
  }
}
async function handleFile(input, cb){
  const f = input.files && input.files[0]; if (!f) return;
  toast("Leyendo código…");
  const code = await decodeFile(f);
  if (!code){ openScanSheet(cb, "No se pudo leer el código en la foto. Intenta acercarte más, con buena luz y el código derecho, o escríbelo a mano."); return; }
  handleCode(code, cb);
}
function handleCode(code, cb){
  code = String(code).trim(); if (!code) return;
  const p = S.products.find(p => p.barcode === code);
  if (p){ closeModal(); cb(p); return; }
  openAssociate(code, cb);
}

function finishCount(){
  const now = Date.now(), diffs = [];
  let n = 0;
  for (const [pid, d] of Object.entries(ui.draft)){
    const p = P(pid);
    if (d.none === true){ p.has = false; continue; }
    if (d.none === false) p.has = true;
    if (d.qty === "" || d.qty == null) continue;
    const q = Math.max(0, parseInt(d.qty, 10) || 0);
    const expected = stockOf(p);
    if (expected != null && expected !== q) diffs.push([p, expected, q]);
    p.countQty = q; p.countAt = now; p.estimated = !!d.est; n++;
    S.movs.push({ id:uid(), pid, type:"conteo", qty:q, expected, at:now });
  }
  save(); ui.draft = {};
  const sector = ui.sector;
  openModal(`<div class="stack"><h2>Conteo guardado</h2>
    <p style="margin:0">${n} productos de ${esc(sector)} quedaron al día desde ahora (${new Date(now).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"})}). Las ventas que hagan desde este momento se descuentan solas.</p>
    ${diffs.length ? `<div class="card"><h3>Diferencias con lo que esperaba el sistema</h3><div class="list">${diffs.map(([p,e,q]) => `<div class="item"><div class="main"><div class="name">${esc(p.name)}</div><div class="sub">Esperaba ${e}, contaste ${q}</div></div><span class="pill ${q<e?"bad":"ok"}">${q<e?`Faltan ${e-q}`:`Sobran ${q-e}`}</span></div>`).join("")}</div>
      <p class="small muted" style="margin:8px 0 0">Las faltas quedan registradas como merma (vencidos, robo o ventas sin registrar).</p></div>` : ""}
    <button class="btn primary block" data-close>Listo</button></div>`);
  ui.sector = null; render();
}

// ---------- Fiados ----------
const saldo = c => c.items.reduce((a,i) => a + (i.type === "fiado" ? i.amount : -i.amount), 0);
function waPhone(p){ let d = String(p||"").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; else if (d.length === 8) d = "569" + d; return d; }
// En el celular se usa el enlace web (abre la app). En el computador se abre la app de escritorio directo, sin dejar una pestaña abierta.
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
function waQuery(phone, text){ return (phone ? "phone=" + waPhone(phone) + "&" : "") + "text=" + encodeURIComponent(text); }
function waLink(phone, text){ return (IS_MOBILE ? "https://api.whatsapp.com/send?" : "whatsapp://send?") + waQuery(phone, text); }
function waWeb(phone, text){ return "https://web.whatsapp.com/send?" + waQuery(phone, text); }
const WA_TARGET = IS_MOBILE ? 'target="_blank" rel="noopener"' : "";
const waWebNote = (id, phone, text) => IS_MOBILE ? "" : `<p class="small muted" style="margin:0">¿No tienes WhatsApp instalado en este computador? <a id="${id}" href="${esc(waWeb(phone, text))}" target="whatsapp-web" rel="noopener" style="color:var(--brand)">Usar WhatsApp Web</a></p>`;
function viewFiados(){
  const cs = S.clients.slice().sort((a,b) => saldo(b) - saldo(a));
  const total = cs.reduce((a,c) => a + Math.max(0, saldo(c)), 0);
  return `${header("Fiados", "Cuaderno de cuentas de clientes")}
  <div class="stack">
    <div class="card kpi"><div class="num">${clp(total)}</div><div class="lbl">por cobrar entre ${cs.filter(c => saldo(c) > 0).length} clientes</div></div>
    <button class="btn primary block" id="addc">+ Agregar cliente</button>
    <div class="card" style="padding-block:0"><div class="list">${cs.map(c => { const s = saldo(c); const last = c.items.length ? Math.max(...c.items.map(i => i.at)) : null;
      return `<button class="item tap" data-client="${c.id}"><div class="main"><div class="name">${esc(c.name)}</div><div class="sub">${last ? "Último movimiento " + ago(last) : "Sin movimientos"}</div></div>
      ${s > 0 ? `<span class="pill warn">Debe ${clp(s)}</span>` : `<span class="pill ok">Al día</span>`}</button>`; }).join("") || `<div class="empty">Aún no hay clientes.</div>`}</div></div>
    <p class="small muted" style="margin:0">Los fiados se anotan aparte: no cambian el stock ni las ventas del inventario.</p>
  </div>`;
}
function openCliente(c){
  const s = saldo(c);
  const items = c.items.slice().sort((a,b) => b.at - a.at);
  const msg = `Hola ${c.name.split(" ")[0]}, te escribimos del almacén. Tu cuenta de fiados está en ${clp(s)}. ¡Gracias!`;
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(c.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <div class="spread"><div><div class="total">${clp(Math.max(0,s))}</div><div class="small muted">${s > 0 ? "saldo por pagar" : "al día"}${c.phone ? " · " + esc(c.phone) : ""}</div></div>
      ${s > 0 ? `<a class="btn sm" href="${esc(waLink(c.phone, msg))}" ${WA_TARGET}>Recordar por WhatsApp</a>` : ""}</div>
    ${s > 0 ? waWebNote("cweb", c.phone, msg) : ""}
    <div class="grid2">
      <div class="field"><label for="fm">Monto</label><input class="input" id="fm" type="number" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label for="fn">Detalle (opcional)</label><input class="input" id="fn" placeholder="Ej: pan y leche"></div>
    </div>
    <div class="grid2"><button class="btn primary" id="addFiado">Anotar fiado</button><button class="btn" id="addAbono">Registrar pago</button></div>
    <div><h3>Movimientos</h3><div class="list">${items.map(i => `<div class="item"><div class="main"><div class="name">${i.type === "fiado" ? esc(i.note || "Fiado") : "Pago"}</div><div class="sub">${ago(i.at)}</div></div>
      <span class="diff" style="color:${i.type === "fiado" ? "var(--bad)" : "var(--ok)"}">${i.type === "fiado" ? "+" : "−"}${clp(i.amount)}</span></div>`).join("") || `<div class="empty">Sin movimientos.</div>`}</div></div>
  </div>`);
  const add = type => { const a = Math.round(+$("#fm").value || 0); if (a <= 0){ $("#fm").focus(); return; }
    c.items.push({ id:uid(), type, amount:a, note:$("#fn").value.trim(), at:Date.now() }); save(); toast(type === "fiado" ? `Fiado anotado: ${clp(a)}` : `Pago registrado: ${clp(a)}`); render(); openCliente(c); };
  $("#addFiado").onclick = () => add("fiado");
  $("#addAbono").onclick = () => add("abono");
}

// ---------- Reservas (vista previa) ----------
const BREADS = ["Marraquetas","Hallullas","Pan amasado","Dobladitas","Pan integral"];
function resCutoff(){ const d = new Date(); d.setHours(RES_CUT_HOUR,0,0,0); if (d.getTime() > Date.now()) d.setDate(d.getDate()-1); return d.getTime(); }
function purgeReservas(){ const cut = resCutoff(); const n = S.reservas.length; S.reservas = S.reservas.filter(r => r.at && r.at >= cut); if (S.reservas.length !== n) save(); }
const resDetail = q => BREADS.filter(b => q[b] > 0).map(b => `${q[b]} ${b.toLowerCase()}`).join(", ");
function viewReservas(){
  const rs = S.reservas.slice().sort((a,b) => (a.at||0) - (b.at||0));
  const q = ui.resQty || (ui.resQty = {});
  const pend = rs.filter(r => !r.done).length;
  return `<header class="top"><button class="btn sm" data-go="mas">← Más</button><span class="pill warn">Próxima etapa</span></header>
  <div class="stack">
    <div><h2>Reservas de pan de hoy</h2><p class="small muted" style="margin:4px 0 0">${pend} por entregar. Toca una reserva para marcarla como entregada. La lista se borra sola cada noche a las ${RES_CUT_HOUR}:00.</p></div>
    <div class="card" style="padding-block:0"><div class="list">${rs.map(r => `<button class="item tap" data-res="${r.id}"><div class="main"><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.detail)}${r.at ? " · reservó " + ago(r.at) : ""}</div></div>
      ${r.done ? `<span class="pill ok">Entregado</span>` : `<span class="pill warn">Pendiente</span>`}</button>`).join("")}</div></div>
    <div class="card stack">
      <h3>Así lo vería el cliente en su celular</h3>
      <div class="field"><label for="rn">Tu nombre</label><input class="input" id="rn" placeholder="Ej: Ana Torres"></div>
      <div class="field"><label>¿Qué pan quieres?</label>
        <div class="list">${BREADS.map(b => `<div class="item"><div class="main"><div class="name">${esc(b)}</div></div>
          <div class="stepper"><button data-bdec="${esc(b)}" aria-label="Quitar ${esc(b)}">−</button><span>${q[b]||0}</span><button data-binc="${esc(b)}" aria-label="Agregar ${esc(b)}">+</button></div></div>`).join("")}</div></div>
      <button class="btn accent block" id="rsave" ${Object.values(q).some(n => n > 0) ? "" : "disabled"}>Reservar${Object.values(q).some(n => n > 0) ? " (" + resDetail(q) + ")" : ""}</button>
      <p class="small muted" style="margin:0">En la versión final, el cliente abre un link desde el grupo de WhatsApp, reserva desde su casa y la reserva aparece al instante en el celular de la tienda.</p>
    </div>
  </div>`;
}

function viewMas(){
  const pend = S.reservas.filter(r => !r.done).length;
  const opt = (go, icon, title, sub) => `<button class="sector" data-go="${go}"><span class="name" style="display:flex;gap:10px;align-items:center"><span style="width:22px;height:22px;display:inline-flex" class="mi">${ICONS[icon]}</span>${title}</span><span></span><span class="sub">${sub}</span></button>`;
  return `${header("Más", "Otras herramientas")}
  <div class="stack">
    ${opt("recibir","recibir","Recibir mercadería","Registrar lo que llega del proveedor")}
    ${opt("historial","historial","Historial","Todo lo que entra, sale y se cuenta")}
    ${opt("reservas","reservas","Reservas de pan", pend + " pendientes hoy · próxima etapa")}
    <button class="sector" id="panbtn"><span class="name" style="display:flex;gap:10px;align-items:center"><span style="width:22px;height:22px;display:inline-flex" class="mi">${ICONS.pan}</span>Avisar que llegó el pan</span><span></span><span class="sub">Mensaje al grupo de WhatsApp de clientes</span></button>
  </div>`;
}

function bindSearch(onPick){
  const q = $("#q"), res = $("#res");
  const upd = () => { const h = searchResults(q.value); res.hidden = !h; res.innerHTML = h;
    res.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { onPick(P(b.dataset.pick)); }); };
  q.oninput = upd;
}

function render(){
  purgeReservas();
  renderTabs();
  const v = ui.view, app = $("#app");
  app.innerHTML = ({ inicio:viewInicio, vender:viewVender, recibir:viewRecibir, contar:viewContar, productos:viewProductos, historial:viewHistorial, fiados:viewFiados, mas:viewMas, reservas:viewReservas })[v]();
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  const pb = $("#panbtn"); if (pb) pb.onclick = openPan;
  if (v === "fiados"){
    $("#addc").onclick = openNewClient;
    app.querySelectorAll("[data-client]").forEach(b => b.onclick = () => openCliente(S.clients.find(c => c.id === b.dataset.client)));
  }
  if (v === "reservas"){
    app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { const r = S.reservas.find(r => r.id === b.dataset.res); r.done = !r.done; save(); render(); });
    const rn = $("#rn"); rn.value = ui.resName || ""; rn.oninput = () => ui.resName = rn.value;
    const step = (b, d) => { ui.resQty[b] = Math.max(0, (ui.resQty[b]||0) + d); const y = window.scrollY; render(); window.scrollTo(0, y); };
    app.querySelectorAll("[data-binc]").forEach(x => x.onclick = () => step(x.dataset.binc, 1));
    app.querySelectorAll("[data-bdec]").forEach(x => x.onclick = () => step(x.dataset.bdec, -1));
    $("#rsave").onclick = () => { const name = rn.value.trim(); if (!name){ rn.focus(); toast("Escribe tu nombre"); return; }
      const detail = resDetail(ui.resQty); if (!detail) return;
      S.reservas.push({ id:uid(), name, detail, at:Date.now(), done:false }); ui.resQty = {}; ui.resName = ""; save(); render(); toast(`Reserva de ${name} recibida`); };
  }
  if (v === "inicio"){
    $("#reset").onclick = () => openModal(`<div class="stack"><h2>¿Reiniciar la demo?</h2><p style="margin:0">Se borran los cambios hechos y vuelven los datos de ejemplo.</p><div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="doreset">Reiniciar</button></div></div>`) || ($("#doreset").onclick = () => { S = buildSeed(); save(); ui.cart = []; ui.recv.items = []; ui.draft = {}; closeModal(); render(); toast("Demo reiniciada"); });
  }
  if (v === "vender"){
    bindSearch(addToCart);
    $("#scan").onclick = () => openScanSheet(p => { addToCart(p); toast(`+1 ${p.name}`); });
    app.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { ui.cart[b.dataset.inc].qty++; render(); });
    app.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const l = ui.cart[b.dataset.dec]; if (--l.qty <= 0) ui.cart.splice(b.dataset.dec,1); render(); });
    $("#confirm").onclick = () => { const now = Date.now(); let t = 0;
      ui.cart.forEach(l => { const p = P(l.pid); t += l.qty*p.price; S.movs.push({ id:uid(), pid:l.pid, type:"venta", qty:l.qty, at:now, price:p.price }); });
      ui.cart = []; save(); render(); toast(`Venta registrada: ${clp(t)}`); };
  }
  if (v === "recibir"){
    bindSearch(addToRecv);
    $("#sup").oninput = e => ui.recv.supplier = e.target.value;
    $("#scan").onclick = () => openScanSheet(p => addToRecv(p));
    app.querySelectorAll("[data-rq]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rq].qty = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rc]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rc].cost = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rq],[data-rc]").forEach(i => i.onchange = render);
    $("#confirm").onclick = () => { const now = Date.now(); let n = 0;
      ui.recv.items.forEach(l => { if (!l.qty) return; const p = P(l.pid); p.cost = l.cost; p.has = true; n += l.qty; S.movs.push({ id:uid(), pid:l.pid, type:"compra", qty:l.qty, at:now, cost:l.cost, supplier:ui.recv.supplier }); });
      ui.recv.items = []; save(); render(); toast(`Recepción guardada: ${n} unidades`); };
  }
  if (v === "contar"){
    app.querySelectorAll("[data-sector]").forEach(b => b.onclick = () => { ui.sector = b.dataset.sector; ui.draft = {}; render(); window.scrollTo(0,0); });
    if (ui.sector){
      $("#back").onclick = () => { ui.sector = null; render(); };
      app.querySelectorAll("[data-cq]").forEach(i => i.oninput = () => { (ui.draft[i.dataset.cq] ||= {}).qty = i.value; });
      app.querySelectorAll("[data-ce]").forEach(i => i.onchange = () => { (ui.draft[i.dataset.ce] ||= {}).est = i.checked; });
      app.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { const p = P(b.dataset.cn); const d = (ui.draft[p.id] ||= {}); const off = d.none ?? !p.has; d.none = !off; render(); });
      $("#scan").onclick = () => openScanSheet(p => {
        if (p.cat !== ui.sector) toast(`${p.name} es del sector ${p.cat}; se suma igual`); else toast(`+1 ${p.name}`);
        const d = (ui.draft[p.id] ||= {}); d.qty = String((parseInt(d.qty,10)||0) + 1); d.none = false; render(); });
      $("#addp").onclick = () => openProductForm(ui.sector, "", () => render());
      $("#finish").onclick = finishCount;
    }
  }
  if (v === "productos"){
    $("#pq").oninput = e => { ui.prodQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
    app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.prodFilter = b.dataset.f; render(); });
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProduct(P(b.dataset.open)));
    $("#addp").onclick = () => openProductForm(ui.prodFilter==="Todos" ? null : ui.prodFilter, "", null);
  }
  if (v === "historial"){
    app.querySelectorAll("[data-hf]").forEach(b => b.onclick = () => { ui.histFilter = b.dataset.hf; render(); });
  }
}
render();
})();
</script>

</body>
</html>
