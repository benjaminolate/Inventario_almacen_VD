<style>
/* Layout: app de una columna para celular, barra de navegación fija abajo, tarjetas solo donde separan cosas distintas */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526; --accent-soft:#fbefd2;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --accent-fg:#1d1606;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f; --accent-soft:#3a3120;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brandname{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brandname small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.demo-banner{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.panbtn{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:14px 16px;background:var(--accent);color:var(--accent-fg)}
.panbtn svg{width:34px;height:34px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panbtn b{display:block;font-size:16px}
.panbtn small{display:block;font-size:13px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.qbtn{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:var(--r);padding:12px;background:var(--accent);color:var(--accent-fg);min-height:56px}
.qbtn svg{width:26px;height:26px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.qbtn b{display:block;font-size:15px}
.qbtn small{display:block;font-size:12px;opacity:.8}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0}
.swatch[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:2px}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#e44,#ec4,#4c6,#4ae,#a4e,#e44)}
.swatch.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.fontopt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-size:17px}
.fontopt[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.netpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.netpill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.netpill.warn i{background:var(--warn)} .netpill.bad{color:var(--bad)} .netpill.bad i{background:var(--bad)}
.lk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lk:last-child{border-bottom:0}
.lk svg{width:24px;height:24px;flex:none;stroke:var(--brand);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lk .main{flex:1;min-width:0}
.lk .btn{padding:6px 9px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;overflow:hidden;font-family:var(--font-display);font-weight:800;font-size:28px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.qrbox{background:#fff;border-radius:var(--r);padding:16px;display:grid;place-items:center}
.qrbox svg{width:100%;max-width:280px;height:auto}
.mi svg{width:22px;height:22px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea.input{resize:vertical;font:inherit}
a.btn{color:inherit;text-decoration:none;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
.livebox{position:relative;border-radius:var(--r);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.livebox video{width:100%;height:100%;object-fit:cover;display:block}
.liveline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.livemsg{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;color:#fff;background:rgba(0,0,0,.45);font-size:13px;font-weight:600}
.filebtn{position:relative;display:block;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.searchbar{display:flex;gap:8px}
.searchbar .input{flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1}
.kpi .lbl{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted)}
.item.tap{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.qty{font-family:var(--font-display);font-weight:600;font-size:20px;min-width:3ch;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--surface-2);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sector{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.sector .name{font-weight:700;font-size:16px}
.sector .sub{font-size:13px;color:var(--muted);grid-column:1/-1}
.formula{font-family:var(--font-display);font-weight:600;font-size:15px;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.countrow{display:grid;grid-template-columns:1fr 84px;gap:8px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.countrow .opts{grid-column:1/-1;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.countrow .input{text-align:center;font-weight:700;font-size:17px;padding:8px}
.countrow.off{opacity:.55}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.stepper span{min-width:2.2ch;text-align:center;font-weight:700}
.total{font-family:var(--font-display);font-weight:800;font-size:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(10,16,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.diff{font-size:13px;font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;overflow-wrap:anywhere}
@media (max-width:380px){.kpi .num{font-size:24px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
(function(){
"use strict";
const KEY = "almacen-demo-v2";
const H = 3600e3, D = 24*H;
// Las reservas son del día: se borran solas a las 3 de la mañana
const RES_CUT_HOUR = 3;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const uid = () => Math.random().toString(36).slice(2, 10);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));

const SECTORS = ["Pan","Verduras","Bebidas","Jugos","Lácteos","Abarrotes","Legumbres","Galletas","Conservas","Snacks","Aseo"];

// Catálogo precargado típico de almacén: [nombre, sector, precio venta, costo, popularidad 0-3, unidad, botón rápido, se reserva]
// unidad "kg" = a granel: el precio es por kilo y se vende por peso o por monto
const CATALOG = [
 ["Marraqueta","Pan",250,160,3,"un",1,1],["Hallulla","Pan",250,160,3,"un",1,1],["Pan amasado","Pan",400,260,2,"un",1,1],
 ["Dobladitas","Pan",250,160,1,"un",0,1],["Pan integral","Pan",300,200,1,"un",0,1],
 ["Tomate","Verduras",1490,900,2,"kg"],["Papa","Verduras",990,550,2,"kg"],["Cebolla","Verduras",990,550,2,"kg"],["Zanahoria","Verduras",990,550,1,"kg"],
 ["Palta","Verduras",4990,3500,1,"kg"],["Limón","Verduras",1990,1200,1,"kg"],["Plátano","Verduras",1290,800,1,"kg"],["Lechuga","Verduras",990,600,1],
 ["Coca-Cola 1,5 L","Bebidas",1990,1300,3],["Coca-Cola 3 L","Bebidas",2990,2050,2],["Coca-Cola Zero 1,5 L","Bebidas",1990,1300,1],
 ["Sprite 1,5 L","Bebidas",1790,1150,1],["Fanta 1,5 L","Bebidas",1790,1150,1],["Pepsi 1,5 L","Bebidas",1690,1080,1],
 ["Bilz 1,5 L","Bebidas",1590,1000,1],["Pap 1,5 L","Bebidas",1590,1000,1],["Agua mineral sin gas 1,6 L","Bebidas",990,560,2],
 ["Agua mineral con gas 1,6 L","Bebidas",990,560,0],
 ["Jugo en caja naranja 1 L","Jugos",1290,820,2],["Jugo en caja durazno 1 L","Jugos",1290,820,1],["Jugo en caja piña 1 L","Jugos",1290,820,1],
 ["Néctar individual 200 ml","Jugos",450,260,2],["Jugo en polvo sobre","Jugos",150,80,2],
 ["Leche entera 1 L","Lácteos",1150,820,3],["Leche descremada 1 L","Lácteos",1150,820,1],["Yogur batido 125 g","Lácteos",350,210,2],
 ["Mantequilla 250 g","Lácteos",2490,1750,1],["Queso laminado 250 g","Lácteos",2990,2100,1],
 ["Arroz grado 2, 1 kg","Abarrotes",1490,980,2],["Fideos espirales 400 g","Abarrotes",790,480,2],["Fideos spaghetti 400 g","Abarrotes",790,480,2],
 ["Azúcar 1 kg","Abarrotes",1190,820,2],["Harina 1 kg","Abarrotes",1090,720,1],["Sal 1 kg","Abarrotes",490,280,1],
 ["Aceite maravilla 1 L","Abarrotes",2690,1890,2],["Té 20 bolsitas","Abarrotes",990,610,1],["Café instantáneo 170 g","Abarrotes",4990,3500,1],
 ["Pan de molde","Abarrotes",2190,1500,2],
 ["Lentejas 1 kg","Legumbres",1990,1350,1],["Porotos 1 kg","Legumbres",2490,1700,1],["Garbanzos 1 kg","Legumbres",2290,1550,1],
 ["Arvejas partidas 500 g","Legumbres",1190,780,0],
 ["Galletas de agua","Galletas",690,420,2],["Galletas de soda","Galletas",690,420,2],["Galletas rellenas chocolate","Galletas",590,350,3],
 ["Galletas rellenas vainilla","Galletas",590,350,2],["Galletas de vino","Galletas",890,560,1],
 ["Atún lomitos en lata","Conservas",2290,1550,1],["Jurel en lata","Conservas",1990,1300,1],["Choclo en lata","Conservas",1190,760,1],
 ["Salsa de tomate 200 g","Conservas",590,350,2],["Duraznos en almíbar","Conservas",1890,1250,0],
 ["Papas fritas 110 g","Snacks",1490,950,2],["Ramitas 90 g","Snacks",1090,690,1],["Maní salado 100 g","Snacks",990,620,1],
 ["Chocolate 100 g","Snacks",1390,900,2],["Chicle","Snacks",200,110,2],
 ["Papel higiénico 4 rollos","Aseo",2490,1700,1],["Lavaloza 500 ml","Aseo",1490,950,1],["Cloro 1 L","Aseo",990,600,1],
 ["Detergente en polvo 1 kg","Aseo",3490,2400,0],["Jabón de tocador","Aseo",450,270,1]
];

// Generador pseudoaleatorio con semilla, para que la demo siempre arranque igual
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }

function atDay(daysAgo, hour, min){ const d = new Date(Date.now() - daysAgo*D); d.setHours(hour, min||0, 0, 0); return d.getTime(); }

function buildSeed(){
  const r = rng(42);
  const products = CATALOG.map((c, i) => ({ id:"p"+i, name:c[0], cat:c[1], price:c[2], cost:c[3], pop:c[4],
    barcode:"", min: c[1] === "Pan" ? 10 : c[5] === "kg" ? (c[4] >= 2 ? 2 : 1) : c[4] >= 2 ? 6 : 3, unit:c[5] || "un", atajo:!!c[6], reserva:!!c[7],
    has:true, countQty:null, countAt:null, estimated:false }));
  ["7800000000011","7800000000028","7800000000035"].forEach((b, i) => { products.find(p => p.name === ["Coca-Cola 1,5 L","Coca-Cola 3 L","Coca-Cola Zero 1,5 L"][i]).barcode = b; });
  const byName = n => products.find(p => p.name === n);
  byName("Agua mineral con gas 1,6 L").has = false;
  byName("Arvejas partidas 500 g").has = false;
  const movs = [];
  const now = Date.now();
  // Ventas de los últimos 5 días (incluido hoy hasta la hora actual)
  for (let d = 5; d >= 0; d--){
    for (const p of products){
      if (!p.has) continue;
      const n = [0.15, 0.6, 1.6, 3.2][p.pop];
      let k = Math.floor(n + r()*n);
      while (k-- > 0){
        const t = atDay(d, 9 + Math.floor(r()*12), Math.floor(r()*60));
        if (t > now - 5*60e3) continue;
        movs.push({ id:uid(), pid:p.id, type:"venta", qty: p.unit === "kg" ? Math.round((0.25 + r()*1.25) * 4) / 4 : p.cat === "Pan" ? 2 + Math.floor(r()*9) : r() < 0.2 ? 2 : 1, at:t, price:p.price });
      }
    }
  }
  // Conteos ya hechos: Bebidas hace 3 días, Lácteos hace 2, Galletas ayer (al cierre)
  const counts = { "Bebidas":[3,20,30], "Lácteos":[2,20,15], "Galletas":[1,20,40] };
  const qtys = { "Coca-Cola 1,5 L":30,"Coca-Cola 3 L":12,"Coca-Cola Zero 1,5 L":9,"Sprite 1,5 L":10,"Fanta 1,5 L":8,"Pepsi 1,5 L":6,"Bilz 1,5 L":7,"Pap 1,5 L":6,"Agua mineral sin gas 1,6 L":18,
    "Leche entera 1 L":16,"Leche descremada 1 L":6,"Yogur batido 125 g":14,"Mantequilla 250 g":5,"Queso laminado 250 g":4,
    "Galletas de agua":15,"Galletas de soda":13,"Galletas rellenas chocolate":22,"Galletas rellenas vainilla":16,"Galletas de vino":8 };
  for (const [cat,[d,h,m]] of Object.entries(counts)){
    const t = atDay(d,h,m);
    for (const p of products.filter(p => p.cat === cat && p.has)){
      p.countQty = qtys[p.name] ?? 6; p.countAt = t;
      movs.push({ id:uid(), pid:p.id, type:"conteo", qty:p.countQty, expected:null, at:t });
    }

const net = { fail:false, rt:"conectando" };
const isNetErr = e => /Failed to fetch|NetworkError|Load failed|sin conexión|fetch failed|AbortError|aborted|timed? ?out/i.test((e && (e.message || e.details)) || "");
function netState(){
  const n = outbox.list().length, por = n ? ` · ${n} por enviar` : "";
  if (!navigator.onLine || net.fail) return ["bad", "Sin internet" + por];
  if (n) return ["warn", `Enviando ${n}…`];
  if (net.rt === "error") return ["warn", "Reconectando…"]; return ["", "En línea"]; }

async function q(req){
  let res; try { res = await req; } catch(e){ if (isNetErr(e)){ net.fail = true; setNet(); } throw e; }
  const { data, error } = res;
  if (error){ if (isNetErr(error)){ net.fail = true; setNet(); } throw error; }
  if (net.fail){ net.fail = false; setNet(); }
  return data;
}
// Supabase entrega hasta 1000 filas por consulta: se piden de a bloques

function upsert(list, obj){ const cur = list.find(x => x.id === obj.id); if (cur) return Object.assign(cur, obj); list.push(obj); return obj; }

  if (/Invalid login credentials/i.test(m)) return "Usuario o contraseña incorrectos";
  if (/already registered/i.test(m)) return "Ese usuario ya existe";
  if (/Password should be/i.test(m)) return "La contraseña debe tener al menos 6 caracteres";
  return m || "Algo salió mal";

// Redibuja sin interrumpir a quien está escribiendo en un campo
let renderWaiting = false;
function softRender(){
  if (!MODE) return;
  const a = document.activeElement;
  if (a && $("#app").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
    if (!renderWaiting){ renderWaiting = true; a.addEventListener("blur", () => { renderWaiting = false; setTimeout(softRender, 50); }, { once:true }); }
    return;
  }

}
function dbSubscribe(){
  if (db.channel) sb.removeChannel(db.channel);
  const ch = db.channel = sb.channel("tienda");
  const on = (table, fn) => ch.on("postgres_changes", { event:"*", schema:"public", table }, fn);
  on("movimientos", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    if (!S.movs.some(m => m.id === r.id)){ S.movs.push(movFromRow(r)); S.movs.sort((a, b) => a.at - b.at); }
    if (r.vence && !S.vencs.some(m => m.id === r.id)) S.vencs.push(movFromRow(r));
    refreshSoon(r.producto_id); });
  on("productos", ({ new:r, old:o }) => refreshSoon(r?.id || o?.id));
  on("clientes", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon();
    const c = S.clients.find(c => c.id === r.id); if (c) Object.assign(c, { name:r.nombre, phone:r.telefono || "" }); else S.clients.push(cliFromRow(r)); softRender(); });
  on("fiados", ({ eventType, new:r }) => { if (eventType !== "INSERT") return reloadSoon();
    const c = S.clients.find(c => c.id === r.cliente_id); if (!c) return reloadSoon();
    if (!c.items.some(i => i.id === r.id)) c.items.push(fiaFromRow(r)); softRender(); });
  on("reservas", ({ eventType, new:r }) => { if (eventType === "DELETE") return reloadSoon(); if (r.dia < hoyChile()) return;
    const isNew = !S.reservas.some(x => x.id === r.id); upsert(S.reservas, resFromRow(r));
    if (isNew && eventType === "INSERT"){ toast(`Nueva reserva de pan: ${r.nombre}`); try { navigator.vibrate && navigator.vibrate([80, 60, 80]); } catch(e){} }
    softRender(); });
  on("ajustes", ({ new:r }) => { if (!r?.clave) return; db.ajustes[r.clave] = r.valor; if (r.clave === "mensaje_pan") S.panMsg = r.valor; softRender(); });
  on("perfiles", reloadSoon);
  on("panes", reloadSoon);
  on("proveedores", reloadSoon);
  on("ofertas", reloadSoon);
  on("cierres", reloadSoon);
  // Al reconectarse (por ejemplo, el celular estuvo bloqueado) se recarga todo para no perder cambios
  ch.subscribe(st => { net.rt = st === "SUBSCRIBED" ? "ok" : "error"; setNet();
    if (st === "SUBSCRIBED"){ if (db.joined) reloadSoon(); db.joined = true; } });
}


// ---------- Sin internet: ventas y fiados se guardan en el celular y se envían solos ----------
// Cada venta lleva su propio número (grupo_id), así que si llega dos veces se guarda una sola.
const OUTBOX_KEY = "almacen-por-enviar", COPY_KEY = "almacen-copia";
const outbox = {
  list(){ try { return JSON.parse(localStorage.getItem(OUTBOX_KEY)) || []; } catch(e){ return []; } },
  set(l){ try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(l)); } catch(e){} },
  add(it){ const l = this.list(); l.push(it); this.set(l); },
  drop(id){ this.set(this.list().filter(x => x.id !== id)); }
};
const pendingQty = pid => outbox.list().reduce((a, it) => a + (it.kind === "venta" ? it.lines.filter(l => l.pid === pid).reduce((b, l) => b + l.qty, 0) : 0), 0);
// Muestra lo que está por enviar como si ya estuviera guardado (historial, ventas del día, fiados)
function applyPending(){
  for (const it of outbox.list()){
    if (it.kind === "venta") it.lines.forEach((l, i) => { const id = `${it.id}-${i}`;
      if (!S.movs.some(m => m.id === id)) S.movs.push({ id, pid:l.pid, type:"venta", qty:l.qty, at:it.at, price:l.price, disc:l.disc, medio:it.medio, user:db.profile?.id, pending:true }); });
    if (it.kind === "fiado"){ const c = S.clients.find(c => c.id === it.cliente);
      if (c && !c.items.some(i => i.id === it.id)) c.items.push({ id:it.id, type:it.tipo, amount:it.monto, note:it.nota, at:it.at, medio:it.medio, user:db.profile?.id, pending:true }); }
  }
  S.movs.sort((a, b) => a.at - b.at);
}
// Un error que no se arregla reintentando (por ejemplo, un producto borrado): se aparta para no trabar a los demás
const isFinalErr = e => !isNetErr(e) && (e?.code === "P0001" || /^2[23]/.test(e?.code || ""));
function withTimeout(req, ms){ const c = new AbortController(); setTimeout(() => c.abort(), ms); return req.abortSignal(c.signal); }
async function sendItem(it){
  if (it.kind === "venta"){
    await q(withTimeout(sb.rpc("registrar_venta", { items: it.lines.map(l => ({ producto_id:l.pid, cantidad:l.qty, precio:l.price, descuento:l.disc })),
      medio:it.medio, grupo_id:it.id, hora:new Date(it.at).toISOString() }), 10000));
    S.movs = S.movs.filter(m => !(m.pending && m.id.startsWith(it.id + "-")));
    const rows = await q(sb.from("movimientos").select("*").eq("grupo", it.id));
    rows.forEach(r => { if (!S.movs.some(m => m.id === r.id)) S.movs.push(movFromRow(r)); });
    S.movs.sort((a, b) => a.at - b.at);
    await fetchProducts(it.lines.map(l => l.pid)).catch(() => {});
  } else {
    await q(withTimeout(sb.from("fiados").upsert({ id:it.id, cliente_id:it.cliente, tipo:it.tipo, monto:it.monto, nota:it.nota, medio:it.medio, at:new Date(it.at).toISOString() },
      { onConflict:"id", ignoreDuplicates:true }), 10000));
    const c = S.clients.find(c => c.id === it.cliente), i = c?.items.find(i => i.id === it.id); if (i) delete i.pending;
  }
}
let flushing = null;
function flushOutbox(){
  if (flushing) return flushing;
  if (!isDB() || !outbox.list().length) return Promise.resolve(true);
  flushing = (async () => {
    let it;
    while ((it = outbox.list()[0])){
      if (!navigator.onLine){ net.fail = true; break; }
      try { await sendItem(it); outbox.drop(it.id); }
      catch(e){
        if (!isFinalErr(e)) break;
        outbox.drop(it.id); S.movs = S.movs.filter(m => !(m.pending && m.id.startsWith(it.id + "-")));
        try { const f = JSON.parse(localStorage.getItem(OUTBOX_KEY + "-fallidas")) || []; f.push({ ...it, error:e.message }); localStorage.setItem(OUTBOX_KEY + "-fallidas", JSON.stringify(f)); } catch(x){}
        toast(`No se pudo guardar ${it.kind === "venta" ? "una venta" : "un fiado"} hecho sin internet: ${friendly(e)}`);
      }
    }
    return !outbox.list().length;
  })().finally(() => { flushing = null; setNet(); softRender(); });
  return flushing;
}
setInterval(() => { if (isDB() && outbox.list().length && navigator.onLine) flushOutbox().then(ok => ok && reloadSoon()); }, 20000);

// ---------- Escaneo de códigos de barras ----------
async function decodeFile(file){
  if ("BarcodeDetector" in window){
    try { const bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] });
      const bmp = await createImageBitmap(file); const r = await bd.detect(bmp); if (r.length) return r[0].rawValue; } catch(e){}
  }
  if (!window.ZXing) return null;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    return zxingDecode(img, img.width, img.height, 1400, true);
  } catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}
const zxCanvas = document.createElement("canvas");
function zxingDecode(src, sw, sh, maxSide, hard){
  if (!window.ZXing || !sw || !sh) return null;
  const scale = Math.min(1, maxSide / Math.max(sw, sh));
  const w = Math.round(sw*scale), h = Math.round(sh*scale);
  zxCanvas.width = w; zxCanvas.height = h;
  const cx = zxCanvas.getContext("2d", { willReadFrequently:true }); cx.drawImage(src, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data, lum = new Uint8ClampedArray(w*h);
  for (let i = 0; i < w*h; i++) lum[i] = (px[i*4]*299 + px[i*4+1]*587 + px[i*4+2]*114) / 1000;
  const hints = new Map(); if (hard) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
  const tryDecode = s => { try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(s))).getText(); } catch(e){ return null; } };
  const lsrc = new ZXing.RGBLuminanceSource(lum, w, h);
  return tryDecode(lsrc) || (hard && lsrc.isRotateSupported && lsrc.isRotateSupported() ? tryDecode(lsrc.rotateCounterClockwise()) : null);
}

// Cámara en vivo: funciona cuando la página se abre como sitio propio (https). Dentro de un visor que bloquea la cámara, se usa la foto.
let live = null;
function stopLive(){ if (!live) return; live.stop = true; live.stream?.getTracks().forEach(t => t.stop()); live = null; }
async function startLive(cb){
  stopLive();
  const box = $("#liveBox"); if (!box) return;
  if (!navigator.mediaDevices?.getUserMedia){ box.hidden = true; return; }
  const me = live = { stop:false, stream:null };
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false });
    if (me.stop){ stream.getTracks().forEach(t => t.stop()); return; }
    me.stream = stream;
    const v = $("#liveVideo"); v.srcObject = stream; await v.play().catch(() => {});
    box.hidden = false; $("#liveMsg").textContent = "Apunta al código de barras";
    let bd = null;
    if ("BarcodeDetector" in window){ try { bd = new BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); } catch(e){} }
    const tick = async () => {
      if (me.stop) return;
      let code = null;
      try {
        if (v.readyState >= 2){
          if (bd){ const r = await bd.detect(v); if (r.length) code = r[0].rawValue; }
          else code = zxingDecode(v, v.videoWidth, v.videoHeight, 800, false);
        }
      } catch(e){}
      if (me.stop) return;
      if (code){ if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){} stopLive(); handleCode(code, cb); return; }
      setTimeout(tick, bd ? 150 : 250);
    };
    tick();
  } catch(e){
    if (live === me) live = null;
    box.hidden = true;
    const note = $("#liveNote"); if (note) note.hidden = false;
  }
}
async function handleFile(input, cb){
  const f = input.files && input.files[0]; if (!f) return;
  toast("Leyendo código…");
  const code = await decodeFile(f);
  if (!code){ openScanSheet(cb, "No se pudo leer el código en la foto. Intenta acercarte más, con buena luz y el código derecho, o escríbelo a mano."); return; }
  handleCode(code, cb);
}
function handleCode(code, cb){
  code = String(code).trim(); if (!code) return;
  const p = S.products.find(p => p.barcode === code);
  if (p){ closeModal(); cb(p); return; }
  openAssociate(code, cb);
}

// Tema: automático (según el celular), claro u oscuro; se recuerda en cada aparato
const THEME_KEY = "almacen-tema";
function getTheme(){ try { return localStorage.getItem(THEME_KEY) || "auto"; } catch(e){ return "auto"; } }
function applyTheme(t){ const r = document.documentElement; if (t === "claro") r.dataset.theme = "light"; else if (t === "oscuro") r.dataset.theme = "dark"; else delete r.dataset.theme; }
function setTheme(t){ try { localStorage.setItem(THEME_KEY, t); } catch(e){} applyTheme(t); applyLook(); }
// Fuente y colores personalizados (también por aparato)
const LOOK_KEY = "almacen-apariencia";
const FONTS = [["figtree","Original","Figtree"],["nunito","Redondeada","Nunito"],["inter","Clásica","Inter"],["atkinson","Fácil de leer","Atkinson Hyperlegible"],["merriweather","Con serifa","Merriweather"]];
const BRANDS = [["#1f5c3d","Verde"],["#1f4e8c","Azul"],["#5b3a8c","Morado"],["#8c2f39","Burdeo"],["#36414c","Gris"]];

function getLook(){ try { return JSON.parse(localStorage.getItem(LOOK_KEY)) || {}; } catch(e){ return {}; } }
function setLook(patch){ const l = Object.assign(getLook(), patch); Object.keys(l).forEach(k => l[k] == null && delete l[k]); try { localStorage.setItem(LOOK_KEY, JSON.stringify(l)); } catch(e){} applyLook(); }
const hexRgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const rgbHex = c => "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => rgbHex(hexRgb(a).map((v, i) => v + (hexRgb(b)[i] - v) * t));
const lum = h => { const [r,g,b] = hexRgb(h).map(v => { v /= 255; return v <= 0.03928 ? v/12.92 : ((v+0.055)/1.055) ** 2.4; }); return 0.2126*r + 0.7152*g + 0.0722*b; };
const isDark = () => { const t = getTheme(); return t === "oscuro" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches); };
function applyLook(){
  const l = getLook(), st = document.documentElement.style, dark = isDark();
  const font = FONTS.find(f => f[0] === l.font);
  if (font && font[0] !== "figtree"){
    let link = document.getElementById("fontlink");
    if (!link){ link = document.createElement("link"); link.id = "fontlink"; link.rel = "stylesheet"; document.head.appendChild(link); }
    link.href = `https://fonts.googleapis.com/css2?family=${font[2].replace(/ /g, "+")}:wght@400;700&display=swap`;
    st.setProperty("--font-body", `"${font[2]}", system-ui, sans-serif`); st.setProperty("--font-display", `"${font[2]}", system-ui, sans-serif`);
  } else { st.removeProperty("--font-body"); st.removeProperty("--font-display"); }
  if (l.brand){ const b = dark ? mix(l.brand, "#ffffff", 0.4) : l.brand; st.setProperty("--brand", b); st.setProperty("--brand-fg", lum(b) > 0.35 ? "#10140f" : "#ffffff"); }
  else { st.removeProperty("--brand"); st.removeProperty("--brand-fg"); }
  if (l.accent){ st.setProperty("--accent", l.accent); st.setProperty("--accent-fg", lum(l.accent) > 0.3 ? "#1d1606" : "#ffffff");
    st.setProperty("--accent-soft", dark ? mix(l.accent, "#121814", 0.75) : mix(l.accent, "#ffffff", 0.8)); }
  else { ["--accent","--accent-fg","--accent-soft"].forEach(k => st.removeProperty(k)); }
}
applyTheme(getTheme()); applyLook();

// Ofertas: se aplica primero el pack más grande. Ej: 3 x $1.500 con 7 galletas = 2 packs + 1 suelta
const activeOffers = pid => ext("ofertas") && !isKg(P(pid)) ? (S.ofertas || []).filter(o => o.active && o.pid === pid && o.qty > 1).sort((a,b) => b.qty - a.qty) : [];
function lineDisc(pid, qty, price){
  let left = qty, disc = 0; const applied = [];
  for (const o of activeOffers(pid)){ const save = o.qty*price - o.price; if (save <= 0) continue;
    const n = Math.floor(left / o.qty); if (n){ disc += n*save; left -= n*o.qty; applied.push([o, n]); } }
  return { disc, applied, left };
}
function offerHint(pid, qty){
  const os = activeOffers(pid); if (!os.length) return "";
  const { left } = lineDisc(pid, qty, P(pid).price), o = os[os.length - 1];
  if (!left || left >= o.qty) return "";
  const need = o.qty - left;
  return need <= 2 ? `Agrega ${need} más y queda en oferta (${o.qty} por ${clp(o.price)})` : "";
}
// A granel vendido por monto ("$1.000 de pan"): el peso se redondea hacia arriba al gramo y la diferencia de centavos se descuenta, para cobrar justo el monto
function cartLines(){ return ui.cart.map(l => { const p = P(l.pid);
  if (isKg(p)) return { pid:l.pid, qty:l.qty, price:p.price, disc: l.monto ? Math.max(0, lineMoney(l.qty, p.price) - l.monto) : 0, applied:[], kg:true, monto:l.monto };
  const d = lineDisc(l.pid, l.qty, p.price); return { pid:l.pid, qty:l.qty, price:p.price, disc:d.disc, applied:d.applied }; }); }
const lineTotal = l => lineMoney(l.qty, l.price) - l.disc;
const offerTxt = o => `${o.qty} por ${clp(o.price)}`;

const sugerido = (p, s) => Math.max(Math.ceil(p.min*2 - Math.max(s, 0)), 1);

function openGranel(p, idx){
  const cur = idx != null ? ui.cart[idx] : null;
  openModal(`<div class="stack">
    <div class="spread"><h2>${esc(p.name)}</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
    <p class="muted" style="margin:0">${clp(p.price)} el kilo · ${stockPill(p)}</p>
    <div class="row">${[[0.25,"¼ kg"],[0.5,"½ kg"],[1,"1 kg"]].map(([k,t]) => `<button class="chip" data-gkg="${k}">${t}</button>`).join("")}${[500,1000,2000].map(m => `<button class="chip" data-gm="${m}">${clp(m)}</button>`).join("")}</div>
    <div class="grid2">
      <div class="field"><label for="gkg">Peso (kg)</label><input class="input" id="gkg" type="number" step="0.001" min="0" inputmode="decimal" placeholder="Ej: 0,750" value="${cur ? r3(cur.qty) : ""}"></div>
      <div class="field"><label for="gm">O monto ($)</label><input class="input" id="gm" type="number" min="0" inputmode="numeric" placeholder="Ej: 1000" value="${cur?.monto || ""}"></div>
    </div>
    <div class="spread"><span class="muted" id="gtxt">Escribe el peso de la balanza o el monto</span><span class="total" id="gtot">${cur ? clp(cur.monto || lineMoney(cur.qty, p.price)) : "$0"}</span></div>
    <button class="btn primary block" id="gok">${cur ? "Guardar" : "Agregar a la venta"}</button>
    ${cur ? `<button class="btn ghost block" id="gdel">Quitar de la venta</button>` : ""}
  </div>`);
  let st = cur ? { qty:cur.qty, monto:cur.monto || 0 } : { qty:0, monto:0 };
  const show = () => { $("#gtot").textContent = clp(st.monto || lineMoney(st.qty, p.price)); $("#gtxt").textContent = st.qty ? fq(st.qty, p) : "Escribe el peso de la balanza o el monto"; };
  const byKg = v => { st = { qty: r3(Math.max(0, +v || 0)), monto:0 }; show(); };
  const byMonto = v => { const m = Math.max(0, Math.round(+v || 0)); st = { qty: m ? Math.ceil(m / p.price * 1000 - 1e-9) / 1000 : 0, monto:m }; show(); };
  $("#gkg").oninput = e => { byKg(e.target.value); $("#gm").value = ""; };
  $("#gm").oninput = e => { byMonto(e.target.value); $("#gkg").value = st.qty ? st.qty : ""; };
  document.querySelectorAll("[data-gkg]").forEach(b => b.onclick = () => { $("#gkg").value = b.dataset.gkg; $("#gm").value = ""; byKg(b.dataset.gkg); });
  document.querySelectorAll("[data-gm]").forEach(b => b.onclick = () => { $("#gm").value = b.dataset.gm; byMonto(b.dataset.gm); $("#gkg").value = st.qty; });
  $("#gok").onclick = () => { if (!st.qty) return $("#gkg").focus();
    const line = { pid:p.id, qty:st.qty, monto:st.monto || 0 };
    if (cur) Object.assign(cur, line); else ui.cart.push(line);
    closeModal(); render(); if (!cur) toast(`${p.name}: ${fq(st.qty, p)}`); };
  const del = $("#gdel"); if (del) del.onclick = () => { ui.cart.splice(idx, 1); closeModal(); render(); };
  if (!cur) setTimeout(() => $("#gkg")?.focus(), 50);
}

async function createAccount(nombre, usuario, pass, client){
  const { data, error } = await client.auth.signUp({ email:userEmail(usuario), password:pass, options:{ data:{ nombre, usuario:usuario.trim().toLowerCase() } } });
  if (error) throw error;
  if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw new Error("Ese usuario ya existe");
  return data;
}

// Respaldo: todas las tablas en un archivo JSON con la fecha en el nombre
const BACKUP_TABLES = ["productos","movimientos","clientes","fiados","reservas","panes","ajustes","perfiles","proveedores","ofertas","cierres"];
function saveFile(obj, name){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:"application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function downloadBackup(){
  const btn = $("#backup"); btn.disabled = true; btn.textContent = "Preparando respaldo…";
  try {
    if (!isDB()){ saveFile({ tienda:"Demo", creado:new Date().toISOString(), version:1, demo:S }, `respaldo-demo-${hoyChile()}.json`); toast("Respaldo de la demo descargado"); return; }
    const data = {};
    for (const t of BACKUP_TABLES) data[t] = await all(() => sb.from(t).select("*").order(t === "ajustes" ? "clave" : "id"));
    saveFile({ tienda: db.ajustes.tienda_nombre || "Almacén", creado: new Date().toISOString(), version: 1, tablas: data }, `respaldo-almacen-${hoyChile()}.json`);
    toast(`Respaldo descargado: ${data.movimientos.length} movimientos`);
  } finally { btn.disabled = false; btn.textContent = "Descargar respaldo"; }
}
const TABLE_NAMES = { productos:"productos", movimientos:"ventas, compras y conteos", clientes:"clientes", fiados:"fiados y pagos", reservas:"reservas", panes:"panes para reservar",
  ajustes:"ajustes", proveedores:"proveedores", ofertas:"ofertas", cierres:"cierres de caja" };
function openRestore(file){
  const rd = new FileReader();
  rd.onload = () => {
    let b; try { b = JSON.parse(rd.result); } catch(e){ return toast("Ese archivo no es un respaldo"); }
    if (isDB() && !b.tablas) return toast(b.demo ? "Ese es un respaldo de la demo, no de la tienda" : "Ese archivo no es un respaldo de la tienda");
    if (!isDB() && !b.demo) return toast("Ese respaldo es de la tienda; en la demo solo se cargan respaldos de la demo");
    const when = b.creado ? new Date(b.creado).toLocaleString("es-CL", { dateStyle:"medium", timeStyle:"short" }) : "fecha desconocida";
    const rows = isDB() ? Object.entries(b.tablas).filter(([t]) => TABLE_NAMES[t]).map(([t, r]) => `<div class="item"><div class="main">${esc(TABLE_NAMES[t])}</div><span class="qty">${r.length}</span></div>`).join("") : "";
    openModal(`<div class="stack">
      <div class="spread"><h2>Restaurar respaldo</h2><button class="btn ghost sm" data-close>Cerrar</button></div>
      <p style="margin:0">Respaldo de <b>${esc(b.tienda || "")}</b> del ${esc(when)}.</p>
      ${rows ? `<div class="list">${rows}</div>` : ""}
      <p class="small muted" style="margin:0">${isDB() ? "Se agrega lo que falta en la tienda: no se borra ni se cambia nada de lo que ya está. Las cuentas de las personas no se restauran (se crean de nuevo en Equipo y cuenta)." : "La demo vuelve a quedar exactamente como estaba en el respaldo."}</p>
      <button class="btn primary block" id="dorestore">Restaurar</button></div>`);
    $("#dorestore").onclick = () => run(async () => {
      $("#dorestore").disabled = true; $("#dorestore").textContent = "Restaurando…";
      if (!isDB()){ S = b.demo; load(); save(); closeModal(); render(); toast("Demo restaurada"); return; }
      try {
        const r = await q(sb.rpc("restaurar_respaldo", { datos:b.tablas }));
        await dbLoadAll(); closeModal(); render();
        const n = Object.values(r || {}).reduce((a, x) => a + x, 0);

function resizeImage(file){ return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);

    c.getContext("2d").drawImage(img, (img.width - m)/2, (img.height - m)/2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82)); };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("No se pudo leer la imagen")); }; img.src = url; }); }

  const prev = () => { const p = P($("#ofp").value), n = +$("#ofq").value || 0, v = +$("#ofv").value || 0, normal = n * p.price;
    $("#ofprev").textContent = n >= 2 && v > 0 ? (v < normal ? `${n} × ${p.name}: ${clp(v)} en vez de ${clp(normal)} (ahorra ${clp(normal - v)})` : `Ojo: ${clp(v)} no es más barato que ${clp(normal)}`) : `Precio normal de ${n || "…"}: ${clp(normal)}`; };
  ["#ofp","#ofq","#ofv"].forEach(id => $(id).oninput = prev); prev();
  $("#osave").onclick = () => run(async () => { const qty = Math.round(+$("#ofq").value || 0), price = Math.round(+$("#ofv").value || 0);
    if (qty < 2) return toast("El pack debe tener al menos 2 unidades"); if (price <= 0) return $("#ofv").focus();

  </div>`;

async function loadCaja(){
  const box = $("#cajabox"); if (!box) return;
  const r = await act.cajaResumen(); if (ui.view !== "caja" || !$("#cajabox")) return;
  const c = ui.caja || (ui.caja = { fondo: (S.cierres || [])[0]?.fondo ?? 0, contado:{}, note:"" });
  const esp = k => (r.ventas[k] || 0) + (r.abonos[k] || 0) + (k === "efectivo" ? +c.fondo || 0 : 0);
  $("#cajabox").innerHTML = `<div class="card stack">
    <div class="spread"><h3>Desde ${ago(r.desde)}</h3><span class="small muted">${r.num} ventas</span></div>
    <div class="field"><label for="cfondo">Efectivo con que se abrió la caja (sencillo)</label><input class="input" id="cfondo" type="number" min="0" inputmode="numeric" value="${c.fondo}"></div>
    ${MEDIOS.map(([k,n]) => `<div class="countrow" style="grid-template-columns:1fr 110px"><div style="min-width:0"><div style="font-weight:600">${n}</div>
        <div class="small muted">App: <b id="ce_${k}">${clp(esp(k))}</b>${r.abonos[k] ? ` · incluye ${clp(r.abonos[k])} de pagos de fiados` : ""}${k === "efectivo" ? " · incluye el sencillo" : ""}</div><div class="diff" id="cd_${k}"></div></div>
      <input class="input" type="number" min="0" inputmode="numeric" placeholder="Contado" data-cc="${k}" value="${c.contado[k] ?? ""}" aria-label="${n} contado"></div>`).join("")}
    <p class="small muted" style="margin:0">Débito: el total del día en la máquina. Transferencia: lo que llegó a la cuenta.</p>
    <div class="field"><label for="cnote">Nota (opcional)</label><input class="input" id="cnote" value="${esc(c.note)}" placeholder="Ej: faltan $1.000, se pagó al de la bebida"></div>
    <button class="btn primary block" id="cclose">Cerrar caja</button>
  </div>`;
  const upd = () => MEDIOS.forEach(([k]) => { $("#ce_" + k).textContent = clp(esp(k)); const v = c.contado[k], el = $("#cd_" + k);
    if (v === "" || v == null){ el.textContent = ""; return; } const d = +v - esp(k);
    el.textContent = d === 0 ? "Cuadra" : d < 0 ? `Falta ${clp(-d)}` : `Sobra ${clp(d)}`; el.style.color = d === 0 ? "var(--ok)" : d < 0 ? "var(--bad)" : "var(--warn)"; });
  $("#cfondo").oninput = e => { c.fondo = e.target.value; upd(); };
  document.querySelectorAll("[data-cc]").forEach(i => i.oninput = () => { c.contado[i.dataset.cc] = i.value; upd(); });
  $("#cnote").oninput = e => c.note = e.target.value;
  upd();
  $("#cclose").onclick = () => run(async () => {
    if (MEDIOS.some(([k]) => c.contado[k] === "" || c.contado[k] == null)) return toast("Escribe lo contado en cada medio (0 si no hubo)");
    const contado = Object.fromEntries(MEDIOS.map(([k]) => [k, Math.round(+c.contado[k] || 0)]));
    await act.cierre(Math.round(+c.fondo || 0), contado, c.note.trim());
    const dif = MEDIOS.reduce((a,[k]) => a + contado[k] - esp(k), 0);
    ui.caja = null; render(); toast(dif === 0 ? "Caja cerrada: cuadró" : `Caja cerrada: ${dif < 0 ? "faltó" : "sobró"} ${clp(Math.abs(dif))}`); });
}

  }
  if (v === "reservas" && isDB()){
    app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => openReserva(S.reservas.find(r => r.id === b.dataset.res)));
    app.querySelectorAll("[data-rday]").forEach(b => b.onclick = () => { ui.resDay = b.dataset.rday; render(); });
    $("#rcopy").onclick = () => { try { navigator.clipboard.writeText(reservaLink()).then(() => toast("Link copiado"), () => toast(reservaLink())); } catch(e){ toast(reservaLink()); } };
    $("#ropen").onchange = e => run(async () => { await act.setting("reservas_abiertas", e.target.checked); render(); toast(e.target.checked ? "Reservas abiertas" : "Reservas cerradas"); });
    $("#rlim").onchange = e => run(async () => { await act.setting("reservas_hora_limite", +e.target.value); toast("Hora guardada"); });
  }
  if (v === "equipo"){
    $("#logout").onclick = () => run(async () => {
      if (outbox.list().length && !confirm("Hay ventas guardadas en este celular que todavía no se envían. Si sales ahora se enviarán cuando alguien vuelva a entrar en este celular. ¿Salir igual?")) return;
      await sb.auth.signOut(); try { localStorage.removeItem(COPY_KEY); } catch(e){} location.reload(); });
    $("#mypass").onclick = openMyPass;
    if (isAdmin()){
      $("#addu").onclick = openNuevaPersona;
      app.querySelectorAll("[data-user]").forEach(b => b.onclick = () => openPersona(db.team[b.dataset.user]));
      $("#tsave").onclick = () => run(async () => { const n = $("#tname").value.trim(); if (!n) return; await act.setting("tienda_nombre", n); toast("Nombre guardado"); });
    }
  }
  if (v === "reservas" && !isDB()){
    app.querySelectorAll("[data-res]").forEach(b => b.onclick = () => { const r = S.reservas.find(r => r.id === b.dataset.res); r.done = !r.done; save(); render(); });
    const rn = $("#rn"); rn.value = ui.resName || ""; rn.oninput = () => ui.resName = rn.value;
    const step = (b, d) => { ui.resQty[b] = Math.max(0, (ui.resQty[b]||0) + d); const y = window.scrollY; render(); window.scrollTo(0, y); };
    app.querySelectorAll("[data-binc]").forEach(x => x.onclick = () => step(x.dataset.binc, 1));
    app.querySelectorAll("[data-bdec]").forEach(x => x.onclick = () => step(x.dataset.bdec, -1));
    $("#rsave").onclick = () => { const name = rn.value.trim(); if (!name){ rn.focus(); toast("Escribe tu nombre"); return; }
      const detail = resDetail(ui.resQty); if (!detail) return;
      S.reservas.push({ id:uid(), name, detail, at:Date.now(), done:false }); ui.resQty = {}; ui.resName = ""; save(); render(); toast(`Reserva de ${name} recibida`); };
  }
  if (v === "inicio" && !isDB()){
    $("#reset").onclick = () => openModal(`<div class="stack"><h2>¿Reiniciar la demo?</h2><p style="margin:0">Se borran los cambios hechos y vuelven los datos de ejemplo.</p><div class="grid2"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="doreset">Reiniciar</button></div></div>`) || ($("#doreset").onclick = () => { S = buildSeed(); save(); ui.cart = []; ui.recv = { supplier:"Distribuidora Ejemplo", provId:"v1", items:[] }; ui.draft = {}; ui.shop = {}; ui.caja = null; closeModal(); render(); toast("Demo reiniciada"); });
  }
  if (v === "vender"){
    bindSearch(addToCart);
    $("#scan").onclick = () => openScanSheet(p => { addToCart(p); if (!isKg(p)) toast(`+1 ${p.name}`); });
    app.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => { const p = P(b.dataset.quick); addToCart(p); if (!isKg(p)) toast(`+1 ${p.name}`); });
    app.querySelectorAll("[data-gedit]").forEach(b => b.onclick = () => { const i = +b.dataset.gedit; openGranel(P(ui.cart[i].pid), i); });
    app.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { ui.cart[b.dataset.inc].qty++; render(); });
    app.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const l = ui.cart[b.dataset.dec]; if (--l.qty <= 0) ui.cart.splice(b.dataset.dec,1); render(); });
    app.querySelectorAll("[data-medio]").forEach(b => b.onclick = () => { ui.medio = b.dataset.medio; render(); });
    const paga = $("#paga"); if (paga) paga.oninput = () => { ui.paga = +paga.value || 0; const t = cartLines().reduce((a,l) => a + lineTotal(l), 0);
      $("#vuelto").textContent = ui.paga ? (ui.paga < t ? "Falta " + clp(t - ui.paga) : clp(ui.paga - t)) : "—"; };
    $("#confirm").onclick = () => run(async () => { const lines = cartLines(), t = lines.reduce((a,l) => a + lineTotal(l), 0);
      $("#confirm").disabled = true; $("#confirm").textContent = "Guardando…";
      const r = await act.sale(lines, ext("caja") ? ui.medio : "efectivo").finally(render);
      ui.cart = []; ui.paga = 0; ui.medio = "efectivo"; render();
      toast(r === "pendiente" ? `Venta guardada en el celular: ${clp(t)}. Se enviará sola cuando vuelva internet.` : `Venta registrada: ${clp(t)}`); });
  }
  if (v === "recibir"){
    bindSearch(addToRecv);
    $("#sup").oninput = e => { ui.recv.supplier = e.target.value; const n = e.target.value.trim().toLowerCase();
      ui.recv.provId = (S.proveedores || []).find(v => v.name.toLowerCase() === n)?.id || null; };
    app.querySelectorAll("[data-rprov]").forEach(b => b.onclick = () => { const p = provById(b.dataset.rprov);
      ui.recv.provId = p.id; ui.recv.supplier = p.name; softRender(); });
    app.querySelectorAll("[data-rv]").forEach(i => i.onchange = () => { ui.recv.items[i.dataset.rv].vence = i.value; });
    $("#scan").onclick = () => openScanSheet(p => addToRecv(p));
    app.querySelectorAll("[data-rq]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rq].qty = Math.max(0, r3(+i.value||0)); });
    app.querySelectorAll("[data-rc]").forEach(i => i.oninput = () => { ui.recv.items[i.dataset.rc].cost = Math.max(0, +i.value||0); });
    app.querySelectorAll("[data-rq],[data-rc]").forEach(i => i.onchange = render);
    $("#confirm").onclick = () => run(async () => { const n = ui.recv.items.reduce((a,l) => a + (l.qty||0), 0);
      $("#confirm").disabled = true; $("#confirm").textContent = "Guardando…";
      // Un proveedor nuevo escrito a mano queda guardado en la lista
      if (ext("proveedores") && !ui.recv.provId && ui.recv.supplier.trim()) ui.recv.provId = (await act.saveProv(null, { name:ui.recv.supplier.trim(), phone:"", note:"" })).id;
      await act.receive(ui.recv.supplier, ui.recv.items, ui.recv.provId).finally(render);
      ui.recv.items = []; render(); toast(`Recepción guardada: ${n} unidades`); });
  }
  if (v === "contar"){
    app.querySelectorAll("[data-sector]").forEach(b => b.onclick = () => { ui.sector = b.dataset.sector; ui.draft = {}; render(); window.scrollTo(0,0); });
    if (ui.sector){
      $("#back").onclick = () => { ui.sector = null; render(); };
      app.querySelectorAll("[data-cq]").forEach(i => i.oninput = () => { (ui.draft[i.dataset.cq] ||= {}).qty = i.value; });
      app.querySelectorAll("[data-ce]").forEach(i => i.onchange = () => { (ui.draft[i.dataset.ce] ||= {}).est = i.checked; });
      app.querySelectorAll("[data-cn]").forEach(b => b.onclick = () => { const p = P(b.dataset.cn); const d = (ui.draft[p.id] ||= {}); const off = d.none ?? !p.has; d.none = !off; render(); });
      $("#scan").onclick = () => openScanSheet(p => {
        if (p.cat !== ui.sector) toast(`${p.name} es del sector ${p.cat}; se suma igual`); else toast(`+1 ${p.name}`);
        const d = (ui.draft[p.id] ||= {}); d.qty = String(r3((parseFloat(d.qty)||0) + 1)); d.none = false; render(); });
      $("#addp").onclick = () => openProductForm(ui.sector, "", () => render());
      $("#finish").onclick = finishCount;
    }
  }
  if (v === "productos"){
    $("#pq").oninput = e => { ui.prodQuery = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
    app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { ui.prodFilter = b.dataset.f; render(); });
    app.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openProduct(P(b.dataset.open)));
    $("#addp").onclick = () => openProductForm(ui.prodFilter==="Todos" ? null : ui.prodFilter, "", null);
  }
  if (v === "historial"){
    app.querySelectorAll("[data-hf]").forEach(b => b.onclick = () => { ui.histFilter = b.dataset.hf; render(); });
  }
}
// ---------- Inicio: demo o tienda con inicio de sesión ----------
function gate(html){ MODE = null; $("nav.tabs").hidden = true; $("#app").innerHTML = html; window.scrollTo(0,0); }
const gateHead = () => header("Almacén", "Sistema de inventario");
const demoLink = `<a class="btn ghost block" style="text-align:center" href="?demo">Ver demo con datos ficticios</a>`;
function startDemo(){ MODE = "demo"; load(); $("nav.tabs").hidden = false; render(); }

// La misma página sirve de demo pública (para el CV) y de sistema de la tienda.
// En las direcciones de config.direccionesDemo se ve la demo, salvo que se abra con ?tienda
// (desde ahí ese navegador lo recuerda). En cualquier otra dirección se entra a la tienda.
const STORE_FLAG = "almacen-modo-tienda";
function storeDevice(on){ try { if (on === undefined) return localStorage.getItem(STORE_FLAG) === "1"; on ? localStorage.setItem(STORE_FLAG, "1") : localStorage.removeItem(STORE_FLAG); } catch(e){ return false; } }

async function boot(){
  const params = new URLSearchParams(location.search);
  if (params.has("tienda")) storeDevice(true);
  // En una dirección propia de la tienda (no la del CV) se entra directo a la tienda
  const cvHost = (CFG.direccionesDemo || []).includes(location.hostname);
  if (!DB_READY || params.has("demo") || (cvHost && !storeDevice())) return startDemo();
  gate(`${gateHead()}<div class="empty">Conectando…</div>`);
  try { await loadScript(SB_SRC); }
  catch(e){ return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Sin conexión</h2><p style="margin:0">No se pudo conectar con la base de datos de la tienda. Revisa el internet e intenta de nuevo.</p><button class="btn primary block" onclick="location.reload()">Reintentar</button></div>${demoLink}</div>`); }
  sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth:{ storageKey:"almacen-sesion" } });
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && MODE) location.reload(); });
  const { data, error } = await sb.auth.getSession();
  if (data.session) return enterDB(data.session.user);
  // Sin internet la sesión vencida no se puede renovar: si hay una copia de este celular, se abre con ella
  if (error && isNetErr(error)){ try { const st = JSON.parse(localStorage.getItem("almacen-sesion")); const u = st?.user || st?.currentSession?.user; if (u && loadCopy(u.id)) return enterDB(u); } catch(e){} }
  showLogin();
}

async function showLogin(){
  let first = false;
  try { first = !(await q(sb.rpc("hay_admin"))); } catch(e){}
  gate(`${gateHead()}<div class="stack">
    ${first ? `<div class="card stack"><h2>Configurar la tienda</h2>
      <p class="small muted" style="margin:0">Todavía no hay cuentas. Crea la cuenta maestra: es la administradora principal, nadie más la puede cambiar ni quitarle el acceso, y con ella se agregan después las demás personas.</p>
      <div class="field"><label for="an">Nombre</label><input class="input" id="an" placeholder="Ej: Rosa"></div>
      <div class="field"><label for="au">Usuario para entrar</label><input class="input" id="au" autocapitalize="none" autocomplete="username" placeholder="Ej: rosa"></div>
      <div class="field"><label for="ap">Contraseña (mínimo 6 caracteres)</label><input class="input" id="ap" type="password" autocomplete="new-password"></div>
      <button class="btn primary block" id="asave">Crear cuenta</button></div>`
    : `<form class="card stack" id="loginf"><h2>Entrar</h2>
      <div class="field"><label for="lu">Usuario</label><input class="input" id="lu" autocapitalize="none" autocomplete="username" required></div>
      <div class="field"><label for="lp">Contraseña</label><input class="input" id="lp" type="password" autocomplete="current-password" required></div>
      <button class="btn primary block" id="lgo">Entrar</button>
      <p class="small muted" style="margin:0">¿No tienes cuenta? Pídesela a la administradora de la tienda.</p></form>`}
    ${demoLink}
  </div>`);
  if (first){
    $("#asave").onclick = () => run(async () => {
      const n = $("#an").value.trim(), u = $("#au").value.trim(), pw = $("#ap").value;
      if (!n) return $("#an").focus(); if (!u) return $("#au").focus(); if (pw.length < 6) return toast("La contraseña debe tener al menos 6 caracteres");
      const data = await createAccount(n, u, pw, sb);
      if (!data.session) return toast("Cuenta creada, pero Supabase pide confirmar el correo. Desactiva \"Confirm email\" (ver guía) y entra.");
      enterDB(data.session.user);
    });
  } else {
    $("#loginf").onsubmit = e => { e.preventDefault(); run(async () => {
      const btn = $("#lgo"); btn.disabled = true; btn.textContent = "Entrando…";
      const { data, error } = await sb.auth.signInWithPassword({ email:userEmail($("#lu").value), password:$("#lp").value });
      btn.disabled = false; btn.textContent = "Entrar";
      if (error) throw error;
      enterDB(data.user);
    }); };
  }
}

async function enterDB(user){
  gate(`${gateHead()}<div class="empty">Cargando datos de la tienda…</div>`);
  try {
    const prof = await q(sb.from("perfiles").select("*").eq("id", user.id).maybeSingle());
    if (!prof || !prof.activo){ gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>Cuenta sin acceso</h2>
      <p style="margin:0">Tu cuenta${prof ? ` (${esc(prof.usuario)})` : ""} existe, pero la administradora todavía no le da acceso, o se lo quitó.</p>
      <button class="btn primary block" id="retry">Revisar de nuevo</button><button class="btn block" id="out">Salir</button></div></div>`);
      $("#retry").onclick = () => enterDB(user); $("#out").onclick = () => sb.auth.signOut().then(() => location.reload());
      return;
    }
    db.profile = prof;
    await dbLoadAll();
  } catch(e){
    const copy = isNetErr(e) && loadCopy(user.id);
    if (copy){
      Object.assign(db, { profile:copy.profile, team:copy.team, panes:copy.panes, ajustes:copy.ajustes, loadedAt:copy.at, offline:true, joined:true });
      S = copy.S; applyPending(); net.fail = true;
      MODE = "db"; $("nav.tabs").hidden = false; ui.recv = { supplier:"", provId:null, items:[] };
      dbSubscribe(); render(); return toast("Sin internet: se abrió con los datos guardados en este celular");
    }
    return gate(`${gateHead()}<div class="stack"><div class="card stack"><h2>No se pudieron cargar los datos</h2><p style="margin:0">${esc(friendly(e))}</p>
      <button class="btn primary block" onclick="location.reload()">Reintentar</button></div></div>`);
  }
  MODE = "db"; $("nav.tabs").hidden = false; ui.recv = { supplier:"", provId:null, items:[] };
  dbSubscribe(); render(); flushOutbox();
}
// Al volver a la app después de un rato (celular bloqueado), se trae lo que cambió
document.addEventListener("visibilitychange", () => { if (isDB() && !document.hidden && Date.now() - db.loadedAt > 60e3) reloadSoon(); });

// App instalable: el service worker guarda una copia de la app para que abra aunque el internet esté lento
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
})();
</script>
