<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Reserva tu pan en el almacén desde el celular.">
<title>Reservar pan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Página para clientes: una sola columna, mismos colores que la app de la tienda */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eaeee5; --fg:#1d2a22; --muted:#5d6b62; --line:#d7ddd2;
  --brand:#1f5c3d; --brand-fg:#ffffff; --accent:#e0a526;
  --ok:#2c7a4b; --ok-soft:#dcefe2; --warn:#a86a00; --warn-soft:#fbecd0; --bad:#b33a2b; --bad-soft:#f8dfdb;
  --font-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1a221d; --surface-2:#232d26; --fg:#e6ece6; --muted:#9aa89e; --line:#2f3b33;
  --brand:#5fb487; --brand-fg:#0f1a14; --accent:#f0bd4f;
  --ok:#6cc893; --ok-soft:#1e3a2a; --warn:#f0bd4f; --warn-soft:#3a3120; --bad:#ef8a7c; --bad-soft:#3d2320;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--font-display);font-weight:800;font-size:26px;margin:8px 0 0;letter-spacing:-.01em}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:600;width:100%}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.ghost{background:transparent;padding:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}
.stepper span{min-width:2.4ch;text-align:center;font-weight:700;font-size:17px}
.days{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:600}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.none{background:var(--surface-2);color:var(--muted)}
.error{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"><p class="muted">Cargando…</p></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CFG = window.ALMACEN_CONFIG || {};
const MINE = "mis-reservas-pan", ME = "datos-cliente";
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const STATE = { pendiente:["warn","Pendiente"], entregada:["ok","Entregada"], cancelada:["none","Cancelada"] };
const dayName = (d, info) => d === info.hoy ? "hoy" : "mañana";

if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){
  $("#app").innerHTML = `<div class="card stack"><h2>Reservas no disponibles</h2><p style="margin:0">Las reservas de pan todavía no están activadas en este almacén.</p></div>`;
  return;
}
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth:{ persistSession:false, autoRefreshToken:false } });
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };
const msg = e => /Failed to fetch|NetworkError|Load failed/i.test(e?.message || "") ? "Sin conexión a internet. Intenta de nuevo." : (e?.message || "Algo salió mal");

let info = null, mine = [];
const form = { qty:{}, para:null, ...get(ME, {}) };

async function start(){
  try { info = await rpc("info_reservas"); }
  catch(e){ $("#app").innerHTML = `<div class="card stack"><h2>No se pudo cargar</h2><p style="margin:0">${esc(msg(e))}</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>`; return; }
  document.title = "Reservar pan · " + info.tienda;
  await loadMine();
  render();
}
async function loadMine(){
  const ids = get(MINE, []);
  const rows = await Promise.all(ids.map(id => rpc("estado_reserva", { p_id:id }).catch(() => undefined)));
  // Se guardan solo las de hoy en adelante
  mine = rows.filter(r => r && r.dia >= info.hoy);
  if (rows.every(r => r !== undefined)) put(MINE, mine.map(r => r.id));
}
const lateToday = () => info.hora_chile >= info.hora_limite;

function render(){
  if (!form.para || (form.para === "hoy" && lateToday())) form.para = lateToday() ? "manana" : "hoy";
  const total = Object.values(form.qty).reduce((a, n) => a + n, 0);
  $("#app").innerHTML = `<div class="stack">
    <h1><small>Reserva de pan</small>${esc(info.tienda)}</h1>
    ${mine.length ? `<div class="card stack"><h3>Tus reservas</h3>${mine.map(r => `<div class="stack" style="gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Para ${dayName(r.dia, info)}</span><span class="pill ${STATE[r.estado][0]}">${STATE[r.estado][1]}</span></div>
      <div class="muted small">${esc(r.detalle)}</div>
      ${r.estado === "pendiente" ? `<button class="btn ghost small" data-cancel="${r.id}">Cancelar esta reserva</button>` : ""}</div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:0">')}</div>` : ""}
    ${!info.abiertas ? `<div class="card stack"><h2>Reservas cerradas</h2><p style="margin:0">Por ahora el almacén no está recibiendo reservas. Vuelve a intentar más tarde.</p></div>` : !info.panes.length ? `<div class="card"><p style="margin:0">No hay pan para reservar en este momento.</p></div>` : `
    <div class="card stack">
      <h2>¿Qué pan quieres?</h2>
      <div>${info.panes.map(b => `<div class="item"><div class="main">${esc(b)}</div>
        <div class="stepper"><button data-dec="${esc(b)}" aria-label="Quitar ${esc(b)}">−</button><span>${form.qty[b] || 0}</span><button data-inc="${esc(b)}" aria-label="Agregar ${esc(b)}">+</button></div></div>`).join("")}</div>
      <div class="field"><label>¿Para cuándo?</label>
        <div class="days"><button class="day" data-para="hoy" aria-pressed="${form.para==="hoy"}" ${lateToday()?"disabled":""}>Hoy</button><button class="day" data-para="manana" aria-pressed="${form.para==="manana"}">Mañana</button></div>
        ${lateToday() ? `<span class="small muted">Las reservas para hoy se reciben hasta las ${info.hora_limite}:00.</span>` : ""}</div>
      <div class="field"><label for="n">Tu nombre</label><input class="input" id="n" autocomplete="name" value="${esc(form.nombre || "")}" placeholder="Ej: Ana Torres"></div>
      <div class="field"><label for="t">Tu celular (opcional, para avisarte cuando esté listo)</label><input class="input" id="t" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" value="${esc(form.telefono || "")}" placeholder="9 1234 5678"></div>
      <div class="field"><label for="o">Nota (opcional)</label><input class="input" id="o" maxlength="200" value="${esc(form.nota || "")}" placeholder="Ej: bien tostadas"></div>
      <div class="error" id="err" hidden></div>
      <button class="btn primary" id="go" ${total ? "" : "disabled"}>Reservar${total ? ` ${total} ${total === 1 ? "pan" : "panes"}` : ""}</button>
    </div>`}
    <p class="small muted" style="margin:0;text-align:center">Pagas al retirar en el almacén. · <a href="tienda.html?tienda" style="color:inherit">Más del almacén</a></p>
  </div>`;
  bind();
}
function bind(){
  const keep = () => { const n = $("#n"), t = $("#t"), o = $("#o"); if (n){ form.nombre = n.value; form.telefono = t.value; form.nota = o.value; } };
  const step = (b, d) => { keep(); form.qty[b] = Math.max(0, Math.min(100, (form.qty[b] || 0) + d)); const y = scrollY; render(); scrollTo(0, y); };
  document.querySelectorAll("[data-inc]").forEach(x => x.onclick = () => step(x.dataset.inc, 1));
  document.querySelectorAll("[data-dec]").forEach(x => x.onclick = () => step(x.dataset.dec, -1));
  document.querySelectorAll("[data-para]").forEach(x => x.onclick = () => { keep(); form.para = x.dataset.para; render(); });
  document.querySelectorAll("[data-cancel]").forEach(x => x.onclick = async () => {
    if (!confirm("¿Cancelar esta reserva?")) return;
    try { const r = await rpc("cancelar_reserva", { p_id:x.dataset.cancel }); mine = mine.map(m => m.id === r.id ? r : m); render(); } catch(e){ alert(msg(e)); } });
  const t = $("#t"); if (t) t.oninput = () => { const v = t.value.replace(/[^\d +]/g, "").replace(/(?!^)\+/g, ""); if (v !== t.value) t.value = v; };
  const go = $("#go"); if (!go) return;
  go.onclick = async () => {
    keep();
    const err = $("#err"); err.hidden = true;
    if ((form.nombre || "").trim().length < 2){ $("#n").focus(); err.textContent = "Escribe tu nombre"; err.hidden = false; return; }
    // Aviso rápido con las reservas guardadas en este celular (la base de datos igual revisa el límite)
    const dia = form.para === "hoy" ? info.hoy : new Date(Date.parse(info.hoy + "T12:00:00Z") + 864e5).toISOString().slice(0, 10), lim = info.por_persona || 2;
    if (mine.filter(r => r.dia === dia && r.estado !== "cancelada").length >= lim){ err.textContent = `Ya tienes ${lim === 1 ? "una reserva" : lim + " reservas"} para ${form.para === "hoy" ? "hoy" : "mañana"}. Si necesitas más pan, habla directo con el almacén.`; err.hidden = false; return; }
    // Celular chileno: 9 números (se acepta con +56 delante)
    const d = (form.telefono || "").replace(/\D/g, "");
    if (d && d.length !== 9 && !(d.length === 11 && d.startsWith("56"))){ $("#t").focus(); err.textContent = "El celular debe tener 9 números, por ejemplo 9 1234 5678"; err.hidden = false; return; }
    go.disabled = true; go.textContent = "Reservando…";
    try {
      const items = Object.fromEntries(Object.entries(form.qty).filter(([, n]) => n > 0));
      const r = await rpc("crear_reserva", { p_nombre:form.nombre, p_telefono:form.telefono || "", p_items:items, p_para:form.para, p_nota:form.nota || "" });
      put(MINE, [...get(MINE, []), r.id]); put(ME, { nombre:form.nombre, telefono:form.telefono });
      form.qty = {}; form.nota = "";
      await loadMine().catch(() => {});
      $("#app").innerHTML = `<div class="stack"><h1><small>Reserva de pan</small>${esc(info.tienda)}</h1>
        <div class="card stack" style="text-align:center"><h2>¡Reserva lista!</h2>
          <p style="margin:0">${esc(r.detalle)}, para ${dayName(r.dia, info)}.</p>
          <p class="small muted" style="margin:0">Retírala diciendo tu nombre. Puedes volver a esta página para ver si ya está lista.</p>
          <button class="btn" id="back">Volver</button></div></div>`;
      $("#back").onclick = render;
    } catch(e){ err.textContent = msg(e); err.hidden = false; go.disabled = false; go.textContent = "Reservar"; }
  };
}
// Mientras la página está abierta, se revisa si la reserva cambió de estado
setInterval(() => { if (!document.hidden && mine.some(r => r.estado === "pendiente") && !document.activeElement?.matches("input")) loadMine().then(() => { if (!$("#back")) render(); }, () => {}); }, 30e3);
start();
})();
</script>
</body>
</html>
